title:
  de: Transparentpapier.
  en: Tracing Paper
order: 120
lang: de
translation: reviewed
description:
  de: |
    Wort und Unwort, Wort und Synonym.\
    Hieroglyphen mit SF-Weekly-Buchstaben, Ziffern, Symbolen und Worten.\
    Cut-out und Graphit in und auf einem Sandwich aus Transparentpapieren mit Vinylkleber.\
    Die Größen variieren.\
    seit 1997
  en: |
    Word and taboo word, word and synonym.\
    Hieroglyphics paired with letters, numbers, symbols and words from the SF-Weekly.

    Cut-out and graphite in and on a sandwich of tracing paper with vinyl adhesive.\
    Varying dimensions.\
    since 1997
