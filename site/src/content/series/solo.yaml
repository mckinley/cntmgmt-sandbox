title:
  de: solo.
  en: solo
order: 100
lang: de
translation: reviewed
description:
  de: |
    Basiert auf Tuschezeichnungen. Inspiriert durch endlosen Hören einer Detektivinnen-Geschichte in Madrid – auf Spanisch – beim Selbstversuch die Sprache ohne Extra-Aufwand zu erlernen.\
    Acryl auf Leim auf Leinwand.\
    20×20 cm, 123×63 cm, 123×83 cm\
    2006
  en: |
    This series of work is based on an almost endless listening to a spanish audio book while trying to learn the language without any extra effort. The story was on a detective solving a crime in Madrid.\
    Acrylic on canvas.\
    20 × 20 cm, 123 × 63 cm, 123 × 83 cm\
    2006
