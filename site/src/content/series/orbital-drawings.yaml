title:
  en: Orbital Drawings
order: 20
lang: en
translation: none
description:
  en: |
    Review by Larissa Archer: Kathrin Feser’s orbital drawings, made from using whatever round, traceable objects she has on hand, are repetitive and hypnotic. Simple circles combine to create amoeba-like blobs that look as if they’d explode like a water balloon if you pricked them.

    _Orbital Drawings_, end 2010 until present, archival ink, silver ink, acrylic on paper.\
    Sizes vary.
cover: /media/gallery/orbital-drawings/cover-rund-50-sw_3.jpg
