description:
  de: |
    Wesen aus transparentem Klebeband und Luft.\
    25 - 50 m Klebeband in 8 Schichten.\
    Größen circa 10 x 30 x 10 cm, 25 x 25 x 170 cm\
    seit 1999
  en: |
    Creatures from my hieroglyphic drawings made from packaging tape and air.\
    25 – 50 m tape in approx. 8 layers, each.\
    Sizes between 10 × 30 × 10 cm and 25 × 25 × 170 cm\
    since 1999\
    The very first pieces of this kind were made in 1999 as part of my MFA-final-work.
