body:
  de: |
    **Kaufhaus der Kunst**\
    **art to go**

    BBK-Mitglieder präsentieren ihre Werke\
    und bieten diese zum Verkauf an.

    Am 21.10.22 – lange Kulturspeicher Nacht\
    \+ 22./23.10.22 + 29./30.10.22 und 05./06.11.22\
    findet in der BBK Galerie der Kunstmarkt „art to go“ statt.

    Freitag, den 21.10.22 (Jubiläumsnacht) 18 – 24 Uhr,\
    an den anderen Tagen Jeweils von: 11:00 – 19:00 Uhr

    BBK-Galerie\
    Oskar-Laredo-Platz 1, Würzburg
  en: |
    **Art department store**\
    **art to go**

    BBK members present their works and offer them for sale.

    October 21, 2022 – long Kulturspeicher night\
    \+ October 22/23 + October 29/30 and November 5/6, 2022\
    the art market “art to go” takes place at the BBK Gallery.

    Friday October 21, 2022 (anniversary night) 6 pm – midnight,\
    on all other days: 11 am – 7 pm

    BBK-Galerie\
    Oskar-Laredo-Platz 1, Würzburg
