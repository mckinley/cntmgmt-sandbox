  de: |
    **artwars 7**\
    MAKE ART NOT WAR\
    ...and smile under your mask!

    **ART – SOUND – FOOD**

    Vernissage // Nach dem Shutdown // 10 – 22 Uhr\
    Weitere Infos unter [artwars](https://www.artwars.eu/)

    (Bei einem weiteren Shutdown werden neue Ersatztermine festgelegt)\
    HEREINSPAZIERT, HEREINSPAZIERT!\
    Die Artwars-Cru öffnet wieder ihre Tore!\
    Artwars ist ein Kollektiv aus unterschiedlichen internationalen Künstlern.\
    Egal ob hören, sehen, schmecken, fühlen oder riechen

    Hier gibt’s was für alle Sinne.\
    Lasst uns diese gemeinsam feiern!

    Winterhäuser Straße 22, ehem. Lackfabrik, 97084 Würzburg

    Öffnungszeiten jeweils Sa & So 10 – 22 Uhr (nach dem Shutdown)
  en: |
    **artwars 7**\
    MAKE ART NOT WAR\
    …and smile under your mask!

    **ART – SOUND – FOOD**

    Opening reception // After the lockdown // 10 am – 10 pm\
    More info at [artwars](https://www.artwars.eu/)

    (If there is another lockdown, new alternative dates will be set)\
    COME ONE, COME ALL!\
    The Artwars crew opens its doors again!\
    Artwars is a collective of diverse international artists.\
    Whether hearing, seeing, tasting, feeling or smelling

    Something for all the senses here.\
    Let’s celebrate them together!

    Winterhäuser Straße 22, former paint factory, 97084 Würzburg

    open Sat & Sun 10 am – 10 pm (after the lockdown)
