    **25. und 26.6.2022**\
    **MainArt 2022**\
    **in Margetshöchheim**

    Ich stelle in der “kleinen Industrie” meine neuesten Ping-Pong Collagen aus:\
    Mainstraße 7-10

    Ausserdem ist im Rathaus (Mainstraße 15) das Modell meiner 6 Meter hohen Palme\* zu sehen!

    - Wettbewerb “Bildende Kunst am Mainufer”
  en: |
    **June 25 and 26, 2022**\
    **MainArt 2022**\
    **in Margetshöchheim**

    I am showing my latest Ping-Pong collages at “kleine Industrie”:\
    Mainstraße 7–10

    Also on view at the town hall (Mainstraße 15): the model for my 6-metre-high palm tree\*

    - Competition “Visual Art on the Main Riverbank”
