body:
  de: |
    Herzliche Einladung zur\
    **Gemeinschaftsausstellung von\
    Raoul Kaffka, _Tierportraits_\
    Kathrin Feser, _nitty-gritty blender_\
    und Stephan Nüsslein, _Metallverformung_**

    **15. März – 14. April 2019**

    **Vernissage ist am Freitag, 15. März um 18 Uhr**\
    im [Bürgerbräu](https://www.buergerbraeu-wuerzburg.de/) **Sudhaus**

    Die Ausstellung wird an jedem der Samstage zw. 10 und 13 Uhr,\
    bzw. nach Vereinbarung\* geöffnet sein.

    _\*(bitte eine Email über diese WebSeite an mich)_
  en: |
    Warm invitation to the\
    **group exhibition by\
    Raoul Kaffka, _Tierportraits_\
    Kathrin Feser, _nitty-gritty blender_\
    and Stephan Nüsslein, _Metallverformung_**

    **March 15 – April 14, 2019**

    **Opening reception: Friday, March 15 at 6 pm**\
    at [Bürgerbräu](https://www.buergerbraeu-wuerzburg.de/) **Sudhaus**

    The exhibition will be open each Saturday between 10 am and 1 pm,\
    or by appointment.

    _(please send an email via this website)_
