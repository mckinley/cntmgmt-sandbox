title:
  de: Maximilianeum in München
date: "2006-04-20"
lang: de
translation: reviewed
images:
  - src: /media/news/2006/Maximilianeum.jpg
body:
  de: |
    Durch eine Ausschreibung, Bewerbung und Jurierung erhielt ich die Gelegenheit zu einer Einzelausstellung im Maximilianeum in München. Die Ausstellung im Südflügel des Gebäudes geht vom **27. April bis 4. August 2006**. Ich nenne sie _erste Szenen aus dem dritten Akt {der Zukunft}_. Konzeptionell dreht sich alles um Zukunftsvisionen, Zukunftsforschung, Utopien und eine Zeitreise in die Zukunft der Kulturen. Zu sehen sind viele Cut-Outs, Tusche auf Papieren mit cut-out, Transparentpapierarbeiten und Acrylbilder. Zur Vernissage am 27. April um **17 Uhr** muß man sich vorab angemeldet haben und die Einladungskarte an der Pforte zeigen. Es sprechen Franz Maget, Peter Hufe und Klaus von Gaffron. Ab dem 2. Mai ist die Ausstellung dann normal zu besuchen.

    Maximilianeum, Südbau, 2. Obergeschoß, Geschäftsstelle der SPD-Fraktion im Bayerischen Landtag, München, Mo|Di|Mi|Do 10 – 16 Uhr.
  en: |
    After the call for submission, and being selected by 2 different juries (Würzburg and Munich), I have the opportunity of a solo show at the Maximilianeum in Munich. The exhibition – \_erste Szenen aus dem dritten Akt {der Zukunft} \[First Scenes from the Third Part of Future] in the building’s South Wing will be up from **April 27 to August 4**. The concept and work circle around visions of the future, research in future, Utopia, and time travel through the future of cultures. There will be many cut-outs, ink on layered paper with cut-outs, tracing paper pieces and acrylic paintings. It is recommended to sign up ahead of time, and to bring your invitation card for passing the building’s gate in order to attend the opening reception on **April 27 at 5 pm**. Starting Monday, May 2, the exhibition will be open to the public. The Maximilianeum is a visually impressive building, elevated above the Isar river it overlooks the wide and feudal Maximilianstraße. The monument is enthroned on this street’s end. At present the Maximilianeum is hosting the Bavarian State Government.

    Maximilianeum, South Wing, Bavarian Government, SPD-Fraction, Munich\
    Mon|Tue|Wed|Thur 10 am – 4 pm. South-Wing, 3rd. floor.
