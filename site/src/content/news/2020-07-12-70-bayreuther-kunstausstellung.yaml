body:
  de: |
    **70. Bayreuther Kunstausstellung**\
    Jurierte Gruppenausstellung\
    19\. Juli bis 23. August 2020

    Veranstalter: Kunstverein Bayreuth e.V.

    An Ort und Stelle –\
    eine Serie an Collagen als Ergebnis der Zusammenarbeit von Kristin Finsterbusch und Kathrin Feser.

    Das visuelle Spiel ist hier Strategie, ein Austausch bzw. In-Bewegung-halten von Grafik und Objekten sind Ausgangspunkt für diese hier gezeigten Arbeiten. Die erkennbar unterschiedliche Herangehensweise von realistischen und unrealistischen Elementen vermischt mit bekannten oder unbekannten grafischen Varianten erzeugt in der Betrachtung, einen pingpong-ähnlichen Zustand. Dabei ist nicht nur eine Korrespondenz zwischen den bildlichen Akteuren erwünscht, sondern es präsentiert sich vor allem die Perspektive, mit Erfahrungen und deren Deutungen flexibel umzugehen.

    Sämtliche Fotos als Edition mit einer Auflage von 10 Fine Art Prints.

    [Neues Schloß der Erimitage](https://goo.gl/maps/PkfiGVCSGhZcTHBx5)\
    Ermitage 1, Bayreuth\
    geöffnet täglich von 10 bis 18 Uhr.
  en: |
    **70th Bayreuth Art Exhibition**\
    Juried group exhibition\
    July 19 – August 23, 2020

    Organiser: Kunstverein Bayreuth e.V.

    _An Ort und Stelle_ –\
    a series of collages created in collaboration by Kristin Finsterbusch and Kathrin Feser.

    The visual play here is strategy; the exchange and keeping-in-motion of graphic elements and objects is the starting point for the works shown. The markedly different approaches – realistic and unrealistic elements mixed with familiar and unfamiliar graphic variants – create, in the act of viewing, a ping-pong-like state. Not only is a correspondence between the pictorial actors desired, but above all the perspective of engaging flexibly with experiences and their interpretations.

    All photographs as editions of 10 fine art prints.

    [Neues Schloß der Erimitage](https://goo.gl/maps/PkfiGVCSGhZcTHBx5)\
    Ermitage 1, Bayreuth\
    open daily 10 am – 6 pm.
