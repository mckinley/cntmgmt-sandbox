  de: |
    **21.5. – 6.6.2021**\
    **ARTWARS 7**\
    Make Art Not War!

    21.5. – 23.5.2021 von 12 – 22 Uhr\
    danach 14 – 19 Uhr

    Winterhäuser Straße 22, 97804 Würzburg

    Zutritt nur mit FFP2 Maske, gültigem Negativ Test und Erhebung der Kontaktdaten!

    Artwars ist ein Kollektiv aus unterschiedlichen internationalen Künstlern.

    Egal ob hören, sehen, schmecken, fühlen oder riechen\
    Hier gibt’s was für alle Sinne.\
    Lasst uns diese gemeinsam feiern!

    Weitere Infos unter // [www.artwars.eu](http://www.artwars.eu)\
    Instagram // [www.instagram.com/artwars\_eu](http://www.instagram.com/artwars_eu)
  en: |
    **May 21 – June 6, 2021**\
    **ARTWARS 7**\
    Make Art Not War!

    May 21–23, 2021 from 12 – 10 pm\
    thereafter 2 – 7 pm

    Winterhäuser Straße 22, 97804 Würzburg

    Entry only with FFP2 mask, valid negative test, and contact data registration!

    Artwars is a collective of diverse international artists.

    Whether hearing, seeing, tasting, feeling or smelling\
    Something for all the senses here.\
    Let’s celebrate them together!

    More info at // [www.artwars.eu](http://www.artwars.eu)\
    Instagram // [www.instagram.com/artwars\_eu](http://www.instagram.com/artwars_eu)
