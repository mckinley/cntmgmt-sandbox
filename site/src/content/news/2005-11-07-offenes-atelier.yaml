body:
  de: |
    Ich arbeite seit dem Sommer an viel Neuem. Dies ist zu sehen, in Teilen, beim diesjährigen offenen Atelier.

    **19. und 20. November 2005**, zwischen 14 und 19 Uhr.
  en: |
    This summer I am working on many new things to be seen in part at my open studios in Veitshöchheim.

    **November 19 and November 20**, from 2 pm to 7 pm.
