body:
  de: |
    ### orbital drawings

    Meine _orbital drawings_ verlassen das Atelier! Einige davon werden bei [31 Rausch](http://www.31rausch.com/31_Rausch_St.html) in SOMA ausgestellt. Kommt also bitte zahlreich vorbei und feiert dieses Ereignis mit mir! Vernissage ist diesen Freitag am 22. Juni 2012 zwischen 18 Uhr und 22 Uhr.\
    Zusätzlich biete ich noch einen monochromen Siebdruck in limitierter Auflage an – 75 Drucke, internationales Orange _(die Farbe der Golden Gate Bridge)_, signiert, numeriert und datiert.

    Freue mich darauf Euch zu sehen!

    Ausstellungsdauer 22. Juni bis 26. Juli 2012

    Freue mich sehr über den Bericht und die Fotos zur Ausstellung auf [ArtBusiness.com](http://www.artbusiness.com/1open/062212.html) von Larissa Archer, Clare Coppel und Alan Bamberger!

    Sechs Stunden Vernissage……mit unzähligen Besuchern, vielen Spezialgästen, extrem positiven Kommentaren und inspirierenden Gesprächen über meine Arbeiten, war eine wunderbare Stimmung!

    _**31 Rausch**_\
    [31 Rausch Street](http://maps.google.com/maps?q=31+Rausch+Street,+San+Francisco,+CA\&hl=en\&ll=37.776312,-122.408799\&spn=0.007937,0.014538\&sll=37.0625,-95.677068\&sspn=63.856965,108.808594\&oq=31+Rausch\&hnear=31+Rausch+St,+San+Francisco,+California+94103\&t=m\&z=17) an der Folsom Street\
    San Francisco, CA 94103\
    Geöffnet nach Vereinbarung.\
    Chris McCaw\
    Telefon 415.552.8708\
    <chris@chrismccaw.com>
  en: |
    ### orbital drawings

    My _orbital drawings_ are leaving the studio! I will exhibit a bunch of them at [31 Rausch](http://www.31rausch.com/31_Rausch_St.html) in SOMA. So please come on by and celebrate this exciting event with me! Opening reception will be this Friday, June 22nd 2012 between 6 pm and 10 pm.\
    In addition I will offer an orbital drawing as a limited edition silkscreen print – 75 prints, monochrome in international orange, signed and dated.

    Within the next days I will update this post on the duration of the show.\
    Looking forward to seeing you all!

    You can come and visit my show between June 22nd and July 26th, 2012

    I am very happy about, and inspired by the review and the photos published on [ArtBusiness.com](http://www.artbusiness.com/1open/062212.html) by Larissa Archer, Clare Coppel und Alan Bamberger – thank you!

    The opening night was full of great conversations and comments, six hours filled with tons of visitors, lots of special guests, positive feed back, and a great atmosphere – pretty amazing! Hadn’t imagined anything like this. What a great push, I am thrilled!

    _**31 Rausch**_\
    [31 Rausch Street at Folsom Street](http://maps.google.com/maps?q=31+Rausch+Street,+San+Francisco,+CA\&hl=en\&ll=37.776312,-122.408799\&spn=0.007937,0.014538\&sll=37.0625,-95.677068\&sspn=63.856965,108.808594\&oq=31+Rausch\&hnear=31+Rausch+St,+San+Francisco,+California+94103\&t=m\&z=17)\
