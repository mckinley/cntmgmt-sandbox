body:
  de: |
    **Wechelsausstellung von Kathrin Feser im Literatur-Hotel am Main**\
    Mit der Ausstellung von Kathrin Feser eröffnen wir den zweiten Teil unserer Reihe regionaler Kunstausstellungen.

    **Vernissage am Mittwoch, 03. Dezember 2025, 15 Uhr**\
    Literatur-Hotel am Main, Veitshöchheim\
    **Sektempfang – Eintritt frei, um Anmeldung wird gebeten**

    Zwischen Linie und Bedeutung\
    Papier als Bühne, Linien als leise Gedanken – die Künstlerin Kathrin Feser verwandelt das Alltägliche in poetische Bilder. Ihre Cut-Outs, Zeichnungen und\
    Collagen entstehen aus dem Zusammenspiel von Zufall und Intuition. Schicht um Schicht öffnet sich eine eigene Welt – fein, still und doch voller Bewegung.\
    In ihren Arbeiten begegnen sich Struktur und Spontaneität, Beobachtung und inneres Bild. Wer sich auf sie einlässt, entdeckt in den feinen Überlagerungen Spuren von Wahrnehmung, Erinnerung und Bedeutung.

    **Ausstellung 01.11.2025 – 31.01.2026**

    Hotel am Main\
    Untere Maingasse 35\
    97209 Veitshöchheim\
    _info(at)hotel-am-main.de_
  en: |
    **Rotating Exhibition by Kathrin Feser at the Literatur-Hotel am Main**\
    With Kathrin Feser’s exhibition we open the second part of our series of regional art exhibitions.

    **Vernissage: Wednesday, December 3, 2025, 3 pm**\
    Literatur-Hotel am Main, Veitshöchheim\
    **Champagne reception – free admission, registration requested**

    Between Line and Meaning\
    Paper as stage, lines as quiet thoughts – the artist Kathrin Feser transforms the everyday into poetic images. Her cut-outs, drawings and\
    collages emerge from the interplay of chance and intuition. Layer by layer, a world of her own opens up – delicate, still and yet full of movement.\
    In her works, structure and spontaneity meet, observation and inner image. Those who open themselves to them discover, in the fine overlays, traces of perception, memory and meaning.

    **Exhibition November 1, 2025 – January 31, 2026**

    Hotel am Main\
    Untere Maingasse 35\
    97209 Veitshöchheim\
    _info(at)hotel-am-main.de_
