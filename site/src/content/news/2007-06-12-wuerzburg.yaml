body:
  de: |
    _TransForm_ die Zweite. Die deutsch/italienische Gruppenausstellung mit Renato Galbusera, Kathrin Feser, Pino di Gennaro, Werner Kiesel, Maria Jannelli, Irmtraud Klud-Berninger, Giancarlo Lepore, Cornelia Krug-Stührenberg, Antonio Miano, Magnus Kuhn, Claudio Zanini und Roland Schaller zieht in die Galerie des Berufsverbandes Bildender Künstler im Gebäude des Museums Kulturspeicher ein. Mit hohen Gästen beider Länder eröffnen wir, selbverständlich zweisprachig, am **22. Juni** um **19 Uhr**. Unser gemeinsamer Ausstellungskatalog _TransForm_ in italienischer und deutscher Sprache wird ausliegen. Besuchen kann man die Schau bis einschließich Sonntag, den **15. Juli**. Unterstützt wird die Unternehmung vom Istituto Italiano di Cultura in München, der Dante Alighieri Gesellschaft in Würzburg, dem Goethe Institut Mailand und der Fondazione Ruth in Rozzano/Milano.

    BBK Galerie im Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    Öffnungszeiten Mi|Do|Fr|So 11 – 18 Uhr, Sa 13 – 20 Uhr
  en: |
    _TransForm_ exhibition no. 2. This exhibition is an Italian/German group show with 12 artists: Renato Galbusera, Kathrin Feser, Pino di Gennaro, Werner Kiesel, Maria Jannelli, Irmtraud Klud-Berninger, Giancarlo Lepore, Cornelia Krug-Stührenberg, Antonio Miano, Magnus Kuhn, Claudio Zanini, and Roland Schaller. The show takes place at the BBK Gallery _professional association of visual artists_ located in the building of the Kulturspeicher Museum. The show will be opened on **June 22** at 7 pm, welcoming eminent guests from both countries. Our collective exhibition catalogue, published in both Italian and German, will be available at the gallery. The work can be visited until Sunday, **July 15**. Patronage for our project was provided by Istituto Italiano di Cultura, Munich, Dante Alighieri Society, Würzburg, Goethe Institut Milan, and Fondazione Ruth, Milan.

    BBK Gallery, Museum Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    open Wed|Thur|Fri|Sun 11 am – 6 pm, Sat 1 – 8 pm
