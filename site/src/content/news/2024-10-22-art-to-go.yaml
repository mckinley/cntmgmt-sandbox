body:
  de: |
    **5. BBK Kunstmarkt / art to go**\
    in der BBK-Galerie Würzburg\
    SA 26.10. + SO 27.10.24\
    SA 02.11. + SO 03.11.24\
    jeweils 11 – 18 Uhr

    BBK-Mitglieder bieten Originale direkt zum Verkauf an.

    **Sa 02.11.24, 18 – 24 Uhr**\
    Lange Kulturhafennacht – Lange Nacht der Museen\
    Bis Mitternacht zeigen wir im Kulturspeicher, ein vielfältiges Programm aus Theater, Musik, Tanz, Literatur und Kunst.
  en: |
    **5th BBK Art Market / art to go**\
    at the BBK Gallery Würzburg\
    Sat Oct 26 + Sun Oct 27, 2024\
    Sat Nov 2 + Sun Nov 3, 2024\
    11 am – 6 pm each day

    BBK members offer original works directly for sale.

    **Sat Nov 2, 2024, 6 pm – midnight**\
    Long Cultural Harbor Night – Long Night of Museums\
    Until midnight, we present a diverse program of theater, music, dance, literature, and art at the Kulturspeicher.
