body:
  de: |
    **OFF THE WALL**

    Eine Gruppenausstellung auf beiden Stockwerken der [Space Gallery](http://www.spacegallerysf.com/) in San Francisco. Der Kurator wollte unbedingt noch Arbeiten von mir mit in die Ausstellung nehmen, und so kommt es, dass ich nun, darüber hocherfreut, alle zu diesem Ereignis einladen will. In dieser ersten Ausstellungsbeteiligung, seit ich wieder hier in San Francisco bin, werde ich 11 (eventuell aber auch noch eine 12te, was sich heute Nacht noch entscheiden wird) neue Arbeiten präsentieren, **Cut-Outs aus recycelten Papieren**.

    Mit dabei werden sein: Skott Cowgill, Timothy G Dean Marcic, Devin Walsh, David Young V, David Ball, Tandy Kunkle, Mike Virata, Missy Feigum, Keli Ryan, Evan Hayden, Rex Waters, Roan Victor, Jay222, Ariel Diaz, Nolan Yelonik, Aaron Lawrence, Matt Miller, Tim Shriver, Naomi R Cabral, Nickole Leonard, Rohini, Austin McManus, Alisha Herada, Jeremy Conant, Joaquin Jutt, Jason Hallas, Piper Robbins, DYNO, JP Neang, Noa-Sydwox One, Steven Orrence, Sam Grant, Thomas Landerman – und noch ein paar mehr…..

    Jubilee wird uns alle auch noch vor der Vernissage entsprechend stylen… _It’s gonna be impressive, no doubt! Don’t miss it!_

    Die Ausstellung beginnt am Dienstag, den 22.9. und endet in der Nacht vom 27. auf den 28.9.2009, und ist jeweils von 20 Uhr bis 2 Uhr morgens geöffnet.

    Die eigentliche Vernissage ist am **Freitag, den 25.9.2009, Beginn 20 Uhr**, mit einer **Live Performance** von Why Wait? und Musik von den **Dj’s** HMD, Sophomore, Air Man & Sam Son und Zobe.

    **Eintritt $5**\
    Jeder Besucher erhält mit seiner Eintrittskarte eine Losnummer, die später gezogenen Gewinner erhalten je eine der ausgestellten Arbeiten.\
    Besucher müssen über 21 Jahre alt sein.

    Sponsoren sind _crown loyal. selfmadesf. space gallery. jubilee hair studio_

    Space Gallery\
    1141 Polk Street (zwischen Sutter Street und Post Street)\
    San Francisco, CA\
    Öffnungszeiten Di|Mi|Do|Fr|Sa|So 20 – 2 Uhr
  en: |
    **OFF THE WALL**

    A group show on both floors of [Space Gallery](http://www.spacegallerysf.com/) in San Francisco. I am very excited to be part of this event, and very eager to invite all of you to come and see this exhibition of virtuosity on Polk Street. This is my first partaking in a show in California since I have moved back here. There will be 11 **new cut-outs made from recycled paper** (eventually you might find a 12th piece on the wall, but this still depends on tonight’s productivity).

    Participating artists are: Skott Cowgill, Timothy G Dean Marcic, Devin Walsh, David Young V, David Ball, Tandy Kunkle, Mike Virata, Missy Feigum, Keli Ryan, Evan Hayden, Rex Waters, Roan Victor, Jay222, Ariel Diaz, Nolan Yelonik, Aaron Lawrence, Matt Miller, Tim Shriver, Naomi R Cabral, Nickole Leonard, Rohini, Austin McManus, Alisha Herada, Jeremy Conant, Joaquin Jutt, Jason Hallas, Piper Robbins, DYNO, JP Neang, Noa-Sydwox One, Steven Orrence, Sam Grant, Thomas Landerman – and more…..

    _It’s gonna be impressive, no doubt! Don’t miss it!_

    The show starts on Tuesday September 22, and ends in the night from September 27 to September 28, 2009. Doors are open every night between 8 pm and 2 am next morning.

    I’d like to invite you to join us all for the **opening reception on Friday, September 25, starting at 8 pm and going until late!**\
    There will be a **Live Performance** by Why Wait?, and music by **Dj’s** HMD, Sophomore, Air Man & Sam Son, Zobe

    **Admission is $5 (with raffle ticket)**\
    A drawing will determine the winners of several art pieces on display.\
    You have to be over 21 in order to get in.

    Sponsors are _crown loyal. selfmadesf. space gallery. jubilee hair studio_

    Space Gallery\
    1141 Polk Street (between Sutter Street and Post Street)\
    San Francisco, CA\
    open Tu|Wed|Thu|Fr|Sat|Sun 8 pm – 2 am
