title:
  de: Galleria Spazio Guicciardini in Mailand
  en: Galleria Spazio Guicciardini in Milan, Italy
date: "2007-10-20"
lang: de
translation: reviewed
images:
  - src: /media/news/2007/Milano.jpg
    title: il purgatorio
body:
  de: |
    Die gemeinschaftliche Gruppenausstellung mit dem Thema _TransForm_ geht in ihre letzte Runde. Den Abschluß bildet nun eine Austellung in der Galleria Spazio Guicciardini in Mailand. Sie wird am **25. Oktober** eröffnet werden und am **16. November** beendet werden. Die Bilder und Skulpturen können von Montag bis Freitag von 9.30 bis 12.30 Uhr und dann wieder, nach der Mittagspause, von 16.30 bis 18.30 Uhr angeschaut werden. Die Galerie ist in einem Rückgebäude der Via Guicciardini. Dazu muß man zunächst an einem Pförtner vorbei in den grünen Hinterhof, die Glasfassade zur Rechten hat zwei Türen durch die man zu den Räumlichkeiten gelangt.

    Galleria Spazio Guicciardini, Via Guicciardini 6, Milano, Italia
  en: |
    The group exhibition with its topic, _TransForm_, is entering its final round. The closing show will be at the Galleria Spazio Guicciardini in Milan, Italy. The exhibition will have its opening reception on **October 25**, and will run through **November 16**. The paintings and sculptures will be presented to the public between 9.30 am and 12.30 pm, and between 2.30 and 6.30 pm. You will find the gallery set back from Via Guicciardini, by passing a guard you will enter a gardenlike courtyard, the glass facade to your right then offers 2 doors to enter the space.

    Galleria Spazio Guicciardini, Via Guicciardini 6, Milano, Italy
