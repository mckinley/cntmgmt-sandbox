body:
  de: |
    **Night of 1000 Drawings**\
    Zu Gunsten von Artists Space

    Diese Veranstaltung findet am Samstag, 13. Dezember ab 15 Uhr statt\
    Einlass $10

    Hier bietet sich die Chance mit einem hochwertigem Original Kunstwerk für $50 bis $100 nach Hause zu gehen, während Sie noch zusätzlich eine wirklich innovative Galerie unterstützen. An der Bar gibt es diverse Cocktails.

    _Artists Space_\
    38 Greene St (zwischen Broome Street und Grand Street)\
    Soho\
    Telefon 212-226-3970

    Subway: A, C, E to Canal St; C, E to Spring St; B, D, F, V to Broadway-Lafayette St; R, W to Prince St, Canal St (W weekdays only); Q, J, M, Z to Canal St (M weekdays only); 6 to Bleeker, Spring, Canal Sts; 1 to Canal, Housto n Sts
  en: |
    **Night of 1000 Drawings**\
    A Benefit for Artists Space

    The event will take place on Saturday, December 13th, starting at 3pm\
    Admission $10

    This is your chance to walk away with an original work of art in the $50–100 price range, while also supporting an innovative gallery and enjoying drinks from the open bar.

    _Artists Space_\
    38 Greene St (between Broome and Grand Sts)\
    Soho\
    phone 212-226-3970

    Subway: A, C, E to Canal St; C, E to Spring St; B, D, F, V to Broadway–Lafayette St; R, W to Prince St, Canal St (W weekdays only); Q, J, M, Z to Canal St (M weekdays only); 6 to Bleeker, Spring, Canal Sts; 1 to Canal, Housto n Sts
