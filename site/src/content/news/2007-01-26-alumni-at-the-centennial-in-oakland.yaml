title:
  de: "\"Alumni at the Centennial\" in Oakland"
date: "2007-01-26"
lang: de
translation: reviewed
images:
  - src: /media/news/2007/CCA.jpg
body:
  de: |
    1999 schloß ich mein Studium am California College of the Arts mit dem Master of Fine Arts ab und wurde damit zu einem von vielen Alumni. An selbige erging im Herbst 2006 der Aufruf, sich für die 100-Jahre-CCA-Jubiläumsausstellung _Alumni at the Centennial_ zu bewerben. Ich bin sehr glücklich darüber, dass ich eine von 50 ehemaligen Studenten des CCA sein kann, die von der Jurie ausgewählt wurden um aktuelle Arbeiten in dieser bedeutenden Ausstellung im Oliver Art Center zu präsentieren. Vom **29. Januar bis zum 16. Februar** zeigt die Tecoah Bruce Gallery Arbeiten der Alumni aus den vergangen 100 Jahren. Die Jahrhundertfeierlichkeiten der Hochschule beginnen mit einer großen Vernissage am **31. Januar** zwischen 17.30 und 19.30 Uhr.

    Oliver Art Center, Tecoah Bruce Gallery, 5212 Broadway, Oakland, CA\
    Öffnungszeiten Mo|Di|Do|Fr 8.30 – 12 Uhr und 13 – 16.30 Uhr, Mi 13 – 16.30 Uhr, Sa 10 – 16 Uhr.

    \_[California College of the Arts](http://www.cca.edu/) (ehemals California College of Arts and Crafts) wurde 1907 gegründet und ist eine anerkannte, unabhängige Hochschule der Künste mit Lehrgebäuden, Werkstätten, Ateliers und Galerien in Oakland und San Francisco, Kalifornien. In den Vereinigten Staaten gilt CCA mittlerweile als eine der Topadressen für die Bereiche Freie Kunst und Design .
  en: |
    In 1999 I received my Masters in Fine Arts at [California College of the Arts](http://www.cca.edu/) in San Francisco. Happily I was following their international and open call to all alumni to apply for the 100 year CCA celebration show titled _Alumni at the Centennial_. The more happy I was when I heard that I was to be one of fifty alumni that had been chosen by the jury to present recent art work. The exhibition and the centennial kick-off will begin with a grand opening reception on Wednesday **January 31** from 5.30 pm to 7.30 pm. You can come and visit the exhibits until **February 16** in the Tecoah Bruce Gallery in Oakland.

    Oliver Art Center, Tecoah Bruce Gallery, 5212 Broadway, Oakland\
    open Mon|Tue|Thur|Fri 8.30 am – 12 pm and 1 pm – 4.30 pm, Wed 1 – 4.30 pm, Sat 10 am – 4 pm.
