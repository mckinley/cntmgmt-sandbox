body:
  de: |
    **Bitte besucht meinen Shop bei society6!**\
    Einiger meiner Arbeiten stehen nun für den alltäglichen Gebrauch auf nützlichen und auch wirklich coolen Gegenständen zur Verfügung!

    Hilfreich für mich wäre es auch, wenn Ihr diese Info und den Link mit anderen teilen würdet, und im Shop selbst das eine oder andere Objekt offiziell _“liken”_ würdet. Besten Dank!

    society6 produziert mit hohen Qualitätsstandards und versenden die Waren direkt für den Künstler.\
    Zu meinem Shop bei **society6** [hier](https://society6.com/katfeser) !

    **Gratis Versandt – weltweit! .....manchmal!**
  en: |
    **Please check out my store at society6!**\
    You will find several of my art works on a bunch of really cool and also unusual products!\
    It is very affordable and you can use it in everyday life… you also would help me by passing on this information and officially _“liking”_ single objects in my shop. Thank you very much!

    When you buy a product from society6, they produce it using only the highest quality materials, and ship it to you on behalf of the artist.\
    You can enter my shop with **society6** [here](https://society6.com/katfeser) !

    **They ship for free – worldwide….sometimes!**
