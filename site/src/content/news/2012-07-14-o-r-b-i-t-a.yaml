  de: |
    Herzliche Einladung zur Vernissage der Doppelausstellung Kathrin Feser und Unk Kraus am Freitag, den 20. Juli 2012 um 19.30 Uhr.

    ### O R B I T A

    20\. Juli – 15. September 2012\
    Kathrin Feser > _WORKS FROM ABROAD_\
    Unk Kraus > _JEWELRY FROM ABOVE_

    Jetzt auch online zu besichtigen! Bitte eintreten!\
