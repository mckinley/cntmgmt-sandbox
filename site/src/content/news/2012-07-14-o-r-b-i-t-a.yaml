  en: |
    I am inviting you all to join me for the opening reception of

    ### O R B I T A .

    Ulrich Jung will host a two-people-show, with – Kathrin Feser und Unk Kraus, in his gallery and jewelry store in Veitshöchheim near Würzburg. Please mark your calendar for Friday, July 20. The event will start at 7.30 pm.

    I am very excited to present yet an other series of new work.

    Kathrin Feser > _WORKS FROM ABROAD_\
    Unk Kraus > _JEWELRY FROM ABOVE_\
    July 20 – September 15, 2012

    Now also online! Please enter!\
