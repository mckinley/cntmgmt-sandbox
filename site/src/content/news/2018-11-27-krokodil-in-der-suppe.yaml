body:
  de: |
    **Krokodil in der Suppe**\
    jurierte BBK Winter-Gruppen-Ausstellung\
    **1.12. bis 23.12.2018**

    Diese Ausstellung ist eigenwillig und kurios, ungewöhnlich im Umgang mit Sujets, Materialien, Techniken, Formaten und Farbe. Wahrlich Wunderliches zum Ende dieses Jahres.

    Vernissage, Freitag 30.11., 19 Uhr

    [BBK-Galerie](http://www.bbk-unterfranken.de)\
    Oskar-Laredo-Platz 1, 97080 Würzburg

    Öffnungszeiten: Fr + Sa 15 – 18 Uhr. So 11 – 18 Uhr
  en: |
    This exhibition is wilful and curious, unconventional in its handling of subjects, materials, techniques, formats and colour. Truly wondrous things to see at year’s end.

    Opening reception, Friday November 30, 7 pm

    [BBK-Galerie](http://www.bbk-unterfranken.de)\
    Oskar-Laredo-Platz 1, 97080 Würzburg

    open Fri + Sat 3 – 6 pm, Sun 11 am – 6 pm
