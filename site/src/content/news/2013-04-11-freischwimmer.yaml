body:
  de: |
    ### Freischwimmer

    Die Industrie und Handelskammer Würzburg-Schweinfurt lädt Sie und Ihre Freunde ein zur **Eröffnung der Einzelausstellung von Kathrin Feser am Donnerstag, den 25. April 2013 um 18.30 Uhr im Gebäude C der IHK in Würzburg.**

    Begrüßung Herr Jürgen Bode, stellv. IHK-Hauptgeschäftsführer.\
    Einführung Dr. Gisela Wohlfromm, Kunsthistorikerin.

    Die Ausstellung geht vom **25. April bis zum 20. Juli 2013**

    IHK Würzburg-Schweinfurt / Gebäude C\
    [Mainaustraße 35](http://maps.google.de/maps?q=Mainaustra%C3%9Fe+35,+W%C3%BCrzburg\&hl=en\&ie=UTF8\&sll=48.917413,11.407993\&sspn=5.978953,5.41626\&oq=Mainaustra%C3%9Fe+35,+Wu\&hnear=Mainaustra%C3%9Fe+35,+Zellerau+97082+W%C3%BCrzburg,+Unterfranken,+Bayern\&t=m\&z=16), 97082 Würzburg\
    Telefon 0931.4194-375

    Öffnungszeiten Mo | Di | Mi | Do 8 – 20 Uhr. Fr 8 – 17 Uhr. Sa 8 – 12 Uhr
  en: |
    ### Freischwimmer|\_“floating freely”\_

    I would like to invite you all to come by and join me for the opening reception of my solo show at the Chamber of Commerce (building C) in Würzburg.\
    **Thursday evening, April 25 at 6.30 pm.**

    Greetings by Jürgen Bode, representative manager of the Chamber of Commerce.\
    Introduction by Dr. Gisela Wohlfromm, art historian.

    The exhibition will be on view **April 25 until July 20, 2013**

    IHK/Chamber of Commerce Würzburg-Schweinfurt / building C\
    [Mainaustraße 35](http://maps.google.de/maps?q=Mainaustra%C3%9Fe+35,+W%C3%BCrzburg\&hl=en\&ie=UTF8\&sll=48.917413,11.407993\&sspn=5.978953,5.41626\&oq=Mainaustra%C3%9Fe+35,+Wu\&hnear=Mainaustra%C3%9Fe+35,+Zellerau+97082+W%C3%BCrzburg,+Unterfranken,+Bayern\&t=m\&z=16), 97082 Würzburg\
