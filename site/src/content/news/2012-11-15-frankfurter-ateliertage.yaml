body:
  de: |
    _Einladung zu den Frankfurter Ateliertagen 2012_

    Vom 17. bis 18. November 2012 veranstaltet »basis« nun zum fünften Mal in Kooperation mit den städtischen Ateliers der Stadt Frankfurt und dem ATELIERFRANKFURT ein Wochenende der offenen Ateliers.\
    Auch viele private Studios öffnen zu diesem Anlass ihre Türen. Insgesamt können über 300 Künstlerateliers an diesen beiden Tagen in der Stadt besucht werden.

    An den drei Standorten von »basis« in der Gutleutstraße 8 – 12, der Elbesraße 10 HH und in der Linnéstraße 3 öffnen zu diesem Anlass wieder über 120 Künstler ihre Ateliers und Arbeitsräume für die Besucher. Zudem bietet »basis« auch dieses Jahr wieder ein umfangreiches Rahmenprogramm an.

    _Programm bei basis_\
    **OFFENE ATELIERS**\
    **Samstag, 17.11.2012 von 14 – 19 Uhr**\
    **Sonntag, 18.11.2012 von 12 – 18 Uhr**

    **Ich bin im 2. Stock in der basis, Elbstraße 10, und freue mich auf Euren Besuch.**

    Eröffnung der „Frankfurter Ateliertage 2012“ und Verleihung des Atelierstipendiums „Heimvorteil“ Samstag, 17.11.2012 um 20 Uhr, basis, Gutleustraße 8-12

    Begrüßung\
    Prof. Dr. Felix Semmelroth, Kulturdezernent der Stadt Frankfurt\
    Susanne Kujer, Leiterin Fachbereich Bildende Kunst, Kulturamt Frankfurt\
    Felix Ruhöfer, künstlerischer Leiter basis\
    Dr. Ursula Grzecha-Mohr, Leiterin Museum Gotisches Haus Bad Homburg und Jurymitglied „Heimvorteil“.

    Im Anschluss Bar & ayurvedisch, biologische Küche von „LaBouche“, Bio Bistro und Catering (bis 22 Uhr). Ab 21 Uhr DJ

    Themenführungen durch die Ateliers\
    Treffpunkt jeweils im Foyer des Gebäudes in der Gutleutstr. 8 – 12

    Sound und Musik > Samstag 14 Uhr / Sonntag 13 Uhr\
    Objekt und Skulptur > Samstag 15 Uhr / Sonntag 14 Uhr\
    Interdisziplinäre Projekte > Samstag 16 Uhr / Sonntag 15 Uhr

    Führung: Sandra Havlicek, Stipendiatin des basis Förderateliers\
    Samstag 18 Uhr / Sonntag 17 Uhr

    _Gastronomie_\
    Einkehr in der basis mit ayurvedisch, biologischen Spezialitäten von „LaBouche“, Bio Bistro und Catering. SA 14 Uhr – 19 Uhr und SO 12 Uhr – 18 Uhr

    Ausstellung\
    Pablo Pijnappel – Mirror Facing Mirror\
    9\. November 2012 – 13. Januar 2013\
    Während der Ateliertage durchgehend geöffnet.

    [Weitere Informationen über die Frankfurter Ateliertage](http://frankfurter-ateliertage.de/2012/)
  en: |
    _An invitation to the Frankfurt Open Studios 2012_

    November 17 and 18, 2012

    At the 3 »basis« locations at Gutleutstraße 8 – 12, at Elbesraße 10 HH and at Linnéstraße 3 artist are opening their studios!

    _Programm bei basis_\
    **OPEN STUDIOS**\
    **Saturday, 11.17.2012 from 2 pm to 7 pm**\
    **Sunday, 11.18.2012 from noon to 6 pm**

    **Come on by, and visit me on the third floor at Elbstraße 10. I am looking forward to seeing you there.**

    [Further information on Frankfurt’s Open Studios](http://frankfurter-ateliertage.de/2012/)
