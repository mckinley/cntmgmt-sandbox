body:
  de: |
    Eine Ausstellung wie keine andere… in der Galerie HOP in Bamberg!\
    **9. November bis 22. Dezember 2018**

    _Vernissage_ ist am Freitag, 9. November um 19 Uhr.\
    _Führung_ durch die Ausstellung am Sonntag, 2. Dezember um 15 Uhr.\
    _Glühwein_ zur Ausstellung gibt es am Sonntag, 8. Dezember ab 15 Uhr.\
    _Finissage_ beginnt am Sonntag, 22. Dezember um 15 Uhr.

    Künstler: Judith Bauer-Bornemann, Dierk Berthel, Christine Deuring-Berthel, Patrick Fauck, Kathrin Feser, Johannes Hepp, Mariagrazia Huaman, Susan Liebold, Eva-Maria Mandok, Wolfgang Müller, Jan Polacek, Marius Seidlitz, Robert Weissenbacher

    Für weitere Informationen bitte Galerie-Link klicken.

    [Galerie HOP](https://www.galerie-bamberg.de)\
    Dominik Hofstätter, Klaus Oppelt\
    [Siechenstraße 35, 96052 Bamberg](https://goo.gl/maps/DvPB7DCZTiz)

    Öffnungszeiten: Di – Fr 16 – 20 Uhr,\
    zu den Veranstaltungen Sa und So\
    sowie nach Vereinbarung
  en: |
    An exhibition like no other… in Galerie HOP in Bamberg!\
    **November 9 – December 22, 2018**

    _Opening reception_ on Friday, November 9 at 7 pm.\
    _Guided tour_ of the exhibition on Sunday, December 2 at 3 pm.\
    _Mulled wine_ at the exhibition on Sunday, December 8 from 3 pm.\
    _Finissage_ begins on Sunday, December 22 at 3 pm.

    Artists: Judith Bauer-Bornemann, Dierk Berthel, Christine Deuring-Berthel, Patrick Fauck, Kathrin Feser, Johannes Hepp, Mariagrazia Huaman, Susan Liebold, Eva-Maria Mandok, Wolfgang Müller, Jan Polacek, Marius Seidlitz, Robert Weissenbacher

    For more information please click the gallery link.

    [Galerie HOP](https://www.galerie-bamberg.de)\
    Dominik Hofstätter, Klaus Oppelt\
    [Siechenstraße 35, 96052 Bamberg](https://goo.gl/maps/DvPB7DCZTiz)

    open Tue – Fri 4 – 8 pm,\
    at events also Sat and Sun\
    and by appointment
