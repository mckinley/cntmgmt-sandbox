  en: |
    **dabba – Food to Live By**....and they have one of my orbital drawings spanning across the entire back wall of the restaurant! Looks great! Tastes great! Check it out!\
    [dabba](https://www.dabba.com/)

    Dabba is a fine-casual restaurant that boldly blends spices, ingredients, cooking techniques and recipes from around the world in adventurous ways. Based in the Bay Area where culture, creativity, food and tech collide, Dabba takes an innovative approach to making fast food slowly and healthfully with a global twist for the masses.
