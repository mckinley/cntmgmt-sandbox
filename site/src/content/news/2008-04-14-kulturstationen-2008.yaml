title:
  de: Kulturstationen 2008
date: "2008-04-14"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/Kulturstationen2008.jpg
    title: A. Summa, K. Feser
body:
  de: |
    Eine Ausstellung im Historischen Rathaus in Markt Einersheim im Rahmen der Kitzinger Land Kulturstationen 2008. [Angelika Summa](http://www.angelika-summa.de/ger/gal_1.html) stellt im Erdgeschoß ihre Draht- und Metallskulpturen aus. Im ersten Stockwerk präsentiere ich meine Rauminstallation – dessen genaue Zusammensetzung bis zu diesem Moment lediglich in meinem Kopf existiert. Die Kulturstationen finden im gesamten Kitzinger Land am kommenden Wochenende statt und wurden, wie bereits in den vergangenen Jahren, auf sehr beeindruckende Weise von Brigitte Meister-Götz organisiert. Besten Dank und all meinen Respekt an Brigitte.

    Im Freihof in Prichsenstadt gibt es am Freitag den 18. April ab 19.30 Uhr eine offizielle Eröffnungsfeier mit hohen Gästen und Musik. Sämtliche Stationen der teilnehmenden Künstler können am Samstag von 14 bis 19 Uhr und am Sonntag von 11 bis 19 Uhr besucht werden.

    Eine Vernissage zu unserer Ausstellung im Historischen Rathaus von Markt Einersheim findet am **Samstag den 19. April ab 19 Uhr** in den beiden Ausstelungsräumen mit Musik von “flutronics” statt.\
    Die Arbeiten können zusätzlich noch am Sonntag den 27. April, am Donnerstag den 1. Mai und am Sonntag den 4. Mai jeweils zwischen 11 und 16 Uhr besucht werden.

    Historisches Rathaus, Erdgeschoß und erstes Stockwerk, Marktplatz, Markt Einersheim\
    Öffnungszeiten Sa 19.4. 14 – 19 Uhr. So 20.4. 11 – 19 Uhr. So 27.4. 11 – 16 Uhr. Do 1.5. 11 – 16 Uhr. So 4.5. 11 – 16 Uhr
  en: |
    This will be an exhibition held at the Historical Civic Center of Markt Einersheim as being part of the Kitzinger Culture Stations 2008. [Angelika Summa](http://www.angelika-summa.de/eng/gal_1.html) will have her wire and metal sculptures on the first floor of this building, while I will present an installation on the second floor. The work to be shown there only exists in my head right now.

    The Culture Stations will be taking place throught this comming weekend. This massive show of art was, as it had been already in the past years, impressively organized by Brigitte Meister-Götz. My thanks and respect go out to Brigitte for making such a big task look so easy.

    On Friday, 4-18-2008 there will be an official opening ceremony at the Freihof in Prichsenstadt. More than 50 artists’ work can be visited on Saturday between 2 and 7 pm, and on Sunday between 11 am and 7 pm.

    Everyone is invited to our opening reception at the Historical Civic Center in Markt Einersheim on **Saturday April 19 at 7 pm**, with live music by “flutronics”.\
    The exhibition of our work will have additional opening dates and hours: Sunday April 27, Thursday May 1 and Sunday May 4, always between 11 am and 4 pm.

    Historical Civic Center, first and second floor, market place, Markt Einersheim\
    open Sat 4.19. 2 – 7 pm. Sun 4.20. 11 am – 7 pm. Sun 4.27. 11 am – 4 pm. Thu 5.1. 11 am – 4 pm. Sun 5.4. 11 am- 4 pm
