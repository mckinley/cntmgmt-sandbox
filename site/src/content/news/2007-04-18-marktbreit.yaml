body:
  de: |
    Im Rahmen der _Kitzinger Land Kulturstationen 2007_ bekamen Bronson McKinley und ich den Weißen Turm in Marktbreit, um in dessen 4 Halbrund-Räumen eine alle Stockwerke umfassende Installation zu präsentieren.

    **Raum 1** ist gefüllt mit 700 ausgelaserten Papier-Schmetterlingen nach eigenem Entwurf. Sie schweben und flattern dicht im Raum.\
    **Raum 2** zeigt den Effekt des Schmetterlingsfluges, zeigt die Arbeit der Schmetterlinge an den Wolken. Gleich dem Treiben in einer Werkstatt schwirren sie um kleine, zappelnde und noch recht handliche Wolkengebilde herum.\
    **Raum 3** ist den Wolken in Vollendung vorbehalten. Die Schmetterlinge verlangsamen und harmonisieren ihren Flug, die Wolken groß und schwer füllen den Raum beinahe komplett und bewegen sich gemächlich.\
    **Raum 4** zeigt die Wolken losgelöst und im freien Flug. Eine zeitliche Reihung von Himmelsfotos zieht sich entlang des obersten Turm-Geschosses, lose unterbrochen von schmalen Fenstern, die den Blick auf den aktuellen Himmel über Marktbreit freigeben. Entstanden sind die Aufnahmen innerhalb von 13 Tagen im April 2007. Speziell für diesen Anlaß fotografierten vielen unserer Freunde aus den verschiedensten Ecken dieser Welt den Himmel über ihren Köpfen.

    _Cloud Factory_ ist der Titel unserer Installation, die am **20. April, 21. April und 22. April** über eine schmale und steile Holztreppe zu erklimmen ist. Die Schmetterlinge im ersten Raum werden über diese 3 Ausstellungstage mit den Besuchern entfliegen.

    _Der Bau des Turms, als Teil des Mauerrings um Marktbreit, wurde Mitte des 16. Jahrhunderts von Georg Ludwig von Seinsheim veranlaßt. Im Weissen Turm waren früher der Kuhhirte, die Hebamme und der Bader zuhause._

    **Update:** Die komplette [Dokumentation](/media/news/2007/Wei_erTurm2007.pdf) dieser Ausstellung kann hier als PDF-Datei heruntergeladen werden (1.4 MB).
  en: |
    The 2 person show/installation/collaboration between Bronson McKinley and Kathrin Feser – called _Cloud Factory_ – is set up in the White Tower, a renaissance tower in Marktbreit, Germany, as part of a 3-day-event called “Kitzinger County Culture Stops”. Our installation claims 4 half-circular rooms that increase in size as you climb up the tower’s narrow and steep staircase.

    **Room 1** is filled with approximately 700 butterflies made from laser-cut paper, floating and flying through the air.\
    **Room 2** shows the butterflies’ wing flapping effects. They manufacture clouds in a laboratory. While flying vigorously criss-cross, the space is filling up with small, still manageable in size, but floundering clouds.\
    **Room 3** is the room of clouds in perfection. The butterflies are reducing their speed, the clouds, large and heavy, fill the room almost entirely as they slowly move.\
    **Room 4** shows the clouds detached and flying freely. A phased sequence of sky-photos surrounds the tower’s top level walls, interrupted by slim windows opening up a view into the current sky above Marktbreit. All photos were shot within 13 days in April 2007. Many of our friends from all across the planet shot **the sky above their heads** (name, location, date, and time included in the presentation) – specifically for this occasion.

    If you’d like to see this installation you will have to come by **between April 20 and April 21**. During these 3 days the butterflies in the first room, will slowly be taking off together with our visitors.

    _During the 16th Century Georg Ludwig v. Seinsheim induced the construction of the tower, as part of the fortifying walls surrounding Marktbreit. The White Tower used to be home of the cowherd, the midwife and the bath man._

    **Update:** You can download the complete [documentation](/media/news/2007/Wei_erTurm2007.pdf) of the show in PDF format (1.4 MB).
