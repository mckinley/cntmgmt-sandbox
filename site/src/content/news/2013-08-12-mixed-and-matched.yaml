  en: |
    The Rosenfeld Foundation is proud to present\
    **Mixed and Matched**\
    an exhibition by artist in residence Kathrin Feser

    **Opening reception August 24th, 2013. 7 pm to 11 pm.**\
    RSVPs appreciated.

    All work will be on display by appointment until September 7th, 2013

