body:
  de: |
    Veitshöchheimer Künstler stellen aus!\
    Kathrin Feser. Antje Friederich. José F. Sánchez. Petra Söder. Helga Teuber. Ulrike Zimmermann. Peter Zimmermann

    geöffnet an allen Adventswochenenden >\
    **26.+27.11. | 3.+4.12. | 10.+11.12. | 17.+18.12.2011**

    **Finissage am Donnerstag, 22. Dezember 2011, 19 Uhr**

    Galerie Zeitweise\
    Würzburger Straße 1\
    Veitshöchheim\
    Öffnungszeiten Sa|So jeweils von 14 bis 18 Uhr
  en: |
    Veitshöchheim’s artist in exhibition!\
    Kathrin Feser. Antje Friederich. José F. Sánchez. Petra Söder. Helga Teuber. Ulrike Zimmermann. Peter Zimmermann

    opened on all four advent weekends >\
    **11.26.+11.27 | 12.3.+12.4. | 12.10.+12.11. | 12.17.+12.18.2011**

    **Closing reception on Thursday December 22nd, starting at 7 pm**

    Galerie Zeitweise\
    [Würzburger Straße 1](http://maps.google.com/maps?q=W%C3%BCrzburger+Stra%C3%9Fe+1,+Veitsh%C3%B6chheim,+Deutschland\&hl=en\&ie=UTF8\&sll=37.0625,-95.677068\&sspn=61.065158,124.716797\&vpsrc=0\&hnear=W%C3%BCrzburger+Stra%C3%9Fe+1,+Veitsh%C3%B6chheim+97209+Veitsh%C3%B6chheim,+W%C3%BCrzburg,+Bayern,+Germany\&t=m\&z=16)\
    Veitshöchheim\
    open Sat|Sun between 2 pm and 6 pm
