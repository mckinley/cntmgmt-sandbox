  de: |
    **Zeichnen zur Zeit**\
    **16.11. – 15.12.2024**

    Vernissage am Freitag, 15.11.2024

    Die jährliche Doppelausstellung der Mitglieder präsentiert die technische und inhaltliche Vielfalt auf zwei Ebenen. Aktuelle druckgrafische und zeichnerische Positionen sind in der Werkstattgalerie im Untergeschoss zu sehen.

    BBK-Unterfranken\
    Oskar-Laredo-Platz 1\
    97080 Würzburg
  en: |
    **Drawing Now**\
    **November 16 – December 15, 2024**

    Opening reception Friday, November 15, 2024

    The annual double exhibition of members presents technical and thematic diversity on two floors. Current printmaking and drawing positions are on view in the workshop gallery in the basement.

    BBK-Unterfranken\
    Oskar-Laredo-Platz 1\
    97080 Würzburg
