body:
  de: |
    Wie spannend und vielfältig Kunst sein kann, zeigen aktuelle Positionen junger Würzburger Künstler.\
    Die VKU öffnet das Spitäle für den Nachwuchs,\
    kuratiert von Felix Röhr, [Kulturateur](https://www.kulturateur.de/).

    **von hier, bis jetzt**\
    Ausstellung vom 5. bis 20. Oktober 2019

    VERNISSAGE\
    05.10.2019 um 19 Uhr\
    !!! Die Ausstellung wird schon den ganzen Samstag vor der abendlichen\
    Vernissage geöffnet sein!!!

    – 11.10. KONZERT Rayka Wehner & Dirk Rumig\
    – ? ? ? VERLEIHUNG Hugo-und-Elli-Götz-Preis\
    – 17.10. ERÖFFNUNG Tage des offenen Ateliers

    > KÜNSTLER: Nil Orange, Jaroslav Drazil, Nikola Jaensch,\
    > Maria Boldt, Kathrin Feser, Katrin Heyer, Sebastian von Papp

    FINISSAGE, 16 – 18 Uhr\
    20.10.2019

    VKU, [Vereinigung Kunstschaffender Unterfrankens e.V.](https://www.vku-kunst.de/Veranstaltung/2019-10-von-hier-bis-jetzt-ausstellung/)\
    Zeller Straße 1, 97082 Würzburg, Telefon 0931.44119

    Öffnungszeiten:\
    Di – So 11 – 18 Uhr\
    Montag geschlossen.
  en: |
    How exciting and diverse art can be is shown by current positions of young Würzburg artists.\
    The VKU opens the Spitäle to emerging talent,\
    curated by Felix Röhr, [Kulturateur](https://www.kulturateur.de/).

    **von hier, bis jetzt**\
    Exhibition October 5–20, 2019

    OPENING RECEPTION\
    October 5, 2019 at 7 pm\
    !!! The exhibition will also be open all day Saturday before the evening opening!!!

    – Oct 11: CONCERT Rayka Wehner & Dirk Rumig\
    – ? ? ? AWARD CEREMONY Hugo-und-Elli-Götz-Preis\
    – Oct 17: OPENING Days of Open Studios

    > ARTISTS: Nil Orange, Jaroslav Drazil, Nikola Jaensch,\
    > Maria Boldt, Kathrin Feser, Katrin Heyer, Sebastian von Papp

    FINISSAGE, 4 – 6 pm\
    October 20, 2019

    VKU, [Vereinigung Kunstschaffender Unterfrankens e.V.](https://www.vku-kunst.de/Veranstaltung/2019-10-von-hier-bis-jetzt-ausstellung/)\
    Zeller Straße 1, 97082 Würzburg, tel. 0931.44119

    open Tue – Sun 11 am – 6 pm\
    Closed Monday.
