title:
  de: Collage/Montage
date: "2008-02-24"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/CollageMontage.jpg
    title: Begriffsnebel
body:
  de: |
    Die diesjährige Frühjahrsausstellung des Berufsverbandes Bildender Künstler steht unter dem Thema _Collage/Montage_. Am kommenden Freitag, **29. Februar** um 19 Uhr wird diese in der BBK Galerie im Kulturspeicher eröffnet. Frau Dr. Eva-Suzanne Bayer wird am **7. März** um 19 Uhr in der Galerie einen sicher sehr interessanten Dia-Vortrag mit dem Titel _Alltagsschnipsel_ – zur Geschichte der Collage halten. Mit einer Finissage ab 17 Uhr endet die jurierte Gruppenausstellung dann am Sonntag den **30. März**.

    BBK Galerie im Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    Öffnungszeiten Mi|Do|Fr|So 11 – 18 Uhr, Sa 13 – 20 Uhr
  en: |
    This year’s spring exhibition of BBK members is called _Collage/Montage_. An opening reception for all the diversely glued and mounted pieces will be held next Friday at the BBK Gallery, **February 29** starting at 7 pm. On display will be _Begriffsnebel \[nebulous terms]_, one of my cut-out pieces. It was chosen to be the cover of the invitation card, which I was then asked to design. The juried group show will end on Sunday **March 30** with a Finissage at 5 pm.

    BBK Gallery, Museum Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    open Wed|Thur|Fri|Sun 11 am – 6 pm, Sat 1 – 8 pm
