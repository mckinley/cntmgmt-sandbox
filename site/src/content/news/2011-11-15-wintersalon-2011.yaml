body:
  de: "**Ausstellung Wintersalon 2011 im Galeriehaus in Nürnberg.**\\\n**Eröffnungsfest am Sonntag, 20. November\_ von 15 – 18 Uhr. Einlaß\_ab 14 Uhr**\n\nEs stellen aus:\\\nGeorg Baier. Gisela Hoffmann. Margarete Schrüfer. Cornelia Effner. Rita Kriege. Linda Schwarz. Mechthild Engel. Markus Kronberger. Margit Sippel-Erlbacher. Daniel Engelberg. Lisa Metz. Andrea Sohler. Kathrin Feser. Petra Naumann. Heidi Sommerkorn. Barbara Geier-Häckh. Gabriele Olesch. Hans-Peter Stark. Marcel Große. Mathias Otto. Walter Thaler. Geli Haberbosch. Fridrich Popp. Sonja Tille. Heike Hahn. Joseph Raimond. Axel Voss. Anna Handick. Katrin Kaa Riedl. Klemens Wuttke.\\\n\_\\\nDie Schau versammelt neue und vertraute Künstler – nicht nur aus der Metropol-Region Nürnberg – mit aktuellen Positionen von Malerei und Zeichnung bis hin zu Skulptur, Objekt, Fotografie und Video. Schauen Sie herein und lassen Sie sich überraschen! Gekauft werden kann (fast) alles und das zu erschwinglichen Preisen. Zur Eröffnung gibt es ein Kuchenbüffet und eine Auswahl an Getränken.\n\nEintritt frei!\n\n**Ausstellung vom 20. November – 20. Dezember 2011**\n\n[Galeriehaus](http://www.galeriehaus-nuernberg-nord.de/)\\\nWurzelbauerstraße 29\\\nNürnberg\\\nÖffnungszeiten\_Di|Mi 11 -16 Uhr. Do|Fr 11-13 Uhr.\_So 11-16 Uhr.\\\nund nach telefonischer Vereinbarung unter 0911.55338\n"
  en: "**Exhibition Winter Salon 2011 at the Galeriehaus in Nuremberg.**\\\n**Opening festivity Sunday, November 20\_between 3 pm and 6 pm. Doors open at 2 pm.**\n\nParticipating artists:\\\nGeorg Baier. Gisela Hoffmann. Margarete Schrüfer. Cornelia Effner. Rita Kriege. Linda Schwarz. Mechthild Engel. Markus Kronberger. Margit Sippel-Erlbacher. Daniel Engelberg. Lisa Metz. Andrea Sohler. Kathrin Feser. Petra Naumann. Heidi Sommerkorn. Barbara Geier-Häckh. Gabriele Olesch. Hans-Peter Stark. Marcel Große. Mathias Otto. Walter Thaler. Geli Haberbosch. Fridrich Popp. Sonja Tille. Heike Hahn. Joseph Raimond. Axel Voss. Anna Handick. Katrin Kaa Riedl. Klemens Wuttke.\n\nThe gallery will present current positions in painting, drawing, sculpture, photography, and video. Come on in, and be thrilled. Almost everything is for sale. There will be a cake buffet and an eclectic selection of beverages for the opening reception.\n\nAdmission is free!\n\n**The exhibition runs from November 20 til December 20, 2011**\n\n[Galeriehaus](http://www.galeriehaus-nuernberg-nord.de/)\\\nWurzelbauerstraße 29\\\nNuremberg, Germany\\\nopen\_Tue|Wed 11 am – 4 pm. Thu|Fri 11 am – 1 pm.\_Sun 11 am – 4 pm.\\\nor by appointment, phone +49.(0)911.55338\n"
