title:
  de: Galerie im Schwarzweller in Würzburg
  en: Gallery Schwarzweller in Würzburg
date: "2007-11-02"
lang: de
translation: reviewed
images:
  - src: /media/news/2007/Schwarzweller-f.jpg
  - src: /media/news/2007/Schwarzweller-b.jpg
body:
  de: |
    Im Clubraum der ehemaligen Städtischen Galerie in Würzburg habe ich ab dem **10. November** eine **Einzelausstellung**. Eröffnet wird diese um **16 Uhr** von Gail Gilmore, einer Opern und Gospelsängerin aus New Orleans, und von Luise Limburg, die die einführenden Worte vortragen wird. Ich zeige mehrheitlich neue Arbeiten, von denen die meisten mit dem Teppichmesser entstanden sind. Passend zum neuen Nutz des Gebäudes als Einrichtungs- und Rahmengeschäft, nenne ich meine Schau _Adieu Raufaser_. Wer es nicht zur Vernissage schafft, kann von Montag bis Freitag zwischen 9.30 und 18.30 Uhr, oder am Samstag zwischen 9.30 und 16.30 Uhr in der Galerie im Schwarzweller vorbeikommen. An den vier Dezember Samstagen ist bis 18 Uhr geöffnet. Die Ausstellung endet am **5. Januar 2008**.

    Galerie im Schwarzweller (Untergeschoß), Hofstraße 3, Würzburg, Telefon 0931.42304
  en: |
    The club room of Würzburg’s former civic gallery will host a one person show beginning **November 10**. Its opening reception will be at 4 pm when Gail Gilmore, an opera and gospel singer from New Orleans, will be performing, and when Luise Limburg will be giving an introduction. For the most part, I will be presenting new work, of which most was made with paper and x-acto knife. In reference to the new use of this building as an interior design and framing store, I call this show _Adieu Raufaser \[farewell woodchip wallpaper]_. Those who can not make it to the opening can still visit the show Monday through Friday between 9.30 am and 6.30 pm, on Staurdays between 9.30 am and 4.30 pm. And on the four Saturdays before Christmas, the gallery will be open until 6 pm. The exhibition will end on **January 5, 2008**.

    Gallery Schwarzweller, Hofstraße 3, Würzburg\
    Mon|Tue|Wed|Thu|Fri 9.30 am – 6.30 pm, Sat 9.30 am – 4.30 pm\
    On the 4 Saturdays in December the show will also stay open later: 9.30 am – 6 pm
