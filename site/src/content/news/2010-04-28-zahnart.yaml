body:
  de: |
    Ausstellung im Hause G E R L .\
    **5. Mai bis 29. Oktober 2010\
    Vernissage ist am Mittwoch, den 5. Mai ab 18 Uhr**

    Bei [GERL](http://www.gerl-dental.de/content.asp?cnt=9\&fil=10\&pkt=1) zeige ich Arbeiten, die zwischen den Jahren 2002 und 2010 entstanden sind.\
    Präsentiert werden sie in Kombination mit Geräten und Materialien für Zahnarztpraxen und Labors, was wiederum einen interessanten und neuen Kontext erzeugen wird…........._wuahh_.

    Fa. GERL.\
    [Louis Pasteur Straße 1a](http://www.gerl-dental.de/content.asp?cnt=9\&fil=10\&pkt=7 "im Industriegebiet Würzburg Ost")\
    97760 Würzburg\
    nähere Informationen unter 0931.355010

    Öffnungszeiten Mo|Di|Mi|Do 8 – 17 Uhr. Fr 8 – 16 Uhr.
  en: |
    An exhibition at G E R L .\
    \*May 5 until October 29, 2010\
    Opening reception will be on Wednesday, May 5, starting at 6 pm\*

    At [GERL](http://www.gerl-dental.de/content.asp?cnt=9\&fil=10\&pkt=1) I will present an array of work that has been made between the years 2002 and 2010.\
    At this company, where I will have two big rooms for hanging, they deal with dental equipment and material which will surely generate an interesting context and dialogue between their exponats and my pieces….._wuahh_. Don’t be scared, come by and see for yourself!

    Fa. GERL.\
    [Louis Pasteur Straße 1a](http://www.gerl-dental.de/content.asp?cnt=9\&fil=10\&pkt=7 "im Industriegebiet Würzburg Ost")\
    97760 Würzburg\
    for more information call \*49.931.355010

    open Mon|Tue|Wed|Thu 8 – 17 Uhr. Fri 8 – 16 Uhr.
