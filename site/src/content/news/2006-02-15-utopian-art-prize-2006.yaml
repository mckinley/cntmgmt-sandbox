title:
  de: Utopian Art Prize 2006
date: "2006-02-15"
lang: de
translation: reviewed
body:
  de: |
    Der _Utopian Art Prize_ ist ein internationaler Kunstpreis für Bildende Künstler. Ich freue mich sehr darüber diesen im französischen Caen, gewonnen zu haben!
  en: |
    I am this year’s winner of the Utopian Art Prize in Caen, France!\
    Just got the news.
