  en: |
    **February 11 – March 31, 2025**\
    Solo exhibition\
    **R I P P L E S**

    The **LAUDA FabrikGalerie** invites you to its first exhibition of 2025, opening February 11.

    In her exhibition _Ripples_, the artist – who lives in Veitshöchheim – brings together two contrasting series: her meditative ‘orbital drawings’ and the digitally made collages of the ‘Ping-Pong’ series. For Kathrin Feser, her artistic work resembles fascinating journeys through time, moving weightlessly between different eras. “I playfully construct something from the past, comment on the present, and visualise the future,” explains the artist.

    In her ‘Ping-Pong’ collages, created during the Covid pandemic, she mixes the most diverse elements into square compositions. She combines images of her drawings with travel photographs, everyday snapshots, and carefully selected found material. Each collage opens up new perspectives and invites the viewer on a personal journey through time.

    The ‘orbital drawings’, by contrast, emerge through a very different process: over weeks of concentrated work, Feser develops complex linear structures in ink on paper. Art historian Anna Katharina Feldhaus describes these works as “geometric forms that become complex meta-images of organic cosmos – a kind of matter with a life of its own.” The drawings hover between scientific precision and artistic intuition, creating microscopic worlds or evoking distant galaxies.

    The title _Ripples_ refers to the central idea of the exhibition: like small waves spreading across the surface of water, seemingly insignificant moments can trigger large, transformative events. This metaphor is reflected both in the multilayered collages and in the circular movements of the ink drawings.

