body:
  de: |
    **BBK Kunstmarkt / art to go**\
    SA 25.10. + SO 26.10.25 /\
    SA 01.11. + SO 02.11.25\
    11 – 18 Uhr

    Hier präsentieren BBK-Mitglieder ihre Werke und bieten sie direkt zum Verkauf an. Zu entdecken gibt es eine Vielzahl von Originalkunstwerken zu erschwinglichen Preisen.

    Lange Kulturhafennacht – Lange Nacht der Museen\
    Sa 25.10.25, 18 – 24 Uhr\
    Bis Mitternacht zeigen wir, die Kulturschaffenden im Kulturspeicher, ein vielfältiges Programm aus Theater, Musik, Tanz, Literatur und Kunst.

    BBK Galerie im Kulturspeicher.
  en: |
    **BBK Art Market / art to go**\
    Sat Oct 25 + Sun Oct 26, 2025 /\
    Sat Nov 1 + Sun Nov 2, 2025\
    11 am – 6 pm

    BBK members present their work and offer it directly for sale. Discover a wide variety of original artworks at affordable prices.

    Long Cultural Harbor Night – Long Night of Museums\
    Sat Oct 25, 2025, 6 pm – midnight\
    Until midnight, we — the cultural creators at the Kulturspeicher — present a diverse program of theater, music, dance, literature, and art.

    BBK Gallery at the Kulturspeicher.
