    title: The History of Time Travel
body:
  de: |
    [CIRCA](http://www.recirca.com), aus Dublin, ist die in Irland führende Zeitschrift für zeitgenössische visuelle Kunst. Sie veranstaltet eine internationale Postkarten Ausstellung mit dem Titel _The Picture Works_. Die Teilnehmer sind mit je 3 Arbeiten vertreten.
  en: |
    [CIRCA](http://www.recirca.com) of Dublin is Irelands leading magazine for contemporary visual art and is presenting their international online postcard show titled _The Picture Works_. All participants are represented with 3 pieces.
