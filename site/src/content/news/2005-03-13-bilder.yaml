    title: Blick in die Ausstellung
body:
  de: |
    Die Ausstellung _more.mehr_ ist nun schon seit längerem abgebaut.\
    Die Resonanz war fantastisch!.....

    Daher nun auch das Update der Galerie hier auf circlefly.de. Fast alle Arbeiten sind nun online zu besichtigen!
  en: |
    The _more.mehr_ – exhibition has been taken down for some while now.\
    The feedback was fantastic!…..

    That is why there is now an big update to circlefly.de.\
    Almost all pieces of that show can been seen online!

    Some of the work is also on display at Gallery Schwarzweller in Würzburg.
