body:
  de: |
    **Kunst in Würzburgs Petererviertel**\
    **Mensch! Guck mal….**\
    **7. April bis 19. Mai 2018**

    MALEREI – SKULPTUR – OBJEKT – FOTOGRAFIE\
    Roswitha Vogtmann / Kathrin Feser / Hans Krakau\
    / Jürgen Hochmuth / Frank Dimitri Etienne / Gerda Enk / Gabi Weinkauf / Rashid Jalaei

    Konzeption: Brigitte Meister-Götz

    Gemeinsame Kunstaktion von\
    _Rudolf-Alexander-Schröder-Haus\
    Volkshochschule\
    ev. Kirche St. Stephan\
    kath. Kirche St. Peter und Paul_

    **Auftakt: Sa, 7. April 2018 18.30 Uhr\
    auf dem Wilhelm-Schwinn-Platz**\
    18.30 Uhr: Begrüßung und Betrachtungen zur Kunst der ausstellenden Künstler/innen durch Dr. Anni Hentschel (Direktorin RASH). Begehung der Ausstellungsorte mit Saxophon-Impressionen von Johannes Liepold.\
    19.30 Uhr: Begrüßung durch Stefan Moos (Leiter vhs) und Ausklang.

    Öffnungszeiten der vier Ausstellungsorte:\
    Schröder-Haus, Wilhelm-Schwinn-Platz 3\
    Mo-Fr 9 -12 u. 14 -17, ggf. abweichend bei Veranstaltungen\
    St. Stephan, Wilhelm-Schwinn-Platz 1\
    Täglich 9 – 19 (außer bei Gottesdiensten)\
    St. Peter und Paul, Peterplatz 8\
    Mo-Sa 10 – 17 und So 12 – 17 (außer bei Gottesdiensten)\
    Volkshochschule, Münzstraße 1\
    Mo-Fr 8 – 18, Sa 10 – 17, und bei Veranstaltungen

    **Begleitende Veranstaltungen**

    12.4., Donnerstag, 19.00 Kunst als Betriebsstörung, Vortrag mit Prof. Dr. Thomas Friedrich, € 5 / ermäßigt € 3, Schröder-Haus

    13.4., Freitag, 19.30 Konzert für Oboe und Orgel mit Bettina Fleckenstein (Oboe) und Andreas Unterguggenberger (Orgel), Eintritt frei, Spende erbeten, Kirche St. Peter und Paul

    18.4., Mittwoch, 19.00 Harald Szeemann und das Museum der Obsessionen.\
    Eine Phänomenologie des Zeigens, Vortrag mit Gerda Enk, € 10, Volkshochschule

    22.4., Sonntag, 16.00 Mensch, guck mal … Kirchen- und Kunstführung mit Dr. Jürgen Emmert, Eintritt frei, Spende erbeten, Kirche St. Peter und Paul

    26.4., Donnerstag, 19.00 Das Bildungspotenzial der Unaufmerksamkeit,\
    Vortrag mit Dr. Josefine Geisler, € 10, Volkshochschule

    27.4., Freitag, 17.00 Mensch, guck mal … Kirchen- und Kunstführung mit Prof. Dr. Maike Hansen und Dr. Anni Hentschel, € 5, Kirche St. Stephan

    2.5., Mittwoch, 19.00 Mut zur Wut – Gefühle sind menschlich, Vortrag mit Irene Schneider, € 5 / ermäßigt € 3, Schröder-Haus

    5.5., Samstag, 16.00 Kunstspaziergang durch das Petererviertel mit den Ausstellenden und Brigitte Meister-Götz, € 5, Treffpunkt: Schröder-Haus

    6.5., Sonntag, 18.00 Vater unser im Himmelreich – Der Mensch vor Gott, Wandelkonzert von St. Stephan nach St. Peter und Paul mit Christian Heidecker (Orgel), Abendkasse: € 10 / ermäßigt € 7

    18.5., Freitag, 18.00 Ausklang – Führung durch das Petererviertel mit Stadtrat Willi Dürrnagel, € 5, Treffpunkt: Schröder-Haus
  en: |
    PAINTING – SCULPTURE – OBJECT – PHOTOGRAPHY\
    Roswitha Vogtmann / Kathrin Feser / Hans Krakau\
    / Jürgen Hochmuth / Frank Dimitri Etienne / Gerda Enk / Gabi Weinkauf / Rashid Jalaei

    Concept: Brigitte Meister-Götz

    Joint art project by\
    _Rudolf-Alexander-Schröder-Haus\
    Volkshochschule\
    Protestant Church St. Stephan\
    Catholic Church St. Peter und Paul_

    **Launch: Sat, April 7, 2018 at 6:30 pm\
    on Wilhelm-Schwinn-Platz**\
    6:30 pm: Welcome and reflections on the work of the exhibiting artists by Dr. Anni Hentschel (Director RASH). Tour of the exhibition venues with saxophone improvisations by Johannes Liepold.\
    7:30 pm: Welcome by Stefan Moos (vhs director) and closing.

    Opening hours at the four venues:\
    Schröder-Haus, Wilhelm-Schwinn-Platz 3\
    Mon–Fri 9 am – 12 pm and 2 – 5 pm, subject to change during events\
    St. Stephan, Wilhelm-Schwinn-Platz 1\
    Daily 9 am – 7 pm (except during services)\
    St. Peter und Paul, Peterplatz 8\
    Mon–Sat 10 am – 5 pm and Sun 12 – 5 pm (except during services)\
    Volkshochschule, Münzstraße 1\
    Mon–Fri 8 am – 6 pm, Sat 10 am – 5 pm, and during events

    **Accompanying events**

    April 12, Thursday, 7 pm: Art as Disruption, lecture by Prof. Dr. Thomas Friedrich, € 5 / reduced € 3, Schröder-Haus

    April 13, Friday, 7:30 pm: Concert for oboe and organ with Bettina Fleckenstein (oboe) and Andreas Unterguggenberger (organ), free admission, donations welcome, St. Peter und Paul

    April 18, Wednesday, 7 pm: Harald Szeemann and the Museum of Obsessions. A Phenomenology of Display, lecture by Gerda Enk, € 10, Volkshochschule

    April 22, Sunday, 4 pm: Look at that… Church and art tour with Dr. Jürgen Emmert, free admission, donations welcome, St. Peter und Paul

    April 26, Thursday, 7 pm: The Educational Potential of Inattention, lecture by Dr. Josefine Geisler, € 10, Volkshochschule

    April 27, Friday, 5 pm: Look at that… Church and art tour with Prof. Dr. Maike Hansen and Dr. Anni Hentschel, € 5, St. Stephan

    May 2, Wednesday, 7 pm: Courage for Anger – Feelings are Human, lecture by Irene Schneider, € 5 / reduced € 3, Schröder-Haus

    May 5, Saturday, 4 pm: Art walk through the Petererviertel with the exhibitors and Brigitte Meister-Götz, € 5, meeting point: Schröder-Haus

    May 6, Sunday, 6 pm: Our Father in Heaven – Humanity before God, promenade concert from St. Stephan to St. Peter und Paul with Christian Heidecker (organ), door price: € 10 / reduced € 7

    May 18, Friday, 6 pm: Closing event – tour through the Petererviertel with city councillor Willi Dürrnagel, € 5, meeting point: Schröder-Haus
