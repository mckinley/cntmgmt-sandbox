body:
  de: |
    **Kunst trifft Steuer XXVIII – Oceans**\
    **Ausstellung 15. Juli – 31. Oktober 2019**

    **Einladung zur Matinée – Sonntag, 22. September 2019, 11 Uhr**\
    HENNEBERGER und Partner – Steuerberater

    Ende des 13. Jh., aus dem altfranzösischen Ozean, aus dem lateinischen oceanus, aus dem griechischen okeanos, das große Gewässer oder Meer von unbekannter Herkunft, das die Erdscheibe umgibt.\
    In früheren Zeiten, als die einzigen bekannten Landmassen Eurasien und Afrika waren, war der Ozean ein endloser Fluss, der sie umfloss.

    Zu sehen ist eine Mischung aus filigranen Zeichnungen, den orbital drawings,\
    und Fotos/Collagen aus der California / nitty-gritty blender Serie.\
    Der Titel der Ausstellung – Oceans – ist sowohl geographischer als auch metaphorischer Aufhänger in Bezug auf die gezeigten Werkgruppen, er repräsentiert das Prinzip des nahezu unerschöpflichen Fundus an Kreisen, Verdichtungen, Überlagerungen, Bildideen, zu Ergründendem.

    Zur Besichtigung der Ausstellung sind Sie auch sonst herzlich willkommen –\
    sowohl zu den regulären Bürozeiten Mo-Do 8-17 Uhr und Fr 8-13 Uhr,\
    aber auch darüber hinaus.\
    Bitte rufen Sie uns einfach kurz an und vereinbaren Sie einen Termin,\
    Telefon: 0931-3592050, damit wir uns Zeit für Sie nehmen können.

    Mariannhillstraße 6A, 97074 Würzburg\
    [www.henneberger-partner.de](http://www.henneberger-partner.de)\
    und [www.kunst-trifft-steuer.de](http://www.kunst-trifft-steuer.de)
  en: |
    **Invitation to the Matinée – Sunday, September 22, 2019, 11 am**\
    HENNEBERGER und Partner – Tax Advisors

    Late 13th century, from Old French _ocean_, from Latin _oceanus_, from Greek _okeanos_, the great body of water or sea of unknown origin surrounding the flat earth.\
    In earlier times, when the only known landmasses were Eurasia and Africa, the ocean was an endless river flowing around them.

    On view: a mix of delicate drawings – the orbital drawings – and photographs/collages from the California / nitty-gritty blender series. The title of the exhibition – Oceans – serves as both a geographical and metaphorical reference to the works shown; it represents the principle of a nearly inexhaustible reservoir of circles, densities, overlaps, pictorial ideas, things to be explored.

    You are also warmly welcome to view the exhibition at other times –\
    both during regular office hours Mon–Thur 8 am – 5 pm and Fri 8 am – 1 pm,\
    and beyond.\
    Please call ahead to arrange a visit: tel. 0931-3592050, so we can give you our full attention.

    Mariannhillstraße 6A, 97074 Würzburg\
    [www.henneberger-partner.de](http://www.henneberger-partner.de)\
    and [www.kunst-trifft-steuer.de](http://www.kunst-trifft-steuer.de)
