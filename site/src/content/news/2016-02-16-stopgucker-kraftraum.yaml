body:
  de: |
    Herzliche Einladung zur Ausstellung\
    **Stoppgucker Kraftraum**\
    **5. März bis 13. Mai 2016**

    von Kathrin Feser, Kristin Finsterbusch und Roswitha Vogtmann.\
    in allen 1-2-3 Fluren der vhs Würzburg.

    Kuratorin: Brigitte Meister-Götz

    _Roswitha Vogtmann_, roswitha-vogtmann.de\
    Freies Zeichenschreiben in Anlehnung an östliche Schriftkunst: Atem-Kraft-Bewegung-Stille-Klarheit

    _Kristin Finsterbusch_, kristinfinsterbusch.de\
    Start Nullpunkt, Mittel Ungeduld, Ziel ungewiss.\
    Zeichnen bedeutet zwischen der Realität der Welt und der Realität im Kopf zu vermitteln.

    _Kathrin Feser_, circlefly.de\
    Im Ornament ist ein reiches ästhetisches Wissen eingelagert, das hilft, sich jenseits des visuellen Overkills und jenseits des Hyperrealen zu orientieren.

    Die _Vernissage_ findet am Samstag, den 5. März 2016 um 19 Uhr statt.\
    Musik: 3 Etagen – Klangart:\
    [Geräuschdieb-Dierk Berthel](http://www.dierk-berthel.de)\
    [Instrumental-Jörg Meister](http://www.jazzini-wuerzburg.de)\
    [Gesang-Oliver Munique](http://www.olivermunique.de)

    vhs Würzburg, Münzstraße 1, Würzburg\
    Öffnungszeiten: Mo – Fr 9 – 19 Uhr, Sa 9 – 18 Uhr\
    Sonntag, Feiertag und Schulferien geschlossen
  en: |
    you are invited to the exhibition\
    **Stoppgucker Kraftraum**\
    **March 5 to May 13, 2016**

    Art by Kathrin Feser, Kristin Finsterbusch and Roswitha Vogtmann.\
    in all 1-2-3 corridors of the Comunity College (vhs) in Würzburg (Germany).

    This show is curated by Brigitte Meister-Götz.

    _Roswitha Vogtmann_, roswitha-vogtmann.de\
    free signage-writing in relationship to the Eastern Art of Writing: breath-power-movement-silence-clarity

    _Kristin Finsterbusch_, kristinfinsterbusch.de\
    Start point zero, media impatience, goal uncertain.\
    Drawing means mediation between the reality of the World and the reality in the head.

    _Kathrin Feser_, circlefly.de\
    There lays a rich aesthetical knowledge imbedded in ornament, which helps with orientation beyond the visual overkill and beyond the hyper-real.

    **Opening reception will be on Saturday, March 5 2016 at 7 pm.**\
    Music: 3 corridor – sound – art:\
    [Geräuschdieb-Dierk Berthel](http://www.dierk-berthel.de)\
    [Instrumental-Jörg Meister](http://www.jazzini-wuerzburg.de)\
    [Gesang-Oliver Munique](http://www.olivermunique.de)

    vhs Würzburg, Münzstraße 1, Würzburg\
    open: Mon – Fri 9 am – 7 pm, Sat 9 am – 6 pm\
    colsed on Sun, holidays and during school vacation
