    title: Himmel über Mercedes
body:
  de: |
    _Kunst zwischen Limousinen_ bildet den Auftakt zur deutsch/italienischen Ausstellungs-Serie mit dem Titel _TransForm_. Die Gruppenausstellung von Werner Kiesel, Kathrin Feser, Irmtraud Klug-Berninger, Cornelia Krug-Stührenberg, Magnus Kuhn und Roland Schaller findet im gläsernen Präsentationsraum von Mercedes Benz in Würzburg statt. Unsere Arbeiten in den unterschiedlichsten Materialien und Techniken werden sich zwischen den Linousinen behaupten können. Feierlich eröffnet wird die Ausstellung am Donnerstag Abend den **14. Juni** um **18 Uhr** mit Worten von Frau Renate Freyeisen, einer Performance der _Werkzeuge des Grauens_ von Magnus Kuhn und Werner Kiesel am Baß, gefolgt von einem exzellentem Catering! Zu besuchen ist die Schau täglich bis einschließlich **15. Juli**.

    Mercedes Benz (Glas-Neubau), Randersackerer Straße 54, Würzburg.
  en: |
    _Art between limousines_ preludes the Italian/German exhibition series titled _TransForm_. The 6 person show with Werner Kiesel, Irmtraud Bern-Klug, Cornelia Krug-Stührenberg, Magnus Kuhn and Roland Schaller will be in the showroom of Mercedes Benz in Würzburg. Our work, consisting of a diverse range of media and technique, will bear up its presence against the limousines. This exhibition will be opened ceremoniously Thursday night, **June 14**, starting at **6 pm** and will have an open ending. Magnus Kuhn will perform his _Tools of Horror_ while Werner Kiesel plays the contrabass. And excellent catering will round off the event. Visitors are welcomed on all seven days of the week until **July 15**.

    Mercedes Benz (enormous glass building) on Randersackerer Straße 54, Würzburg.
