body:
  de: |
    ### “StaubRaub – Alte Werke neu gesehen”

    30\. September 2012 – 28. April 2013 (verlängert!!!)\
    Kuratiert von Felix Röhr und Sebastian von Papp.

    Am Sonntag, den 30. September 2012 eröffnet die Sonderausstellung _StaubRaub – Alte Werke neu gesehen_ in der Graphischen Sammlung des Martin von Wagner Museums. Würzburger Künstler interpretieren alte Werke ganz neu. Schirmherr Oberbürgermeister Georg Rosenthal.\
    Die Vernissage beginnt um 10.30 Uhr im Toscanasaal der Residenz.

    Martin Armbruster. Dieter Brembs. Kathrin Feser. Kurt Grimm. Nikola Jaensch. Sascha Kuehnlein. Rosario Rebello de Andrade. Sebastian von Papp. Andi Schmitt. Angelika Summa.

    Öffentliche Führung am 28.9.2012. Künstlergespräche am 11.11.2012. Öffentliche Führung mit Kurator Felix Röhr am 9.12.2012.

    **Finissage – Sonntag 28.4.2013 – zwischen 10 und 13 Uhr** werden wir mit etwas Wein und anderen Spezereien ein letztes Mal den Besuchern die Möglichkeit geben die Ausstellung zu begehen und sich im einen oder anderen Künstlergespräch zu informieren.

    Martin von Wagner Museum, Süd Flügel\
    [Residenzplatz 2a, Würzburg](https://maps.google.com/maps?q=Residenzplatz+2a,+W%C3%BCrzburg,+Deutschland\&hl=en\&ie=UTF8\&ll=49.786363,9.944859\&spn=0.02793,0.05682\&sll=37.269174,-119.306607\&sspn=8.809637,14.545898\&oq=Residenzplatz+2a\&hnear=Residenzplatz+2A,+97070+W%C3%BCrzburg,+Unterfranken,+Bayern,+Germany\&t=m\&z=14)\
    Telefon 0931.3182288\
    Öffnungszeiten Di bis Sa 10.00 bis 13.30 Uhr. Di und Do 16.00 bis 18.00 Uhr. [So 14-tägig, siehe Kalender hier](http://www.museum.uni-wuerzburg.de/%C3%B6ffsonntag.html).
  en: |
    ### “StaubRaub – Old Masters newly seen”

    September 30, 2012 – April 28, 2013 (extended!!!)\
    Curated by Felix Röhr and Sebastian von Papp.

    On Sunday September 30, 2012 will be the opening reception of _StaubRaub_ – _DustTheft_ at Graphic Collection at the Martin von Wagner Museum. Artists with a relationship to Würzburg interpret old paintings in a contemporary way. Festivities start at 10.30 am in the Residenz’ Toscanasaal (the Tuscany Room).

    Martin Armbruster. Dieter Brembs. Kathrin Feser. Kurt Grimm. Nikola Jaensch. Sascha Kuehnlein. Rosario Rebello de Andrade. Sebastian von Papp. Andi Schmitt. Angelika Summa.

    Public, guided tour on 9/28/2012. Artist talks on 11/11/2012. Public, guided tour through this special exhibition with curator Felix Röhr on 12/9/2012.

    **Finissage – Sunday 4/28/2013 – between 10 am and 1 pm** will be the last, and festive opportunity for visitors to see the show, and meet some of the artist. Don’t miss it!

    Martin von Wagner Museum, South Wing\
    [Residenzplatz 2a, Würzburg](https://maps.google.com/maps?q=Residenzplatz+2a,+W%C3%BCrzburg,+Deutschland\&hl=en\&ie=UTF8\&ll=49.786363,9.944859\&spn=0.02793,0.05682\&sll=37.269174,-119.306607\&sspn=8.809637,14.545898\&oq=Residenzplatz+2a\&hnear=Residenzplatz+2A,+97070+W%C3%BCrzburg,+Unterfranken,+Bayern,+Germany\&t=m\&z=14)\
    phone 0931.3182288\
    open Tue to Sat 10 am to 1.30 pm. Tue and Thu 4 pm to 6 pm. [Sun see schedule here](http://www.museum.uni-wuerzburg.de/%C3%B6ffsonntag.html).
