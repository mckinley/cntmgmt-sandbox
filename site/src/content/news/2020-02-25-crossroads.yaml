  de: |
    **Crossroads**\
    Ausstellung von Kathrin Feser\
    im Hannsheinz-Bauer-Haus, Semmelstraße 46R, Würzburg

    6\. März – 19. Juli 2020

    **Vernissage Freitag 6. März 2020, 18 Uhr**\
    Einführung: Susanne Dreier, MA\
    Musik: Johannes Liepold\
    Eintritt frei

    Anmeldung erwünscht

    Hannsheinz-Bauer-Haus\
    Semmelstraße 46R\
    97070 Würzburg\
    fon 0931-51812\
    fax 0931-3041691\
    <ausstellung@spd-wuerzburg.de>

    _Crossroads_ erzählt vom Leben in den Straßen. Von Treffpunkten, Verzweigungen und Entscheidungen.\
    Aufgewachsen im Würzburger Umland, zog und zieht es Kathrin Feser immer wieder in die Ferne, vor allem in die kalifornische Metropole San Francisco, wo sie u.a. auch studierte. Sie kann und will sich nicht so recht entscheiden; zwischen Stadt und Land, zwischen Geborgenheit und Grenzenlosigkeit. Das spiegelt sich auch in ihren Arbeiten wider, die unterschiedlicher nicht sein könnten. Filigrane, komplexe Zeichnungen (Orbital Drawings), farbenreiche Foto-Collagen (California) und Acryl auf Planen (Streetview) verarbeiten Beobachtungen aus dem Alltag der Stadtwelten.

    Öffnungszeiten:\
    Mo.-Do., 10:30-15:00 Uhr\
    Fr., 10:30-13:00 Uhr\
    Andere Termine und Führungen mit der Künstlerin sind auf Anfrage möglich.
  en: |
    **Crossroads**\
    Exhibition by Kathrin Feser\
    at Hannsheinz-Bauer-Haus, Semmelstraße 46R, Würzburg

    March 6 – July 19, 2020

    **Opening reception: Friday, March 6, 2020, 6 pm**\
    Introduction: Susanne Dreier, MA\
    Music: Johannes Liepold\
    Free admission

    Registration appreciated.

    Hannsheinz-Bauer-Haus\
    Semmelstraße 46R\
    97070 Würzburg\
    tel. 0931-51812\
    fax 0931-3041691\
    <ausstellung@spd-wuerzburg.de>

    _Crossroads_ tells of life in the streets. Of meeting points, forks in the road, and decisions.\
    Having grown up on the outskirts of Würzburg, Kathrin Feser has always been drawn to distant places – above all to the California city of San Francisco, where she also studied. She cannot and does not want to quite choose between city and country, between rootedness and boundlessness. This is reflected in her work, which could hardly be more diverse. Delicate, complex drawings (Orbital Drawings), colourful photo-collages (California), and acrylic on tarpaulins (Streetview) all process observations from everyday life in urban worlds.

    open Mon–Thur 10:30 am – 3 pm\
    Fri 10:30 am – 1 pm\
    Other times and guided tours with the artist available on request.
