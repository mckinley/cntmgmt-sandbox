body:
  de: |
    Endlich, endlich – die **gallery** hier auf circlefly.de zeigt viele neue Arbeiten.\
    Das Meiste hiervon war im vergangenen Herbst in der _Peng! – Peng!_ Ausstellung in Karlstadt zu sehen:\
    [cut-outs](/gallery/cut-outs/virtuositaet/), [Fotos](/gallery/foto-collage/minicrime1/), [Malerei](/gallery/malerei-auf-karton/al-ping-pong/), meinen ersten Siebdruck [Peng! – Peng!](/gallery/mixed-media/peng-peng/), den gibt es auch im **shop**, die [Vierklang-Kugel](/gallery/mixed-media/vierklang/) und die Gesamtansicht von [greed](/gallery/mixed-media/greed/), die Arbeit zu einer der Sieben Todsünden, die im Februar in der [space gallery](http://www.spacegallerysf.com/) in San Francisco ausgestellt war.
  en: |
    Finally, finally – my **gallery** here on circlefly.de is showing lots of new work.\
    Most of it was presented last fall in my _Peng! – Peng!_ exhibition in Karlstadt:\
    [cut-outs](/en/gallery/cut-outs/virtuositaet/), [photos](/en/gallery/foto-collage/minicrime1/), [paintings](/en/gallery/malerei-auf-karton/al-ping-pong/), my very first silkscreen print [Peng! – Peng!](/en/gallery/mixed-media/peng-peng/), also available in my **shop**, the [Vierklang-ball](/en/gallery/mixed-media/vierklang/), and a general view of [greed](/en/gallery/mixed-media/greed/), the piece on one of the Seven Deadly Sins wich was shown in February at [space gallery](http://www.spacegallerysf.com/) in San Francisco.
