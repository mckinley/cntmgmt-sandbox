body:
  de: |
    **PlanSpiel – Kunstpreis der Stadt Marktheidenfeld 2010**

    Bin in der jurierten Gruppenausstellung im Franck-Haus vom **30. Oktober bis zum 12. Dezember 2010**. Der Kunstpreis, der alle zwei Jahre vergeben wird, ist in diesem Jahr für das Thema Planspiel in der Kategorie Zeichnung ausgeschrieben. Mein Beitrag besteht aus zwei seriellen _eine Schnur_ Zeichnungen in Tusche auf Papier. Diese bestehen jeweils aus zwei Linien, eine Schnur bildend, die sich mit nur einem Anfang und einem Ende über das gesamte Papierformat winden und verknoten. Kommt vorbei und seht sie Euch an!\
    Vernissage ist am 29. Oktober und die Finissage ist am 12. Dezember jeweils um 19 Uhr. Hoffe wir sehen uns dort!

    Franck-Haus\
    [Untertorstraße 6](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=Untertorstra%C3%9Fe+6,+Marktheidenfeld,+Deutschland\&sll=37.0625,-95.677068\&sspn=55.937499,122.34375\&ie=UTF8\&hq=\&hnear=Untertorstra%C3%9Fe+6,+97828+Marktheidenfeld,+Main-Spessart,+Bayern,+Germany\&z=16)\
    Marktheidenfeld\
    Öffnungszeiten Mi|Do|Fr|Sa 14 – 18 Uhr. So und Feiertag 10 – 18 Uhr
  en: |
    **PlanSpiel – Art Prize 2010 by the city of Marktheidenfeld**

    I am part of a juried group show in the Franck-House Gallery (the blue baroque townsman’s house from 1745) **between October 30 and December 12 of 2010**. The art prize, which is awarded every two years, runs under the theme of _planspiel_ its category is drawing only. My contributions are two serial _one string_ drawings in ink on paper. Each consists of two drawn lines forming a string, having only one beginning and one ending they wind and knot themselves across their big sheet of paper. Come by and see for yourself!

    Opening reception will be on October 29th, closing reception on December 12th, both times starting at 7 pm. Hope we get to meet there!

    [Franck-House](http://en.wikipedia.org/wiki/File:Franck_Haus_Marktheidenfeld.jpg)\
    [Untertorstraße 6](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=Untertorstra%C3%9Fe+6,+Marktheidenfeld,+Deutschland\&sll=37.0625,-95.677068\&sspn=55.937499,122.34375\&ie=UTF8\&hq=\&hnear=Untertorstra%C3%9Fe+6,+97828+Marktheidenfeld,+Main-Spessart,+Bayern,+Germany\&z=16)\
    Marktheidenfeld\
    open Wed|Thu|Fri|Sat 2 – 6 pm. Sun and holiday 10 am – 6 pm
