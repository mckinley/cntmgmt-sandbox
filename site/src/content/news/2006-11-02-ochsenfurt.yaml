body:
  de: |
    _Ein Gebäude…_\
    Eine Gruppenausstellung von 24 Künstlern aus dem näheren und ferneren Würzburger Umfeld. Meine Arbeiten befinden sich im 1. Stockwerk, hinten rechts, im ehemaligen Raum für Gebührenentrichtungen.

    Ausstellung im ehemaligen Amtsgericht in Ochsenfurt, Kellereistraße 8\
    **12. November 2006 bis 29. Januar 2007**\
    Vernissage: 12. November, 11 Uhr

    Öffnungszeiten Fr 14 – 18 Uhr, Sa|So 11 – 18 Uhr, sowie nach Vereinbarung unter 0173.3221562 (Martin Sinn)
  en: |
    _Ein Gebäude… \[One Building]_\
    24 artists from the around Würzburg and Germany. A group exhibition where every participating artist has his own room for presentation. The building is a 3 floor spanning former district court house. My room is to be found on the second floor to the right, a room wich was used for paying charges.

    **11/12/2006 – 1/29/2007**\
    opening reception: November 12th at 11 am

    Ochsenfurt, Kellereistraße 8\
    open Fri 2 – 6 pm. Sat|Sun 11 am – 6 pm, and by appointment cell 0173.3221562 (Martin Sinn)
