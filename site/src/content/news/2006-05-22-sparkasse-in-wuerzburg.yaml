date: "2006-05-22"
lang: de
translation: reviewed
body:
  de: |
    Die Ausstellung ist bis zum 7. Juni verlängert!

    _Malerei und Installation_\
    [Rosário Rebello de Andrade](http://www.rebello.eu) und Kathrin Feser.

    **9. März bis 7. Juni 2006**\
    Sparkasse Mainfranken Würzburg, Beratungs Center im 1. Stock, Hofstraße 7\
    Öffnungszeiten Mo|Di|Mi|Fr 8.30 – 16.30 Uhr, Do 8.30 – 17.30 Uhr
  en: |
    The show dates have been extended till **July 22**!

    [Rosario Rebello de Andrade](http://www.rebello.eu) and Kathrin Feser.\
    [_Paintings and Installation_](/en/news/2006-03-04-sparkasse-wuerzburg/)

    3/9 – 6/7/2006.

    Sparkasse Mainfranken Würzburg, Beratungs Center, 2nd floor, Hofstraße 7.\
    open Mon|Tue|Wed|Fri. 8:30 am – 4:30 pm, Thur 8:30 am – 5:30 pm.
