body:
  de: |
    **Vernissage, Sonntag, 9. November 2014 um 11 Uhr**

    Die Ausstellung geht vom **9. November bis zum 7. Dezember 2014**

    Die jurierte Gruppenausstellung zeigt im historischen Turm der Stadtbefestigung Papierarbeiten im Format 20×20 von 39 Künstlerinnen und Künstlern aus ganz Bayern.

    _Baier Ulrike, Balda Renate, Böhm Andreas, Cleve Viktor, Daisuke Ogura, De Tiege Elzemieke, Feser Kathrin, Fürstenhöfer Roland, Gebhardt Monika, Gruber Christine, Hirschvogl Anneliese, Holzner Marile, Hönig Renate, Hörmann Wolfgang, Horn Alexander, Hühn Anita, Jacquier Fann, Kaiser Rainer, Karrer Rita, Kausche Marion, Koberg Gisa, König Christine, Krohn Antje, Kutschera Nana, Lehmann Monika, Litvai Peter, Marquard Gerhard, Oeser Friederike, Ranftl Helmut, Reichenauer Maria, Roth Karin, Scheidle Jeanette, Schollerer Madeleine, Schön Christine, Schuszter Turid, Supé Monika, Unruh Stefanie, Weiss Leonore und Zitzelsberger Liz._

    Öffnungszeiten: Samstag|Sonntag 14 – 18 Uhr\
    [KUNSTVEREIN AICHACH](http://www.kunstverein-aichach.de)\
    Köglturm am Unteren Tor\
    Hinterm Turm 4, 86551 Aichach
  en: |
    **Opening reception, Sunday, November 9, 2014 at 11 am**

    You can visit the show between **November 9 and December 7, 2014**

    This is a juried group show presenting works on paper (size 7.9 × 7.9 inch) by 39 Bavarian artists. The gallery is situated in the historic tower of the cities old parapet.

    _Baier Ulrike, Balda Renate, Böhm Andreas, Cleve Viktor, Daisuke Ogura, De Tiege Elzemieke, Feser Kathrin, Fürstenhöfer Roland, Gebhardt Monika, Gruber Christine, Hirschvogl Anneliese, Holzner Marile, Hönig Renate, Hörmann Wolfgang, Horn Alexander, Hühn Anita, Jacquier Fann, Kaiser Rainer, Karrer Rita, Kausche Marion, Koberg Gisa, König Christine, Krohn Antje, Kutschera Nana, Lehmann Monika, Litvai Peter, Marquard Gerhard, Oeser Friederike, Ranftl Helmut, Reichenauer Maria, Roth Karin, Scheidle Jeanette, Schollerer Madeleine, Schön Christine, Schuszter Turid, Supé Monika, Unruh Stefanie, Weiss Leonore und Zitzelsberger Liz._

    open: Saturday|Sunday 2 pm – 6 pm\
    [KUNSTVEREIN AICHACH](http://www.kunstverein-aichach.de)\
    Köglturm am Unteren Tor\
    Hinterm Turm 4, 86551 Aichach
