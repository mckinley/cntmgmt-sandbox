    ### Kulturherbstkunstinveitshöchheim

    Sophie Brandes. Kathrin Feser. Antje Friederich. Katharina Schwerd. Helga Teuber. Ulrike Zimmermann.

    Opening reception on Sunday September 23 at 11 am.\
    Introduction and ceremony by mayor Rainer Kinzkofer and music by Selin.

    9.23. / 9.29. / 9.30. / 10.3. / 10.6. / 10.7. / 10.13. / 10.14.2012\
    Sat 2 pm to 5 pm, Sun and holliday 11 am to 5 pm

