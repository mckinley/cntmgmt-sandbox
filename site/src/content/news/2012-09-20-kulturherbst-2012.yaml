    ### Kulturherbstkunstinveitshöchheim

    Sophie Brandes. Kathrin Feser. Antje Friederich. Katharina Schwerd. Helga Teuber. Ulrike Zimmermann.

    Matinee am Sonntag, 23. September, um 11 Uhr.\
    Eröffnung durch Bürgermeister Rainer Kinzkofer mit Musik von Selin.

    23.9. / 29. + 30.9. / 3.10. / 6. + 7.10. / 13. + 14.10.2012\
    Sa 14 bis 17 Uhr, So und Feiertag 11 bis 17 Uhr

    Sitzungssaal des Rathauses\
