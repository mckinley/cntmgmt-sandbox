body:
  de: |
    _Das Geheimnis der …_\
    Eine 2-Personen-Ausstellung von [Horst Ziegler](http://formkabinett.de/) und Kathrin Feser. Gezeigt werden für die Mühle spezifisch angefertigte Arbeiten.

    **9. bis 31. Juli 2005**\
    [Kulturforum Papiermühle](http://papiermuehle-homburg.de/) in Homburg, Gartenstraße 11, 97855 Markt Triefenstein, Telefon 09395.99222\
    Öffnungszeiten Mo|Di|Mi|Do|Fr 10 – 12 und 14 – 16 Uhr, Sa|So 10 – 12 und 14 – 17 Uhr.

    Am **22. Juli** um 7 Uhr findet ein Künstlergespräch statt.

    _Seit Anfang des 19. Jahrhunderts bis 1975 wurde hier die Kraft des Wasserrades zur Papier- und Pappenherstellung genutzt. In der Papiermühle Homburg befinden sich die Produktionsräume und die Wohnräume der Papiermacher unter einem Dach. Der Kern der Papiermühle stammt bereits aus dem 17. Jhd., er wurde andernorts Anfang des 19. Jhds. minutiös abgebaut und in Homburg wieder errichtet und erweitert. Die Papiermühle ist heute ein Industriemuseum mit angegliederter [Feinpapiermanufaktur](http://homburger-papiermanufaktur.de/) von Johannes Follmer._
  en: |
    2-person-show _Das Geheimnis der… \[The Secret of…]_\
    Kathrin Feser und [Horst Ziegler](http://formkabinett.de)\
    We will be showing work specifically inspired by and made for the paper mill.

    **7/9 till 7/31/2005**\
    Artist talk, **July 22nd at 7 pm**.

    [Kulturforum Papiermühle](http://www.papiermuehle-homburg.de) in Homburg\
    Gartenstraße 11, 97855 Markt Triefenstein, phone +49.(0)9395.99222\
    open Mon|Tue|Wed|Thur|Fri 10 am – 12 pm and 2 – 4 pm, Sat|Sun 10 am – 12 pm and 2 – 5 pm.

    _Water power was used to produce paper and cardboard, starting in the early 19th century and finishing in 1975. The papermill building hosts the production rooms as well as the apartment of the paper maker and his family. The core of the mill dates back to the 17th Century, it was dismanteled somewhere else in early eighteen hundreds, transported on the river to Homburg, rebuilt, extended shortly after. Today the papermill is an Industry museum with an integrated [FinePaperManufakture](http://homburger-papiermanufaktur.de/) . Run by Johannes Follmer, the mill’s papermaker in its fifth generation._
