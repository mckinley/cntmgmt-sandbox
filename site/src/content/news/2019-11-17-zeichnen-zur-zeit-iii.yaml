body:
  de: |
    **Zeichnen zur Zeit III**\
    als Teil der BBK Doppelausstellung.

    Zeichnung der Gegenwart – aktuelle künstlerische Positionen, faszinierend in der Linie, unmittelbar, reduziert oder kraftvoll. DIe künstlerischen Positionen sind so vielfältig wie die ZeichnerInnen auch.

    Vernissage ist am Freitag, 22.11.2019 um 19 Uhr.

    23.11. bis 22.12.2019

    Künstlerhaus im Kulturspeicher\
    Oakar-Laredo-Platz 1, 97080 Würzburg\
    Telefon 0931.50612\
    [www.bbk-unterfranken.de](http://www.bbk-unterfranken.de)

    Öffnungszeiten: Mi+Do 9 – 18 Uhr, Fr+Sa 15 – 18 Uhr | So 11 – 18 Uhr
  en: |
    **Zeichnen zur Zeit III**\
    as part of the BBK double exhibition.

    Drawing in the present – current artistic positions, fascinating in the line, immediate, reduced or powerful. The artistic positions are as diverse as the artists themselves.

    Opening reception: Friday, November 22, 2019 at 7 pm.

    November 23 – December 22, 2019

    Künstlerhaus in Kulturspeicher\
    Oskar-Laredo-Platz 1, 97080 Würzburg\
    tel. 0931.50612\
    [www.bbk-unterfranken.de](http://www.bbk-unterfranken.de)

    open Wed+Thur 9 am – 6 pm, Fri+Sat 3 – 6 pm | Sun 11 am – 6 pm
