title:
  de: Kunst füllt Räume
  en: Art fills Space
date: "2008-07-27"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/Rothenburg.jpg
    title: ehemaliges Amtsgericht, Rotehnburg
body:
  de: |
    _Kunst füllt Räume_ ist eine Gruppenausstellung in Rothenburg ob der Tauber, veranstaltet von den Herren Sinn, Stegmann und Stein. Gezeigt werden Arbeiten von Angelika Summa, Dieter Stein, Heike Kleinlein, Heinz Altschäffel, Herbert Janouschkowetz, Josef Versl, Kathrin Feser, Kurt Grimm, Luigi Malipiero, Martin Türk, Norbert Kleinlein und Peter Stein.

    Das Gebäude ist riesig! Besucher können hier auf 3 Stockwerken durch unzählige Räume und Gänge wandeln. Jeder Künstler hat seine eigenen Räumlichkeiten in denen die Bilder oder Skulpturen präsentiert werden. Meine Arbeiten werden im ersten Stock, vom letzten Treppenabsatz nach rechts, hängen (siehe Foto).

    Ich lade alle zur Vernissage am Sonntag den **3. August um 11 Uhr** ein. Glücklichen Umständen ist es zu verdanken, dass sowohl Gail Gilmore, bekannt für ihre weltweiten Opern- und Gospeldarbietungen, als auch Oliver Munique, stimmgewaltiger Baßbariton am Mainfranken-Theater in Würzburg, die Ausstellung gesanglich eröffnen werden. Des weiteren wird Luise Limburg eine anschauliche und kurzweilige Einführung zum Leben und zu den Arbeiten von Herbert Janouschkowetz halten. Die Schau endet mit dem **1. September**.

    **Der Eintritt ist frei!**

    Ehemaliges Amtsgericht, Ansbacher Straße (links vor dem Röder Stadttor), Rothenburg ob der Tauber\
    Öffnungszeiten Di|Mi|Do 15 – 19 Uhr, Sa|So 11 – 19 Uhr
  en: |
    _Art fills Space_ is a group exhibition in famous Rothenburg ob der Tauber, organized by three gentlemen, Mr. Sinn, Mr. Stegmann and Mr. Stein. Work of different media and dimension will be exposed by Angelika Summa, Dieter Stein, Heike Kleinlein, Heinz Altschäffel, Herbert Janouschkowetz, Josef Versl, Kathrin Feser, Kurt Grimm, Luigi Malipiero, Martin Türk, Norbert Kleinlein and Peter Stein.

    The building is vast! Which is why visitors will be able to stroll on three floors, finding their way through countless rooms and corridors. Each participating artist will have his own space to present work. You will find my section on the second floor to the right – see photo above, and imagine the doors to be gone.

    I am inviting everybody to join the opening reception on **Sunday, August 3 at 11 am**. Thanks to lucky circumstances the show will be opened by two famous singers, Gail Gilmore, known for her opera and gospel performances, and Oliver Munique, bass baritone at the Mainfranken-Theater in Würzburg. Furthermore a compelling introduction on life and work of Herbert Janouschkowetz will be given by Luise Limburg. Followed by clinking glasses and frisky cheering on a positive outcome of this worth while visiting exhibition. The show will end on **September 1**.

    **Free admission!**

    Former District Court, Ansbacher Straße (left side of the old Röder city gate), Rothenburg ob der Tauber\
    open Tue|Wed|Thur 3 – 7 pm, Sat|Sun 11 am – 7 pm
