title:
  de: Nürnberg
date: "2006-11-08"
lang: de
translation: reviewed
body:
  de: |
    Die _Galerie LandskronSchneidzik_, Galerie und Kunstagentur, zeigt im Rahmen einer Gruppenaustellung für einige Zeit mehrere meiner Cut-Out-Arbeiten.

    Deutschherrnstraße 15-19, 90429 Nürnberg\
    Öffnungszeiten Mi|Do|Fr 12 – 18 Uhr, Sa 12 – 16 Uhr, sowie nach Vereinbarung unter 0173.5825688 und 0170.4218914
  en: |
    The Gallery LandskronSchneidzik is having a large group show, and will be showing some of my cut-outs.\
    opening reception: 11/8 at 6.30 pm

    Deutschherrnstraße 15-19, 90429 Nürnberg\
    open Wed|Thur|Fri: 12 – 6 pm, Sat 12 – 4 pm, and by appointment cell 0173.5825688 and 0170.4218914
