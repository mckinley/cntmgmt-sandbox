  de: |
    ### balls deep – the last exhibition at 31 rausch

    Opening/Closing THIS FRIDAY 8/31/12 from 6pm till….?\
    BYOB!

    7 years hosting 42 shows with over 60 artists, an alternative exposure grant, lots of good times, and massive amounts of recycling.\
    This last show is going to be a group show of hopefully most of the artists who have had work up here. It should be an interesting mix!

    Also the front two rooms are all cleared out giving the gallery more space for video and sculpture!

    Take a look at the archives of all the past shows here- [www.31rausch.com](http://www.31rausch.com)

    _**31 Rausch**_\
    [31 Rausch Street](http://maps.google.com/maps?q=31+Rausch+Street,+San+Francisco,+CA\&hl=en\&ll=37.776312,-122.408799\&spn=0.007937,0.014538\&sll=37.0625,-95.677068\&sspn=63.856965,108.808594\&oq=31+Rausch\&hnear=31+Rausch+St,+San+Francisco,+California+94103\&t=m\&z=17) an der Folsom Street\
    San Francisco, CA 94103\
    Geöffnet nach Vereinbarung.\
    Chris McCaw\
    Telefon 415.552.8708\
    <chris@chrismccaw.com>
