body:
  de: |
    **Stückwerk – die jurierte Jahresausstellung der BBK-Mitglieder\
    24.11. – 23.12.2012**

    Vernissage ist am Freitag, den 23. November, ab 19 Uhr.\
    Grußwort der Stadt Würzburg: Johannes Engels (Fachbereichsleiter Kultur in Würzburg). Einführung: Magnus P. Kuhn ( Bildender Künstler). Musik: Nadine Winziers, Saxophon und Stefan Degner, Gitarre

    _Mosaikartig fügen sich die Arbeiten der Künstler zu einem großen Ganzen.\
    Jede Arbeit steht für sich allein. Im Ensemble zeigen die Kunstwerke die Vielfalt\
    des Berufsverbands Bildender Künstlerinnen und Künstler in allen Kunstsparten._

    In der Ausstellung ist unter anderem mein Bild _al ping pong_ (Acryl auf Karton) zu sehen.

    [BBK-und Werkstattgalerie im Kulturspeicher](http://www.bbk-unterfranken.de)\
    Oskar-Laredo-Platz 1, Würzburg\
    Telefon 0931-50612

    Öffnungszeiten Mi | Do | Fr | Sa 14 – 18 Uhr. So 11 – 18 Uhr
  en: |
    \*Stückwerk – a juried exhibition by BBK-members\
    11/24 – 12/23/2012\*

    The opening reception will be on Friday, November 23, starting at 7 pm.\
    With welcoming greetings by Johannes Engels, an introduction by Magnus P. Kuhn, and music by Nadine Winziers, saxophone und Stefan Degner, guitar

    _al ping pong_ (acrylic on cardboard) will be one of my pieces shown in the gallery.

    [BBK-und Werkstattgalerie im Kulturspeicher](http://www.bbk-unterfranken.de)\
    Oskar-Laredo-Platz 1, Würzburg\
    phone 0931-50612

    open Wed | Thur | Fri | Sat 2 pm to 6 pm. Sun 11 am to 6 pm
