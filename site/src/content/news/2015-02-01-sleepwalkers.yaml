body:
  en: |
    A short video about [Sleepwalkers](https://vimeo.com/117446799), Dan Rosenfeld’s interactive installation about luminous beings that live inside the walls of a historic building. It was commissioned by [Urban Putt](http://www.urbanputt.com), an indoor miniature golf course, restaurant, and bar, built by artists and designers in San Francisco.

    More information at [danrosenfeld.com/sleepwalkers](http://www.danrosenfeld.com/sleepwalkers)

    Concept & Execution – [Dan Rosenfeld](http://www.danrosenfeld.com)\
    Set Design – [Kathrin Feser](/en/)\
    Video – [Jae Lee](http://www.jaehyounglee.com)
