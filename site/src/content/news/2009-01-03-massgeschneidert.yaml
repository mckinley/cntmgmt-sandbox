body:
  de: |
    Nach einer mehrstündigen Rahmungsaktion, gestern in Würzburg, baumeln diese beiden cut-outs nun an Schnüren, sicher hinter Glas versiegelt.\
    Beide stammen aus der Serie **U.F.O.-Geräusche** aus dem Jahre 2006.

    Der Untertitel hier lautet\
    _zahllose Ungereimtheiten über Erdlinge im Sommer_.\
    Cut-out, Papier, Außenmaß 83×104 cm, ca. 4 cm tief

    Diese Arbeit ist übrigens nicht mehr zu haben. Für Interessierte habe ich aber noch einige weitere cut-outs aus der Serie – verpackt in riesigen Tüten und in einer großen Schublade liegend…
  en: |
    These two cut-outs are now hanging on strings, sealed and safe behind glass. Thanks to spending a couple of hours at a framing shop, yesterday in Würzburg. Both paper pieces are part of a series named **U.F.O.-Sounds**, dating all the way back to the year 2006.

    The composition you see here carries the following subtitle\
    _a myriad of contradictions on Earthlings in summer time_.\
    cut-out, paper, overall dimension 32.7 × 40.9″, approx. 1.6″ deep

    This particular piece is no longer available. But if you are interested, there a couple more cut-outs from this series, packed in huge plastic bags while residing in a large drawer…. just let me know.
