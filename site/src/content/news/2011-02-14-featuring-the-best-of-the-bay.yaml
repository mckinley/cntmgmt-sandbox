title:
  de: Featuring The Best Of The Bay
date: "2011-02-14"
lang: de
translation: reviewed
images:
  - src: /media/news/2011/ArtistsAlley.jpg
body:
  de: |
    **Best Of The Bay** – Gruppenausstellung\
    Vernissage, Weinprobe und französische Vorspeisen.\
    Samstag 26. Februar 2011 von 19 bis 22 Uhr\
    Der Eintritt kostet 15 $, wenn man meinen Namen erwähnt, sonst sind es 20 $.

    Die Ausstellung ist bis zum 5. März zu sehen.

    Artists Alley\
    [863 Mission Street](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=863+Mission+Street,+SF\&ie=UTF8\&hq=\&hnear=863+Mission+St,+San+Francisco,+California+94103\&z=17), zwischen 4. und 5. Straße\
    downtown San Francisco, gegenüber von Bloomingdales\
    Öffnungszeiten Di|Mi|Do|Fr|Sa 11 – 19 Uhr. So 13 – 19 Uhr
  en: |
    **Best Of The Bay** – group show\
    Opening reception, wine tasting and french appetizers.\
    Saturday February 26, 2011 from 7 pm to 10 pm\
    Admission 15 $ with mentioning my name, otherwise 20 $.

    You can visit the show until March 5.

    Artists Alley\
    [863 Mission Street](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=863+Mission+Street,+SF\&ie=UTF8\&hq=\&hnear=863+Mission+St,+San+Francisco,+California+94103\&z=17), between 4th Street and 5th Street\
    downtown San Francisco, across from Bloomingdales\
    open Tue|Wed|Thu|Fri|Sat 11am – 7pm. Sun 1pm To 7pm. (Mon Closed)
