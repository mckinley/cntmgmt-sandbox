  de: |
    **Im Zeichen der zeitgenössischen experimentellen Druckkunst**

    **imprints**

    Die Mappe IMPRINTS wurde zum 30 jährigen Jubiläum der Würzburger Druckwerkstatt geschaffen, die 1993 gegründet wurde. Die Werkstatt ist eine öffentliche Druckwerkstatt für manuelle Drucktechniken wie Lithografie, Hochdruck und Tiefdruck und arbeitet ganz unterschiedlicher Art. Es sind Projekte für Künstler, Workshops für Gruppen, Schulkurse aller Jahrgangsstufen sowie Events rund um den Druckmarkt in Würzburg. Die Künstler dieser Mappe sind Mitglieder des BBK Unterfrankens und haben fast ausschließlich in der Werkstatt gedruckt.

    **22.09.2024 – 21.10.2024**

    **Vernissage 21.09.2024 um 19 Uhr**

    Dierk Berthel, Sophie Brandes, Kathrin Feser, Kristin Finsterbusch, Christiane Gaebert, Jürgen Hochmuth, Kathrin Hubl, Dorette Jansen, Hans Krakau, Wiltrud Kuhfuß, Wolfgang Kuhfuß, Dietmar Modes, Hermann Oberhofer, Kerstin Römhild, Jutta Schmitt, Linda Schwarz.

    geöffnet:\
    Fr. 16 – 19 Uhr, Sa. 15-19 Uhr, So. 14-18 Uhr

    Grafikkabinett der BBK Galerie Frankfurt\
    Hanauer Landstraße 89\
    60314 Frankfurt am Main\
    E-Mail: post at bbk-frankfurt.de
  en: |
    **In the sign of contemporary experimental printmaking**

    **imprints**

    The IMPRINTS portfolio was created for the 30th anniversary of the Würzburger Druckwerkstatt, founded in 1993. The workshop is a public printmaking studio for manual printing techniques such as lithography, relief printing and intaglio, working in many different ways. It offers projects for artists, workshops for groups, school courses for all year groups, and events around the printmaking market in Würzburg. The artists in this portfolio are BBK Unterfranken members and have printed almost exclusively at the workshop.

    **September 22 – October 21, 2024**

    **Opening reception September 21, 2024 at 7 pm**

    Dierk Berthel, Sophie Brandes, Kathrin Feser, Kristin Finsterbusch, Christiane Gaebert, Jürgen Hochmuth, Kathrin Hubl, Dorette Jansen, Hans Krakau, Wiltrud Kuhfuß, Wolfgang Kuhfuß, Dietmar Modes, Hermann Oberhofer, Kerstin Römhild, Jutta Schmitt, Linda Schwarz.

