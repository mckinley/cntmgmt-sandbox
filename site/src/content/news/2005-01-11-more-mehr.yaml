body:
  de: |
    ### more.mehr

    **Die Ausstellung steht und hängt!** Die Vernissage war wunderbar – viele Besucher blieben bis Mitternacht, mit einem guten Dutzend feierten wir weiter bis frühmorgens um 3 Uhr!

    _An dieser Stelle nochmals besten Dank all denen – Bronson!!!! Ilse, Karlheinz, Brigitte, Uli, Beate, Ulla, Markus, Christiane, Kai, Conny, Christian, Wolfgang – , die mir bei den Vorbereitungen halfen und auch während des gesamten Abends alles am Laufen hielten und nebenher auch noch Kataloge verkauften._

    **more.mehr ist meine 1. Einzelausstellung überhaupt – anläßlich des Debütantenförderpreises, verliehen vom Bayerischen Staatsministerium für Wissenschaft, Forschung und Kunst. Begleitend zur Ausstellung hier in Würzburg ist ein detaillierter Katalog erschienen. Jedes Exemplar ist numeriert und signiert.**

    Die Ausstellung ist noch bis zum Sonntag, den **30. Januar** zu sehen.

    BBK Galerie im Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    Öffnungszeiten Di|Mi|So 11 – 18 Uhr, Do|Fr|Sa 13 – 20 Uhr . . . ich bin immer sonntags in der Galerie.

    Einladung zum **Künstlercafé am Sonntag den 16. Januar 2005**. Ab 11 Uhr gibt es in der Galerie Frühstück und live-Jazz mit PHILS JAZZ EQUIPMENT (Philip Schleyer p, Klaus Silbernagl b, Jörg Meister dr). Ich freue mich auf viele interessante Besucher!

    Ich bin sehr glücklich und stolz über und auf meine neue Webseite. Nehmt Euch etwas Zeit und fliegt durch all ihre Ecken und Winkel, Räume und Plätze. Es gibt mehr zu entdecken, als Ihr vielleicht anfangs vermutet. Einfach neugierig sein…schön wäre es dann, wenn Ihr mir von hier ein Email schicken würdet, versehen mit einem Kommentar, und Euch gleichzeitig noch für zukünftige Newsletter anmelden würdet. Ich verspreche in regelmässigen und nicht zu weit voneinender entfernten Abständen über alles zu informieren was sich so tut.

    **Schaut also öfter vorbei und empfehlt circlefly.de weiter!**

    Einen schönen Monat Januar – und vielleicht sehen wir uns ja noch in der Galerie.
  en: |
    **The show is up!** Its opening was phenomenal – unbelievable how many guests, great speech by Thomas Friedrich, and lots of compliments concerning the show as a whole and its pieces in particular. A great number of people stayed until midnight, a dozen until 3 o’clock in the morning.

    _I would like to cordially thank all the nice people who helped during the preparation, and during the opening night, bringing food, serving wine and selling catalogues > Bronson!!!! Ilse, Karlheinz, Brigitte, Uli, Beate, Ulla, Markus, Christiane, Kai, Conny, Christian, Wolfgang._

    **_more.mehr_ is my very first single-show – awarded on the occasion of receiving the Debutants Promotion Prize by the Bavarian State Ministry of Science, Research and Art. There is also a detailed catalogue accompanying the show here in Würzburg. The copies are numbered and autographed.**

    The exhibition can be visited until **January 30, 2005**.

    BBK Gallery at Museum Kulturspeicher, Veitshöchheimer Straße 5 in Würzburg.\
    open Tue|Wed|Sun 11 am – 6 pm, Thur|Fri|Sat 1 – 8 pm … I will be at the gallery Sundays.

    I’d also like to invite you to **Künstlercafé, Sunday January 16**. Starting at 11 am with breakfast/brunch and a live-Jazz-session with PHILS JAZZ EQUIPMENT (Philip Schleyer p, Klaus Silbernagl b, Jörg Meister dr). I am looking forward to meeting interesting people!

    I am extremely happy and proud of my new website. Please take your time and fly around. There are lots of things to discover – far more than you might guess in the beginning. Be curious. I would love to get an email from circlefly, and maybe you will also sign up for my newsletter. I promise to keep you updated regularly on everything that happens.

    **Please come by often, and tell your friends about circlefly.de!**

    I wish you a nice month of January – and maybe we will meet at the gallery.
