body:
  de: |
    ### Schnittmenge – _Running down on Milkey Way_

    **Einzelausstellung vom 16. April bis zum 6. Juni 2010 in Nürnberg**

    Es begann mit meinem Kontinenten-Wechsel und dem Plan in dieser Ausstellung nur Arbeiten zu zeigen, die in den vergangen Monaten in San Francisco und Oakland entstanden sein würden. Es ergab sich, dass ich von all meinen Techniken einzig das Zeichnen der Linie beibehielt, diese begann zu kreisen, sich zu überlagern und zu verdichten. Sie repräsentiert mein Abenteuer am Pazifik, mein ureigenes “California dreamin”.

    Kernstück der Ausstellung werden sieben 4 mal 4 Fuß grosse Bilder in Öl auf Leinwand bilden. Desweiteren werden Zeichnungen, Cut-Outs und Skulpturales zu sehen sein.

    Zur **Vernissage meiner ersten Einzelausstellung in Nürnberg, im [Galeriehaus Nord](http://www.galeriehaus-nuernberg-nord.de/) am Freitag, den 16. April um 18 Uhr** möchte ich alle ganz herzlich einladen. **[Karsten Stracke](http://www.youtube.com/watch?v=9EruSeWXCFM)** aus Würzburg wird an diesem Abend Musik aus drei Jahrhunderten am Keyboard spielen.\
    Am 18. April, sowie an einigen noch festzulegenden Sonntagen, werde ich zwischen 11 und 16 Uhr in der Galerie sein.

    Galeriehaus Nord\
    Wurzelbauerstraße 29\
    Nürnberg\
    Öffnungszeiten Di|Mi 11 – 16 Uhr. Do|Fr 11 – 13 Uhr. So 11 – 16 Uhr\
    und nach telefonischer Vereinbarung unter 0911.553387
  en: |
    ### Schnittmenge/intersection – _Running down on Milkey Way_

    **A solo show between April 16 and June 6, 2010 in Nürnberg, Germany**

    The work you will see was initiated solemnly by me transferring from one continent to the other, followed by a plan of producing a new body of work while re-entering life in San Francisco and Oakland, and intending to show these pieces in Nürnberg, in spring of 2010.

    Of all my previous techniques it was only the drawing of the line itself that stayed, and that became decisive, that turned into circles, and that densified, and that turned autonomous. Representing my adventures by the Pacific, they ended up documenting my very own “California dreamin”.

    Seven 4′ × 4′ paintings done in oil on canvas, will form the center piece of this exhibition, adjoined by drawings, cut-outs and sculpturesque pieces.

    The **opening reception at the [Galeriehaus Nord](http://www.galeriehaus-nuernberg-nord.de/) will be happening on Friday, April 16 at 6 pm**. This will be my first solo show in Nürnberg, which makes me extra-excited to invite you all to come by and join me there. Following the american example, there will be no introductory speech. **[Karsten Stracke](http://www.youtube.com/watch?v=9EruSeWXCFM)** from Würzburg will perform music of three centuries on his keyboard.\
    I also will be at the gallery on April 18, and some following Sundays, between 11 am and 4 pm.

    Galeriehaus Nord\
    Wurzelbauerstraße 29\
    Nürnberg\
    open Tue|Wed 11am – 4 pm. Thu|Fr 11 am – 1 pm. Sun 11 am – 4 pm\
    and by appointment +49.(0)911.553387
