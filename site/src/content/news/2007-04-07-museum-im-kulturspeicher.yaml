title:
  de: Museum im Kulturspeicher
  en: Public Collection
date: "2007-04-07"
lang: de
translation: reviewed
images:
  - src: /media/news/2007/Sprachverwirrung.jpg
    title: Sprachverwirrung
    caption:
      de: cut-out farbige Papiere in Schichten, 50 x 50 cm, 2006
body:
  de: |
    Im Zuge der Einzelausstellung im Maximilianeum in München 2006 wurde nun mein Cut-Out _Sprachverwirrung_ von der SPD erworben und der **Öffentlichen Sammlung** des Museums im [Kulturspeicher](http://www.kulturspeicher.de) gespendet. Das Bild besteht aus mehreren Schichten farbiger Papiere, die mit dem Teppichmesser geschnitten wurden. Die Arbeit kann vorerst und nur für kurze Zeit neben einem Siebdruck von Andy Warhol im ersten Stockwerk des Museums besichtigt werden.

    Museum im Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    Öffnungszeiten Di 13 – 18 Uhr, Mi|Fr|Sa 11 – 18 Uhr, Do 11 – 19 Uhr
  en: |
    In connection with last year’s solo exhibition at the Maximilianeum in Munich, a cut-out piece called _Sprachverwirrung \[perplexity of language]_ (19.7″ × 19.7″, colored paper, 2006) has been donated by the SPD (Social Democratic Party) to the **public collection** of the [Museum Kulturspeicher](http://www.kulturspeicher.de) in Würzburg. For a brief period, it will be presented to the public next to a silkscreen done by Andy Warhol.

    Museum im Kulturspeicher, Veitshöchheimer Straße 5, Würzburg\
    open Tue 1 – 6 pm, Wed|Fri|Sat 11 am – 4 pm, Thur 11 am – 7 pm
