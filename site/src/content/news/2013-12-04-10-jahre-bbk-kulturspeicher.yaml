body:
  de: |
    BEWEGENDBUNTKONSTANT\
    jurierte BBK-Gruppenausstellung\
    6\. – 29. Dezember 2013

    Unter dem Titel BBK – Bewegend-Bunt-Konstant zeigt der BBK eine Ausstellung seiner Mitglieder zum zehnjährigen Bestehen der BBK-Galerie und des Künstlerhauses im Kulturspeicher. Damit feiern wir unsere Kontinuität sowie unsere Vielseitigkeit.

    Vernissage ist am Freitag, den 6. Dezember um 19 Uhr

    [BBK-Galerie und Werkstattgalerie im Museum Kulturspeicher\
    Oskar-Laredo-Platz 1](http://maps.google.de/maps?q=Oskar-Laredo-Platz+1,+W%C3%BCrzburg\&hl=en\&ie=UTF8\&sll=48.917413,11.407993\&sspn=5.863386,9.404297\&hq=Oskar-Laredo-Platz+1,\&hnear=W%C3%BCrzburg,+Lower+Franconia,+Bavaria\&t=m\&z=14), 97080 Würzburg

    Öffnungszeiten Mi | Do | Fr | Sa 14 – 18 Uhr. So 11 – 18 Uhr
  en: |
    BEWEGENDBUNTKONSTANT\
    juried BBK-group show\
    December 6 – 29, 2013

    Unter dem Titel BBK – Bewegend-Bunt-Konstant zeigt der BBK eine Ausstellung seiner Mitglieder zum zehnjährigen Bestehen der BBK-Galerie und des Künstlerhauses im Kulturspeicher. Damit feiern wir unsere Kontinuität sowie unsere Vielseitigkeit.

    Opening reception will be Friday, December 6 at 7 pm

    [BBK-Galerie und Werkstattgalerie im Museum Kulturspeicher\
    Oskar-Laredo-Platz 1](http://maps.google.de/maps?q=Oskar-Laredo-Platz+1,+W%C3%BCrzburg\&hl=en\&ie=UTF8\&sll=48.917413,11.407993\&sspn=5.863386,9.404297\&hq=Oskar-Laredo-Platz+1,\&hnear=W%C3%BCrzburg,+Lower+Franconia,+Bavaria\&t=m\&z=14), 97080 Würzburg

    open Wed | Thu | Fri | Sat 2 pm – 6 pm. Sun 11 am – 6 pm
