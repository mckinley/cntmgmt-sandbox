  de: |
    **WELLE**\
    BBK Ufr. Mitgliederausstellung\
    26.03. – 23.05.2021

    Ausstellende KünstlerInnen: Nabiha\&Thom – Lena Maria Gräwe – Gerhard Bauer – Isa Wagner – Haga Bühler – Kerstin Römhild – Elvira Lantenhammer – Kathrin Feser – Dietmar Modes – Gunter Schmidt – Olga Liashenko – Anita Tschirwitz – Claire Wimmer – Gabriele Kunkel – Roswitha Vogtmann – Gerda Enk – Hanako Itsuhage – Ines Schwerd – Christiane Gaebert – Gabi Weinkauf – Matthias Braun – W+W Kuhfuss – Werner Winterbauer – Linde Unrein – Angelika Summa – Daniel Grimme – Udo Breitenbach

    BBK Galerie im Kulturspeicher\
    Oskar-Laredo-Platz 1, Würzburg

    Freitag von 15 bis 18 Uhr, Samstag von 14 bis 18 Uhr und Sonntag von 11 bis 18 Uhr.\
    Einlass mit Anmeldung bei der Aufsicht.\
    Es gelten die aktuellen Hygienebedingungen.
  en: |
    **WELLE**\
    BBK Ufr. member exhibition\
    March 26 – May 23, 2021

    Exhibiting artists: Nabiha\&Thom – Lena Maria Gräwe – Gerhard Bauer – Isa Wagner – Haga Bühler – Kerstin Römhild – Elvira Lantenhammer – Kathrin Feser – Dietmar Modes – Gunter Schmidt – Olga Liashenko – Anita Tschirwitz – Claire Wimmer – Gabriele Kunkel – Roswitha Vogtmann – Gerda Enk – Hanako Itsuhage – Ines Schwerd – Christiane Gaebert – Gabi Weinkauf – Matthias Braun – W+W Kuhfuss – Werner Winterbauer – Linde Unrein – Angelika Summa – Daniel Grimme – Udo Breitenbach

    BBK Gallery in Kulturspeicher\
    Oskar-Laredo-Platz 1, Würzburg

    Friday 3 – 6 pm, Saturday 2 – 6 pm and Sunday 11 am – 6 pm.\
    Entry with registration at the desk.\
    Current hygiene conditions apply.
