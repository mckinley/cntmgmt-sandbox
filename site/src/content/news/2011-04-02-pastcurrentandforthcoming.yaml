body:
  de: |
    Ausstellung im Atelier.

    ### pastcurrentandforthcoming

    Zu sehen gibt es aktuelle Arbeiten, die seit Oktober 2010 entstanden sind, aber auch ein paar aeltere Werke.\
    Samstag Abend, **9. April 2011**. Ab 20 Uhr Party und Ausstellung und am Sonntag Nachmittag, **10. April 2011** zwischen 14 und 18 Uhr nur Ausstellung.

    Das Atelier befindet sich auf der [9. Strasse, Hausnummer 342](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=342+9th+Street,+San+Francisco,+CA\&aq=1\&sll=37.0625,-95.677068\&sspn=38.144864,74.179688\&ie=UTF8\&hq=\&hnear=342+9th+St,+San+Francisco,+California+94103\&z=16) , zwischen Harrison Street und Folsom Street. Klingel Nummer 213.
  en: |
    Hi! I am inviting you to my show

    ### pastcurrentandforthcoming

    You will get to see what I have done since October last year, and some older work.

    So come on by Saturday night, **April 9, 2011**. From 8 pm on until whenever it will be a party and show, and/or Sunday afternoon, **April 10, 2011**, between 2 pm and 6 pm, then it will be a show only. Looking forward to seeing you there!

    All this will be in my studio on [342 9th Street](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=342+9th+Street,+San+Francisco,+CA\&aq=1\&sll=37.0625,-95.677068\&sspn=38.144864,74.179688\&ie=UTF8\&hq=\&hnear=342+9th+St,+San+Francisco,+California+94103\&z=16) between Harrison and Folsom in San Francisco. Ring the doorbell Nr. 213.
