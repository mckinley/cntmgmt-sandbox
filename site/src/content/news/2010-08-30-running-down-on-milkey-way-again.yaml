body:
  de: "### _Running down on Milkey Way – again!_\n\nHerzliche Einladung zur Wiederholung meiner Einzelausstellung\_\\\n_Running down on Milkey Way_, die von April bis Juni bereits im Galeriehaus Nord in Nürnberg zu sehen war.\n\nVom **3. bis zum 19. September** werden die Arbeiten nun noch einmal in der Galerie im Oberen Tor in Karlstadt gezeigt. Am 11./12.9. und am 18./19.9. bin ich jeweils ab 14 Uhr auch da. Mitgebracht habe ich dieses Mal zwei Fotobücher, die die Zeit in San Francisco dokumentieren als eben diese hier gezeigten Arbeiten entstanden.\n\n**Die Vernissage findet am Freitag den 3. September um 19 Uhr statt.**\n\nam Sa|So 18. und 19.9. ist die Ausstellung jeweils bis 19 Uhr geöffnet, da Karlstadt sein jährliches Stadtfest _rot & erotisch_ feiert.\n\nGalerie im Oberen Tor\\\nHauptstraße 77 ….......([Google Maps](http://maps.google.de/maps?f=q\\&source=s_q\\&hl=de\\&geocode=\\&q=Hauptstra%C3%9Fe+77,+Karlstadt\\&sll=49.838125,9.891288\\&sspn=0.061003,0.153465\\&ie=UTF8\\&hq=\\&hnear=Hauptstra%C3%9Fe+77,+Karlstadt+97753+Karlstadt,+Main-Spessart,+Bayern\\&t=h\\&z=16))\\\nKarlstadt am Main\\\nÖffnungszeiten Fr 17 – 19 Uhr. Sa|So 11 – 17 Uhr\\\nund nach telefonischer Vereinbarung unter 09353.2710\n"
  en: |
    ### _Running down on Milkey Way – again!_

    I am inviting everybody interested to come and see the re-run of my solo show _Running down on Milkey Way_. Earlier this year these thirty pieces were presented at Galeriehaus Nord in Nuremberg, Germany.

    Between **September 3 and September 19** Joachim Beßler will show the remaining drawings, paintings and sculpture in his gallery in Karlstadt, Germany. Galerie im Oberen Tor is located right at the South end of Karlstadt’s historic downtown. The three story old entrance gate was embedded into the city wall, and changed its purpose over the course of centuries from guarding to housing to hosting. On the weekend of September 11./12. I will also be there between 2 pm and 5 pm, and on September 18./19. I will be there even longer, from 2 pm to 7 pm. So come by and lets look at the show together while I will tell you about my time in San Francisco, and the californian circumstances that led to what you can see in the gallery.\
    On September 18./19. Karlstadt is hosting its annual event called _red & erotic_ which means the city will unveil all its cultural amenities – going on until late into the nights.

    **Opening reception will be on Friday September 3, 2010 at 7 pm.**

    Galerie im Oberen Tor\
    Hauptstraße 77 ……….([Google Maps](http://maps.google.de/maps?f=q\&source=s_q\&hl=de\&geocode=\&q=Hauptstra%C3%9Fe+77,+Karlstadt\&sll=49.838125,9.891288\&sspn=0.061003,0.153465\&ie=UTF8\&hq=\&hnear=Hauptstra%C3%9Fe+77,+Karlstadt+97753+Karlstadt,+Main-Spessart,+Bayern\&t=h\&z=16))\
    Karlstadt am Main, Germany\
    open Fr 5 pm – 7 pm. Sat|Sun 11 am – 5 pm\
    and by appointment +49.(0)9353.2710
