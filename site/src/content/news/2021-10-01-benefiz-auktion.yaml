body:
  de: |
    up for auction:\
    “Black Strap Molasses”, drawing, archival ink on archival paper, made in San Francisco, 2014.\
    \- SOLD -

    Auction: October 9, 2021, 6 pm Central European Time @tribalartauction

    Live worldwide bidding:\
    <https://www.tribal-art-auktion.de/de/registrierung-liveauktion/>.

    All details below:

    Das Lions-Hilfswerk Würzburg-West e.V. veranstaltet am 9. Oktober in Kooperation mit dem Kunstauktionshaus Zemanek-Münster eine Benefiz-Auktion „Wein und Kunst“. Versteigert werden erlesene und prämierte Frankenweine von namhaften Weingütern der Region. Solidarisch zeigen sich auch die Künstlerinnen und Künstler aus ganz Deutschland; sie stellen eine Auswahl ihrer Arbeiten für diesen guten Zweck zur Verfügung. Und auch Tribal Art darf natürlich nicht fehlen. Private Sammler spenden einige Werke aus ihren Sammlungen Außereuropäische Kunst.

    Der Erlös kommt zu 100 % den Projekten des Lions-Hilfswerks Würzburg-West e.V. zugute und fließt in erster Linie dem Lions Hochwasser-Fonds 2021 der Stiftung der deutschen Lions zu.

    Benefiz-Auktion\
    Samstag, 9. Oktober 2021 – 18 Uhr\
    in den Räumen des Auktionshauses - und online

    Vorbesichtigung\
    6\. bis 9. Oktober von 10 bis 17 Uhr

    Auf unserer Preview-Party am 5. Oktober ab 17 Uhr haben Sie die Gelegenheit mehr zu unserem Engagement zu erfahren und was wir bisher erreicht haben. Auf Sie wartet ein kleiner Umtrunk, und auch einige Künstler haben ihr Kommen angekündigt.\
    Bei Fragen erreichen Sie uns unter <info@tribalart.de>\
    oder telefonisch unter +49 931 17721

    Ihr Kunstauktionshaus\
    ZEMANEK-MÜNSTER\
    Hörleingasse 3-5, 97070 Würzburg
  en: |
    up for auction:\
    “Black Strap Molasses”, drawing, archival ink on archival paper, made in San Francisco, 2014.\
    – SOLD –

    Auction: October 9, 2021, 6 pm Central European Time @tribalartauction

    Live worldwide bidding:\
    <https://www.tribal-art-auktion.de/de/registrierung-liveauktion/>.

    All details below:

    Lions-Hilfswerk Würzburg-West e.V., in cooperation with the art auction house Zemanek-Münster, is organising a charity auction “Wine and Art” on October 9. Choice award-winning Franconian wines from renowned regional estates will be auctioned. Artists from across Germany are also showing solidarity, donating a selection of their works for this good cause. Tribal Art is not to be missed either. Private collectors are donating works from their collections of non-European art.

    All proceeds go 100% to the projects of Lions-Hilfswerk Würzburg-West e.V., primarily to the Lions Flood Relief Fund 2021 of the Stiftung der deutschen Lions.

    Charity Auction\
    Saturday, October 9, 2021 – 6 pm\
    at the auction house premises – and online

    Preview\
    October 6–9 from 10 am to 5 pm

    At our preview party on October 5 from 5 pm, you have the opportunity to learn more about our work and what we have achieved so far. A small reception awaits you, and several artists have announced their attendance.\
    For questions reach us at <info@tribalart.de>\
    or by phone at +49 931 17721

    Your art auction house\
    ZEMANEK-MÜNSTER\
    Hörleingasse 3–5, 97070 Würzburg
