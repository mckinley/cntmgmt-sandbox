body:
  de: |
    Zweierausstellung\
    _Malerei und Installation_ von Rosário Rebello de Andrade und Kathrin Feser

    Die Ausstellung ohne speziellen Titel beginnt morgen um 17 Uhr mit einer Vernissage. Dr. Rolf Fuchs, der Präsident der Sparkasse Mainfranken, wird die begrüßenden Wort vortragen, im Anschluß wird die Kuratorin Angelika Stitz-Watzek in die Ausstellung einführen. Unsere Arbeiten können vom **9. März bis zum 17. Mai** im Beratungs Center der Sparkasse besichtigt werden.

    Beratungs Center der Sparkasse Mainfranken, 1. Stock, Hofstraße 7, Würzburg.\
    Öffnungszeiten Mo|Di|Mi|Fr 8.30 – 16.30 Uhr, Do 8.30 – 17.30 Uhr

    **Update:** Die [Dokumentation](/media/news/2006/Sparkasse2006.pdf)\
    meines Anteils an der Ausstellung kann hier als PDF-Datei heruntergeladen werden (720 KB).
  en: |
    2 person exhibition!

    _Paintings and Installation_ by Rosario Rebello de Andrade and Kathrin Feser.

    When we both saw the space first, we knew we had to do something a bit different – having the opportunity for an exhibition in a bank, in the realm of money and serious business. It was great fun to work towards this challenge. The exhibition, without any particular title, will start with its opening reception, tomorrow at 5 pm. There will be welcoming words by the banks president Dr. Rolf Fuchs, followed by an introduction by the curator of the bank’s gallery Angelika Stitz-Watzek. The show will be open to the public **between March 9 and May 17**. There is free parking in the building’s subterranean garage.

    Beratungs Center der Sparkasse Mainfranken. 2nd floor, Hofstraße 7, Würzburg.\
    open Mon|Tue|Wed|Fri. 8.30 am – 4.30 pm, Thur 8.30 am – 5.30 pm.

    **Update:** You can download the complete [documentation](/media/news/2006/Sparkasse2006.pdf)\
    of my part of the show in PDF format (720 KB).
