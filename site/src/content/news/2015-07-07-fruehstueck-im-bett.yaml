body:
  de: |
    **Küche, Kochen** und\
    **Kunst**..........._“Frühstück im Bett”_\
    Ausstellung einiger meiner Arbeiten.

    Einladung zum **open house**\
    Samstag 11. Juli | Sonntag 12. Juli 2015\
    jeweils ab 14 Uhr

    Es gibt auch Kaffee und Kuchen und Holzofenpizza.

    Küchenwerkstatt\
    Am Rathaus 2\
    97228 Rottendorf
  en: |
    **KITCHEN, COOKING** and\
    **ART**……….._“Breakfast in Bed”_\
    An exhibition of some of my art work.

    Invite to the **open house** of newly opened _Küchenwerkstatt_.\
    Saturday July 11 | Sunday July 12, 2015\
    starts at 2 pm both days

    There’ll be coffee and cake and wood-fired oven pizza.

    Küchenwerkstatt\
    Am Rathaus 2\
    97228 Rottendorf
