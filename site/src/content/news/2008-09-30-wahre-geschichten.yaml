title:
  de: wahre Geschichten
  en: true stories
date: "2008-09-30"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/wahreGeschichten.jpg
    title: eine Schnur
body:
  de: |
    Von der einen Schnur, der einen Linie und den vielgeschichteten Papier-Cut-outs. In dieser Ausstellung zeige ich einen Querschnitt der letzten 3 Jahre. Es handelt sich dabei stets um Arbeiten mit einem direkten Textbezug. Arbeiten, die gesammelte Satzfetzen, Worte oder auch nur Laute, direkt, oder auf Umwegen, ins Bildliche übersetzt darstellen, umdeuten oder verfremden.\
    Ich empfehle die Ausstellung mit der Preisliste in Händen zu besuchen, da darauf zusätzliche Textfragmente die einzelnen Arbeiten umschreiben.

    Die Einzelausstellung hat den Titel _wahre Geschichten_ und eröffnet als erste die neu gestaltete Galerie im Königspavillon. Die Galerie befindet sich im linken Flügel des ehemaligen Bahnhofs von Veitshöchheim. Die Ausstellung ist vom **1. bis zum 25. Oktober** zu besuchen. Zur Vernissage am 1. Oktober um 18 Uhr lade ich alle sehr herzlich ein.

    Galerie im Königspavillon\
    Bücherei im Bahnhof Veitshöchheim\
    Öffnungszeiten Di|Mi|Fr 10 – 12 Uhr und 14 – 18 Uhr, Do 10 – 12 Uhr und 14 – 20 Uhr, Sa 10 – 13 Uhr
  en: |
    It is all about the singular string, the one line, and the multi-layered paper cut outs.\
    In this exhibition I will be showing pieces that were made throughout the past 3 years. Work directly linked to certain phrases and sentences. Drawings, paintings or collages are portraying, translating, conducting or detouring collected word-chains, snippets or sounds. It is advisable to visit the show with a price list in your hans, as there will be additional text coming and going with each piece.

    This solo show carries the title _true stories_, and is the first exhibition in the newly restored gallery in the king’s pavilion. You will find it in the left wing of Veitshöchheim’s former train station. The exhibition starts with an **opening reception on October 1st at 6 pm**, and continues until Saturday, **October 25**. Please come by and visit.

    Galerie im Königspavillon (gallery in the king’s pavilion)\
    Bücherei im Bahnhof Veitshöchheim\
    open Tue|Wed|Fr 10 am – 12 pm and 2 – 6 pm, Thur 10 am – 12 pm and 2 – 8 pm, Sat 10 am – 1 pm
