title:
  de: Moderne im Schloß in Münnerstadt
  en: Castle in Münnerstadt
date: "2007-06-22"
lang: de
translation: reviewed
images:
  - src: /media/news/2007/M_nnerstadt.jpg
    title: "*sie*. *er*. cut-out"
body:
  de: |
    Das Henneberg-Museum, im Deutschordensschloß in Münnerstadt präsentiert vom **28. Juni bis zum 12. August 2007** Zeichnung, Malerei und Skulptur von Herbert Janouschkowetz, [Angelika Summa](http://www.angelika-summa.de/ger/home.html), [Norbert Kleinlein](http://www.galerie-josephski-neukum.de/kleinlein.htm), Heinz Altscheffel, [Peter Stein](http://www.peterstein.info/galerie.html), Kathrin Feser und [Julian Walter](http://www.julianwalter.de/freie_arbeiten.html). Die Ausstellung in den besonderen Räumlichkeiten trägt den Titel _Moderne im Schloß_.\
    Am **13. Juli** um 20 Uhr wird, anläßlich dieser Ausstellung, Gail Gilmore ein Open Air Konzert im Innenhof des Schloßes geben!

    Henneberg-Museum im Deutschordensschloß, Münnerstadt\
    Di|Mi|Do|Fr 14 – 17 Uhr, Sa|So|Feiertage 10 – 17 Uhr.\
    **Der Eintritt ist frei!**
  en: |
    The Henneberg-Museum, in the Deutschordensschloß Castle in Münnerstadt, Germany, presents drawings, paintings and sculptures by Herbert Janouschkowetz, [Angelika Summa](http://www.angelika-summa.de/eng/gal_1.html), [Norbert Kleinlein](http://www.galerie-josephski-neukum.de/kleinlein.htm), Heinz Altscheffel, [Peter Stein](http://www.peterstein.info/galerie.html), Kathrin Feser und [Julian Walter](http://www.julianwalter.de/freie_arbeiten.html). The exhibition in this special location is titled _Moderne im Schloß \[modernity in the castle]_, and it will run **June 28 through August 12**.\
    On **July 13** at 8 pm there will be an open air concert by Gail Gilmore in the castle’s inner courtyard.

    Henneberg-Museum im Deutschordensschloß, Münnerstadt\
    open Tue|Wed|Thur|Fri 2 – 5 pm, Sat|Sun|holidays 10 am – 5 pm\
    **no entry fee!**
