title:
  de: Einzelausstellung in San Francisco
  en: single-show in San Francisco
date: "2006-08-27"
lang: de
translation: reviewed
images:
  - src: /media/news/2006/elsewhere-f.jpg
body:
  de: |
    _elsewhere – anderswo_ ist der Titel meiner Einzelausstellung in der Galerie Tinhorn Public Works in San Francisco, Kalifornien. Die Ausstellung beginnt am **7. September** mit einer Vernissage von **17.30 bis 20.30 Uhr**. Eine Vielzahl der Arbeiten sind erst in den letzten Monaten vor dieser Ausstellung entsanden. Die Mafia-Boxen werden erstmals öffentlich gezeigt, ebenso wie einige Arbeiten in Acryl auf Papierschichten mit cut-out. Die Galerie präsentiert die Arbeiten unter der Leitung von Terry Chastain bis einschließlich **29. Oktober**. Nachdem ich 4 Jahre in San Francisco gelebt hatte bin ich nun besonders froh für eine Schau aktueller Arbeiten dorthin zurückzukehren.

    _Die Galerie auf der [511 Laguna Street](http://maps.google.com/maps?f=q\&hl=en\&geocode=\&time=\&date=\&ttype=\&q=+511+Laguna+Street+San+Francisco\&sll=37.775718,-122.422596\&sspn=0.006632,0.013722\&ie=UTF8\&ll=37.775862,-122.426158\&spn=0.006632,0.013722\&t=h\&z=17\&iwloc=addr\&om=1) liegt im biografisch legendären und bedeutsamen Hayes Valley, zwischen Fell Street und Linden Street._

    Tinhorn Public Works, 511 Laguna Street, San Francisco, CA\
    Öffnungszeiten Mi|Do|Fr|Sa|So 11.30 – 18.30 Uhr
  en: |
    _elsewhere – anderswo_ is the title of my solo show at the Tinhorn Public Works gallery in San Francisco, CA. The show will begin on **September 7** with an **opening reception between 5.30 pm and 8.30 pm**. New Mafia-Boxes will be shown for the first time in public, as will some paintings in acrylic on layered paper with cut-outs. The show ends on **October 29**. I am very happy to return to the city where I lived in for 4 years in order to show my very recent work.

    Tinhorn Public Works, 511 Laguna Street, San Francisco, CA, 415.621.1292\
    open Wed|Thur|Fri|Sat|Sun 11.30 am – 6.30 pm

    _The gallery on [511 Laguna Street](http://maps.google.com/maps?f=q\&hl=en\&geocode=\&time=\&date=\&ttype=\&q=+511+Laguna+Street+San+Francisco\&sll=37.775718,-122.422596\&sspn=0.006632,0.013722\&ie=UTF8\&ll=37.775862,-122.426158\&spn=0.006632,0.013722\&t=h\&z=17\&iwloc=addr\&om=1) is located in the biographically legendary and impactive Hayes Valley, between Fell Street and Linden Street._
