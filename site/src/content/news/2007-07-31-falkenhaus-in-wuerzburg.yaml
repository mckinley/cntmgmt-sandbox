body:
  de: |
    _Das Alphabet der Pirateninseln | O Alphabet das Ilhas Piratas | i l’alfabet de les Medes Pirates_ ist der Titel einer Zweierausstellung von [Rosário Rebello de Andrade](http://www.rebello.eu) und mir. Die Arbeiten, größtenteils Malerei, befinden sich in den beiden Räumen des Lesecafés der Städtischen Bibliothek im Falkenhaus Würzburg. Das Hauptstück der Ausstellung bildet eine über 9 Meter lange Wandinstallation bestehend aus 72 Einzelbildern. Textelemente, gefunden in diversen Quellen in Deutsch, Portugiesisch und Katalanisch, kombinierten wir mit losgelösten Ornamenten der Rokokofassade des Falkenhauses und den jeweils uns eigenen Bildsprachen. _„ …und alles war neu im Dickicht der Sterne.”_ Sämtliche Arbeiten werden ab dem **1. August** zu besichtigen und zu begutachten sein.

    Eine offizielle Vernissage wird es nicht geben, statt dessen aber feierliche Worte von Frau Dr. Hannelore Vogt, katalanischen Wein und ein Konzert der katalanischen Sängerin Mariona Segarra mit Band. Jener Abend ist für Freitag, den **5. Oktober 19 Uhr** geplant. Bitte die Einladungskarte als Einlaßberechtigung mitbringen. Unterstützt wird unsere Ausstellung, die am **31. Oktober** enden wird, vom Goethe Institut Barcelona, von der Bibliothek Katalonien, von der Deutsch-Iberischen Gesellschaft und dem Ausländerbeirat.

    Haus zum Falken – Städtische Bibliothek, Marktplatz 9, Würzburg\
    Mo|Di|Fr 10 – 18 Uhr, Do 10 – 19 Uhr, Sa 10 – 15 Uhr

    _Das gelbe Falkenhaus mit seinen weißen Stuckornamenten findet sich am Oberen Marktplatz: das Haus war von 1338 – 1406 das Wohnhaus des Dompfarrers. Seit dem 17. Jahrhundert war es als “Haus zum Falken” bekannt und wurde als Gasthaus genutzt. Zu Werbezwecken wurde 1751 die Stuck-Rokokofassade angebracht._
  en: |
    _Das Alphabet der Pirateninseln | O Alphabet das Ilhas Piratas | i l’alfabet de les Medes Pirates_ is how [Rosario Rebello de Andrade](http://www.rebello.eu) and I call our two person exhibition in the rooms of the reading café at the civic library at Falkenhaus in Würzburg. A 9 meter-long wall installation consisting of 72 paintings done by either Rosário or me or collaboratively is forming the exhibition’s center piece. Segments of found text in German, Portuguese and Catalan literature are combined with some of the rococo ornaments (the Falkenhaus facade) freed from their original context and both our individual visual languages. _„…and in the thicket of the stars everything was new.”_ All pieces will be up starting **August 1**.

    There won’t be an official opening reception. Instead, there will be celebratory words by Dr. Hannelore Vogt, Catalan wine, and a concert by the Catalan singer Mariona Segarra with Band. That event will take place on **October 5 at 7 pm** at the Falkenhaus. In order to have free access you are asked to bring your invitation card with you. Patronage for our show, that will end on **October 31**, is provided by the Goethe Institut Barcelona, the Libreria Catalonia, and the German-Iberic Society and the Foreigners’ Council.

    Haus zum Falken \[The Falcon’s House],\
    the Cities Main Library, Marktplatz 9, Würzburg\
    Mon|Tue|Wed|Fri 10 am – 4 pm, Thur 10 am – 7 pm, Sat 10 am – 3 pm

    _On Würzburg’s Upper Market sits the yellow Falkenhaus with its white stucco ornaments. Between 1338 and 1406 the Dome’s priest used to live in the building. Later, in the 17th Century, the house hosted a restaurant. It was known as “The Falcon’s House”. The facade was part of an advertisement for the restaurant, attached in 1751._
