body:
  de: |
    **SLAM PAPER BANG**

    **Gezeigt werden Arbeiten von\
    Roswitha Berger-Gentsch und Kathrin Feser**

    Kaum sind die Silvesterböller verraucht, schon kommt der nächste Knaller – unverkrampft, spritzig, explosiv\
    Im Gleitflug hauchdünn übers Papier schweben\
    Abfallkartons retten, Verknüpfungen herstellen und Staunen zulassen. Federleichte Verbindungen eingehen, Amphoren auf Sockel heben.

    **Ausstellungszeitraum 18.01.2019 – 17.03.2019**\
    Vernissage ist am Freitag, 18.01.2019 um 19 Uhr\
    Begrüßung, Dominik Hofstätter\
    Einführung, Hartmut Stahl

    Erste Künstlerführung am Sonntag, 3.02.2019 um 15 Uhr\
    Zweite Künstlerführung am Sonntag, 03.03.2019 um 15 Uhr

    Finissage ist dann am Sonntag, 17.03.2019 um 15 Uhr

    [Galerie HOP](http://www.galerie-bamberg.de)\
    Dominik Hofstätter\
    & Klaus Oppelt\
    [Siechenstraße 35, 96052 Bamberg](https://goo.gl/maps/DvPB7DCZTiz)

    Öffnungszeiten: Di – Fr 16 – 20 Uhr\
    zu den Veranstaltungen Sa und So\
    sowie nach Vereinbarung Telefon 0951 / 96 86 92 60 und 0151 / 25 76 50 44
  en: |
    **Works on show by\
    Roswitha Berger-Gentsch and Kathrin Feser**

    Barely has the New Year’s fireworks faded when the next bang arrives – unrestrained, lively, explosive.\
    Gliding weightlessly across paper.\
    Rescuing cardboard scraps, making connections, allowing wonder. Making feather-light bonds, lifting amphorae onto pedestals.

    **January 18 – March 17, 2019**\
    Opening reception: Friday, January 18, 2019 at 7 pm\
    Welcome by Dominik Hofstätter\
    Introduction by Hartmut Stahl

    First artist tour: Sunday, February 3, 2019 at 3 pm\
    Second artist tour: Sunday, March 3, 2019 at 3 pm

    Finissage: Sunday, March 17, 2019 at 3 pm

    [Galerie HOP](http://www.galerie-bamberg.de)\
    Dominik Hofstätter\
    & Klaus Oppelt\
    [Siechenstraße 35, 96052 Bamberg](https://goo.gl/maps/DvPB7DCZTiz)

    open Tue – Fri 4 – 8 pm\
