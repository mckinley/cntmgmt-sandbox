  de: |
    BBK-Sommerausstellung: „Tierisch gut“

    **27.06. bis 19.07.2020**

    Die Vernissage entfällt.\
    Stattdessen gibt es einen kleinen Film von Katrin Heyer über einige der ausgestellten Werke auf:\
    bbk-unterfranken.de zu sehen sein.

    Der Eintritt ist frei

    Ort: BBK-Galerie im Kulturspeicher\
    Oskar-Laredo-Platz 1\
    97080 Würzburg\
    Fr / Sa 15-18 Uhr, So 11-18 Uhr
  en: |
    BBK summer exhibition: “Tierisch gut”

    **June 27 – July 19, 2020**

    There will be no opening reception.\
    Instead, a short film by Katrin Heyer about some of the exhibited works can be seen at:\
    bbk-unterfranken.de

    Admission free.

    Venue: BBK Gallery in Kulturspeicher\
    Oskar-Laredo-Platz 1\
    97080 Würzburg\
    Fri / Sat 3–6 pm, Sun 11 am–6 pm
