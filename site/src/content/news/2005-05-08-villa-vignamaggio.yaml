body:
  de: |
    _a piedi scalzi \[barfuß]_\
    Eine 2-Personen-Ausstellung von Joachim Hofmann und Kathrin Feser mit Skulpturen und Bildern ausserhalb und innerhalb des Anwesens.

    **21. Mai bis 31. Oktober 2005**\
    [Villa Vignamaggio](http://www.vignamaggio.com) in der Toskana.

    Villa Vignamaggio, Via Petriolo 5, 50022 Greve in Chianti (FI) Italia

    _Die Villa Vignamaggio ist von einem beeindruckenden italienischen Garten umgeben, der Duft der Blumen und Pflanzen ist betörend. Das Anwesen befindet sich in einer wunderschönen Ecke des Chianti-Gebietes zwischen Florenz und Siena, mit Blick auf die typisch toskanischen Hügel. Es ist ein authentisches Zeugnis des Landlebens in der Toskana zur Zeit der Renaissance. Das Hauptgebäude der Villa geht zurück auf das 14. Jahrhundert. Mona Lisa wurde hier im Jahre 1479 geboren._
  en: |
    2 person show _a piedi scalzi \[barefoot]_\
    Joachim Hofmann and Kathrin Feser – sculptures and paintings inside and outside of the estate.

    **5/21 till 10/31/2005**\
    [Villa Vignamaggio](http://www.vignamaggio.com) in Tuscany, Italy.

    Villa Vignamaggio, Via Petriolo 5, 50022 Greve in Chianti (FI) Italia

    _Villa Vignamaggio is surrounded by an impressive italian garden, the perfume of flowers and trees is amazing and hallucinating. The estate is situated in a very picturesque corner of the Chianti area, between Florence and Siena, overlooking the typic tuscan hills. It is witness to the Tuscan country life during Renaissance. The main building of the Villa dates back to the 14th Century. The famous Mona Lisa was born here in 1479._
