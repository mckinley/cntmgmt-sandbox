title:
  de: 3 Ausstellungen an einem Wochenende
  en: 3 exhibitions on one weekend
date: "2008-04-27"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/MozartArtbreit.jpg
body:
  de: |
    Am kommenden Wochenende gibt es gleich 3 Möglichkeiten meine Arbeiten zu besichtigen. Persönlich treffen können wir uns am Samstag im Mozartcenter in Würzburg und am Sonntag sowohl im Mozartcenter als auch im Schlosskeller in Marktbreit.

    ### Mozartcenter

    Schweinfurter Straße 2 in Würzburg\
    Eine Gruppenausstellung in den gigantischen Räumen von Bader Wohnbau mit Michaela Stremlau, Jürgen Geisel, Veit Heller, Joachim Hofmann\
    **Samstag 3. Mai 14 – 20 Uhr** und **Sonntag 4. Mai 11 – 18 Uhr**\
    Anfahrt über den Berliner Ring, Ausfahrt Martin-Luther-Straße, gleich links in die Schürerstraße und wieder links zu den Parkplätzen und Eingang zur Ausstellung. Das Mozartcenter ist ein einhundert Jahre altes Gebäude mit 2 runden Erkern und liegt links vor dem Beethovencenter!

    ### Artbreit

    Die Artbreit ist ein großes Kunstfest das im zweijährigen Rhythmus in der gesamten Altstadt von Marktbreit stattfindet. Circa 60 Künstler stellen in leerstehenden Häusern, Gewölbekellern, historischen Gebäuden oder ungenutzten Läden aus. Vielfältigste Bands und Kulinarisches ergänzen den Rundgang durch die Gebäude und Gassen. Auch die [Arte Noah](http://www.kunstverein-wuerzburg.de/content/index/) wird mit einer sehr interessanten Ausstellung von [Michael Nitsches](http://www.nitsche-michael.de/) Plastiken am Ufer vor dem Lagerhaus anlegen.\
    Eine ausführliche Beschreibung aller Aussteller, Bands und Veranstaltungen gibt es auch [online](http://www.artbreit.de/).

    **Am Schlossplatz im Schlosskeller** gibt es dann die Arbeiten von Dieter Stein, Peter Krenek, Peter Stein und mir zu sehen.\
    **Samstag 3. Mai 16 – 20 Uhr** und **Sonntag 4. Mai 11 – 20 Uhr**\
    Gratis Parkplätze gibt es in großer Zahl am Mainufer.

    ### Markt Einersheim

    Die Ausstellung, die im Rahmen der [_Kulturstationen 2008_](/news/2008-04-14-kulturstationen-2008/) begann, kann noch am **Sonntag 4. Mai zwischen 11 und 16 Uhr** besucht werden. Am Montag werde ich dann alles abbauen und auch die entsprechenden Bildausschnitte aus den zwei riesigen Zeichnungen schneiden.
  en: |
    Next weekend there will be three exhibitions with my work in them. I will be there in person on Saturday at the Mozartcenter in Würzburg, and on Sunday at the Mozartcenter as well as down in th cellar of Marktbreit’s mansion.

    ### Mozartcenter

    This will be a group show in the gigantic rooms of Bader Wohnbau with Michaela Stremlau, Jürgen Geisel, Veit Heller and Joachim Hofmann.\
    **Saturday May 3 between 2 pm and 8 pm** and **Sunday May 4 between 11 am and 6 pm**\
    Directions to Mozartcenter on Schweinfurter Straße 2 in Würzburg: enter the Berliner Ring, exit Martin-Luther-Straße, immediately turn left on Schürerstraße, and turn left again into the parking lot, enter the exhibition from the back side. The Mozartcenter is a one hundred year old building that consist of two round bays and is located left of Beethovencenter!

    ### Artbreit

    Artbreit is a biannual art festival taking place all over the historic downtown of Marktbreit. There will be more or less sixty artists presenting their work in vacant houses, cellars, historic buildings and empty stores. Taking a tour through the streets and alleys of this picturesque city, you will also find a versatile array of live music and lots of good food. The [Arte Noah](http://www.kunstverein-wuerzburg.de/content/index/) will berth on the shore by the warehouse and host the must-see show of [Michael Nitsches](http://www.nitsche-michael.de/) sculptures. Although the [online](http://www.artbreit.de/) program for this weekend is only in German, it is still worth looking at.

    At **Schlossplatz** in the mansion’s cellar, there will be works by Dieter Stein, Peter Krenek, Peter Stein and me.\
    **Saturday May 3 between 4 pm and 8 pm** and **Sunday May 4 between 11 am and 8 pm**\
    Plenty of free parking can be found down by the Main river, next to the warehouse and Arte Noah.

    ### Markt Einersheim

    The exhibition that started with the [_Kulturstationen 2008_](/en/news/2008-04-14-kulturstationen-2008/) will be open on Sunday May 4 between 11 am and 4 pm. It will be its last day. On Monday I will then take down the show, and cut the two big drawings into their sections.
