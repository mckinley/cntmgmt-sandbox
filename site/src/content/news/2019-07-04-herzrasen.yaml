body:
  de: |
    Einladung zur BBK-Sommerausstellung\
    **Herzrasen**...Kunststücke, die das Herz zum Rasen bringen.\
    6\. Juli – 28.7.2019\
    in der BBK-Galerie in Würzburg

    Vernissage am 5.7. um 19 Uhr\
    Musik: Stephanie Carr-Lemmerich, Vibraphon

    21\. JULI: AB 17.30 UHR: HAFENTOUR\
    „Glücklich sein am Alten Hafen“\
    deshalb ist an diesem Tag die Ausstellung bis 20:30 geöffnet.\
    Musik: The Art of Duo

    BBK Galerie im Kulturspeicher\
    Oakar-Laredo-Platz 1, 97080 Würzburg\
    Telefon 0931.50612\
    [www.bbk-unterfranken.de](http://www.bbk-unterfranken.de)

    Öffnungszeiten: Fr+Sa 15 – 18 Uhr | So 11 – 18 Uhr
  en: |
    Opening reception July 5 at 7 pm\
    Music: Stephanie Carr-Lemmerich, vibraphone

    **July 21: from 5:30 pm: HARBOUR TOUR**\
    “Happy at the Old Harbour”\
    on this day the exhibition is open until 8:30 pm.\
    Music: The Art of Duo

    BBK Gallery in Kulturspeicher\
    Oskar-Laredo-Platz 1, 97080 Würzburg\
    Tel. 0931.50612\
    [www.bbk-unterfranken.de](http://www.bbk-unterfranken.de)

    open Fri+Sat 3 – 6 pm | Sun 11 am – 6 pm
