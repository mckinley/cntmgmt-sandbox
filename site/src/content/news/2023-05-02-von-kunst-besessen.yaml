body:
  de: |
    **Ausstellung**\
    **ab 9. Mai 2023**

    Im Kaisersaal waren sie viele Jahre treue Begleiter großer Konzerte. Sie umfängt die Aura einmaliger Musikerlebnisse. In der Saison 2008 hatten die massiven Holzklappstühle ihren letzten Auftritt.

    Vierzig Exemplare wurden 2022 im Rahmen der ersten Art Edition selbst zum Kunstobjekt.

    Im Mai 2023 geht das von Eydos kuratierte Projekt **»Von Kunst besessen«** nun in die zweite Runde.

    Neben Exponaten von Dierk Berthel, Max Gehlofen, Maria Boldt, Hans Krakau, Robert Weissenbacher, Rebekka Bärthele, Marina Breitschaft, Tanja Riebel, Christoph Weiss und der ATE-Crew\
    sind nun auch die 2023 entstandenen Kunstwerke von Kathrin Feser und Matthias Braun im lichtdurchfluteten BeratungsCenter der Sparkasse ausgestellt.

    Bei Interesse an den Werken finden Sie unter\
    <https://vonkunstbesessen.de/> den Gesamtkatalog.

    Das Mozartfest Würzburg sowie seine Partner Eydos und die Sparkasse Mainfranken laden Sie dazu ein.

    Sparkasse Mainfranken\
    Hofstraße 7–9, 97070 Würzburg\
    Mo – Fr 9 – 17 Uhr
  en: |
    **Exhibition**\
    **from May 9, 2023**

    For many years they were faithful companions at great concerts in the Kaisersaal. They hold the aura of unique musical experiences. In the 2008 season, the heavy wooden folding chairs made their last appearance.

    Forty copies became art objects in themselves in 2022 as part of the first Art Edition.

    In May 2023, the Eydos-curated project **“Von Kunst besessen”** enters its second round.

    Alongside works by Dierk Berthel, Max Gehlofen, Maria Boldt, Hans Krakau, Robert Weissenbacher, Rebekka Bärthele, Marina Breitschaft, Tanja Riebel, Christoph Weiss and the ATE crew,\
    the 2023 works by Kathrin Feser and Matthias Braun are now also on display in the light-filled advisory centre of the Sparkasse.

    For interest in the works, the full catalogue can be found at:\
    <https://vonkunstbesessen.de/>

    The Mozartfest Würzburg and its partners Eydos and Sparkasse Mainfranken invite you.

    Sparkasse Mainfranken\
    Hofstraße 7–9, 97070 Würzburg\
    Mon – Fri 9 am – 5 pm
