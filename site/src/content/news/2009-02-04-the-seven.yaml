body:
  de: |
    ### _Sieben Visuelle Künstler, sieben Mode Designer und sieben Kochkünstler interpretieren je eine der sieben Todsünden_

    Für diejenigen, die sich an die ein oder andere Todsünde vielleicht nicht mehr so richtig erinnern können, seien sie hier noch einmal genannt:\
    _superbia_, der Hochmut. _avaritia_, der Geiz. _luxuria_, die Wollust. _ira_, der Zorn. _gula_, die Völlerei. _invidia_, der Neid. _acedia_, die Trägheit.

    Zu dieser Veranstaltung, die am **Freitag den 6. Februar um 21 Uhr** beginnt möchte ich alle diejenigen, die sich an diesem Abend und in dieser Nacht auf dem Nordamerikanischen Kontinent befinden sehr herzlich einladen.\
    Die **space gallery** liegt in einem der zahlreichen Zentren von San Francisco und präsentiert die von Angela Dix und Amelia Lewis kuratierte Ausstellung. Bis 2 Uhr morgens werden ausserdem\
    die beiden DJs Kwacker und Loren Steele auflegen, sämtliche Sünden werden in Form eßbarer Häppchen angeboten werden.

    Mein Beitrag handelt vom Geiz und der Habgier. Entstanden ist ein 120×150 cm großes Bild bestehend aus manuel geprägter, dickerer Metallfolie und Papier cut-outs. Ein kleiner Ausschnitt ist hier oben zu sehen.

    Eintritt 7 $

    space gallery\
    1141 Polk Street, Kreuzung Sutter Street\
    San Francisco\
    geöffnet Fr 21 – Sa 2 Uhr
  en: |
    ### _Seven Visual Artist to quench your imaginative anticipation, seven Culinary Artist to satisfy your salivating curiosity and seven Fashion Designers to inspire new ways of dressing or undressing the human figure_.

    Each artist will Interpret the Seven Deadly Sins. Which are, in case you do not remember all seven of them:\
    _superbia_, pride. _avaritia_, greed. _luxuria_, lust. _ira_, wrath. _gula_, gluttony. _invidia_, envy. _acedia_, sloth.

    I would like to invite everybody to this event that will begin this coming **Friday, February 6 at 9 pm**. The **space gallery**, located in one of the many hearts of San Francisco, is presenting a group show curated by Angela Dix and Amelia Lewis. Music by DJ Kwacker and Loren Steele, as well as plenty of edible samples of all sins and a full bar will be provided until 2 am next morning.

    Please try and make it out! ……..I wish I could!

    My contribution is on greed, a 4′ by 5′ piece made from heavy aluminum foil and paper by combining the two techniques of both manual embossing and cut-out. Above you can see the photo of a small detail.

    entry 7 $

    space gallery\
    1141 Polk Street at Sutter Street\
    San Francisco\
    open Fr 9 pm – Sat 2 am
