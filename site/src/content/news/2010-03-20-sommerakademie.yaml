body:
  de: |
    Eine Gruppe von Künstlern und Kunstschaffenden hat die [Sommerakademie Homburg](http://www.sommerakademiehomburg.de/) gegründet und bietet für Kunstinteressierte ein interessantes und vielfältiges Kursangebot in unterschiedlichen Bereichen an:\
    _Papierkunst – Musik – Gesang – Druckkunst – Zeichnen – Malerei_

    Die inspirierende Umgebung von Schloss Homburg und der Papiermühle bietet ein geeignetes Ambiente und soll Grundlage für einen inspirierenden Austausch und kreative Arbeit sein.

    **Saamstag 28. August 2010 bis Sonntag 5. September 2010**

    **K 1.2 Experimentelles Zeichnen**\
    Kursbeschreibung: **… eine neue Art zu Sehen und dies in eine gestärkte, selbstsichere Linie übersetzend.**

    Der Kurs ist so strukturiert, dass wir mittels vieler Übungen und Experimente den Blick schärfen und die Grenzen des Zeichnens erweitern werden. Jeder wird sein eigenes Potential und den individuellen Ausdruck neu definieren. Hierfür verwenden wir unkonventionelle Techniken und beziehen uns auf zeitgenössische Zeichenpraktiken.

    Material und Werkzeug bringt jeder Teilnehmer mit – eine entsprechende Liste erhalten Sie nach Ihrer Anmeldung.

    Teilnahmevoraussetzungen: Vorkenntnisse sind nicht erforderlich – außer einem gewissen Wagemut und Neugierde!

    Teilnehmer: max. 10 Personen\
    Ort: Papierscheune der Papiermühle Homburg\
    Kursleiterin: Kathrin Feser
  en: |
    A group of artists freshly founded the [Sommerakademie Homburg](http://www.sommerakademiehomburg.de/) . We offer a variety of interesting classes in the fields of:\
    _paper art – music – singing – print art – drawing – painting_

    Homburg’s Castle and the Paper Mill offer a perfectly suiting ambiance for a week long inspiring exchange of ideas and creative work.

    **Saturday August 28, 2010 until Sunday September 5, 2010**

    **K 1.2 Experimental Drawing**\
    Class description: **… developing a new way of seeing, and translating this into a consciously strengthened line.**

    In this class we will sharpen our way of perception and push the boundaries of drawing through extensive exercising and experimenting. During this week long workshop each student will redefine one’s own potentials and individual expressions. In order to get there we will use rather unusual methods while relating towards contemporary ways of drawing.

    You will receive a list of materials and tools after having signed up for this class.

    Prerequisite: previous knowledge in drawing is not required – except an adventurous and daring spirit and a good portion of curiosity!

    Number of participants: max. 10 people\
    Location: The Paper Barn at the Paper Mill in Homburg\
    Instructor: Kathrin Feser
