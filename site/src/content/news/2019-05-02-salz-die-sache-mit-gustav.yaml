body:
  de: |
    Eine Einzelausstellung in den WeinKulturGaden Thüngersheim,\
    vom 11. Mai bis zum 14. Juli 2019:\
    **Salz – die Sache mit Gustav**

    Herzliche Einladung an alle Interessierten zur Eröffnung am 11. Mai um 19 Uhr!\
    mit Piano Musik von Karsten Stracke.

    Gezeigt wird erstmals eine neu entstandene Mischung meiner unterschiedlichen Zeichenstile und thematischen Zeichenansätze. Die Zeichnungen erzählen vom Bewußten und Unbewußten, von Fiktionen und Kuriosem. Das Geplante und das Zufällige, das Magische und die Realität werden zum bildnerischen Thema.

    _Veränderung ist das Salz des Vergnügens._ (Friedrich Schiller)

    Der Eintritt ist frei.

    [WeinKulturGaden Thüngersheim](https://weinkulturgaden.de/)\
    Kirchgasse 2, 97291 Thüngersheim

    Öffnungszeiten\
    Sa + So 10 – 18 Uhr, sowie nach Vereinbarung\
    E-Mail: <info@weinkulturgaden.de>\
    Telefon: +49 170 41 98 447
  en: |
    A warm invitation to all who are interested to attend the opening on **May 11 at 7 pm**!\
    With piano music by Karsten Stracke.

    On show for the first time: a newly created mix of my different drawing styles and thematic approaches. The drawings speak of the conscious and unconscious, of fictions and curiosities. The planned and the accidental, the magical and the real become subjects for the image.

    _Change is the salt of pleasure._ (Friedrich Schiller)

    Admission free.

    [WeinKulturGaden Thüngersheim](https://weinkulturgaden.de/)\
    Kirchgasse 2, 97291 Thüngersheim

    open Sat + Sun 10 am – 6 pm, and by arrangement\
    <info@weinkulturgaden.de>\
    tel. +49 170 41 98 447
