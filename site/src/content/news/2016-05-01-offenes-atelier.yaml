body:
  de: |
    Einladung zum **Offenen Atelier\
    am 7. und 8. Mai 2016\
    jeweils zwischen 14 und 19 Uhr**\
    Lodenstraße 9 in Veitshöchheim.

    Über Euer Kommen würde ich mich sehr freuen.

    p.s.: zusätzlich möchte ich Euch auch nur zur Finissage der Ausstellung _STOPGUCKER KRAFTRAUM_ in den Fluren der vhs (Kristin Finsterbusch, Roswitha Vogtmann, Kathrin Feser)\
    am Freitag den 13. Mai um 19:30 Uhr in der Münzstraße 1 in Würzburg einladen.\
    Musik von Jörg Meister!
  en: |
    Invitation to my \*Open Studio\
    on Sat, May 7 and Sun, May 8, 2016\
    both days between 2 pm and 7 pm\*\
    Lodenstraße 9 in Veitshöchheim.

    I am looking forward to seeing you.

    p.s.: I want to use this opportunity to also invite you to the FINISSAGE of the exhibition _STOPGUCKER KRAFTRAUM_ on all 3 floors of the vhs (Kristin Finsterbusch, Roswitha Vogtmann, Kathrin Feser), Münzstrasse 1 in Würzburg.\
    On Friday May 13 at 7.30 pm.\
    Music by Jörg Meister
