body:
  de: "**WUNDERLAND\\\n18\\. April – 12. Mai 2013**\\\nGruppenausstellung mit Arbeiten von Paraschiva Boiu. Sophie Brandes. Kathrin Feser. Ivonne Fernándes y González. Kristin Finsterbusch. Christiane Gaebert. Dorette Jansen. Vera Kattler. Brian Fitzgibbon. Edwin Kaiser. Hermann Oberhofer. Martin Rupprecht. Wolfgang Wieland.\n\nAusstellung anlässlich der Uraufführung von _Wunderland_, Songzyklus nach Lewis Carroll, von Anno Schreier (Musik) und Alexander Jansen (Text) im Mainfranken Theater Würzburg, Kammerspiele, ab 18. April 2013. Premiere ist im Anschluss an die Vernissage.\n\nZur Ausstellung erscheint eine [Grafikmappe](http://www.bbk-unterfranken.de/jahresgaben.213.0.0.0.0.html) mit 14 Originalgrafiken, davon einige Unikate der ausstellenden Künstler. Sie ist im Künstlerhaus (Mi | Do 9 – 18 Uhr) für 190 Euro zu erwerben.\n\n**Vernissage am 18. April um 18 Uhr**\n\n[BBK-Unterfranken e.V.\\\nWerkstattgalerie im Kulturspeicher\\\nOskar-Laredo-Platz 1](http://maps.google.de/maps?q=Oskar-Laredo-Platz+1,+W%C3%BCrzburg\\&hl=en\\&ie=UTF8\\&sll=48.917413,11.407993\\&sspn=5.863386,9.404297\\&hq=Oskar-Laredo-Platz+1,\\&hnear=W%C3%BCrzburg,+Lower+Franconia,+Bavaria\\&t=m\\&z=14), 97080 Würzburg\\\nTelefon 0931.50612\\\n\_\\\nÖffnungszeiten Mi | Do | Fr | Sa 14 – 18 Uhr\n"
  en: |
    \*WONDERLAND\
    April 18 – May 12, 2013\*\
    Selected group show with work by Paraschiva Boiu. Sophie Brandes. Kathrin Feser. Ivonne Fernándes y González. Kristin Finsterbusch. Christiane Gaebert. Dorette Jansen. Vera Kattler. Brian Fitzgibbon. Edwin Kaiser. Hermann Oberhofer. Martin Rupprecht. Wolfgang Wieland.

    An exhibition on the occasion of the premiere of _Wonderland_, song cycle related to Lewis Carroll, Anno Schreier (music) and Alexander Jansen (text) at the Mainfranken Theater Würzburg, Kammerspiele, starts April 18. The premiere will begin at 8 pm, after the opening reception.

    A limited edition portfolio with 14 original graphics by all showing artist will be available for sale (190 Euro) at the Künstlerhaus ( Wed | Thur between 9 am and 6 pm ).

    **Opening reception, Thursday April 18 at 6 pm**

