body:
  de: |
    Im Rahmen der _Kitzinger Land Kulturstationen 2006_.

    _gestern heute_\
    Rauminstallation im historischen Rathaus von Dettelbach.\
    **7. bis 9. April 2006**

    _Das spätgotische Rathaus stammt aus dem 16. Jahrhundert. Nach einer Sage soll der Baumeister das Rathaus so geplant haben, dass drei Menschen, ohne sich zu sehen, das Rathaus gleichzeitig betreten konnten_.
  en: |
    An installation as part of the _Kitzinger County Culture Stops 2006_.

    _gestern|heute \[yesterday|today]_\
    in the Historic Civic Center of Dettelbach.\
    **4/7 till 4/9/2006**

    _The Civic Center, built in Late Gothic Style, dates back to the 16th Century. According to a tale, the house was planned the way that three people could enter the building at the same time without seeing each other_.
