title:
  de: circlefly take-off!
date: "2008-03-25"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/2_2008_fly.jpg
    title: circlefly San Francisco
body:
  de: |
    Heute ist ein ganz besonderer Tag. **Circlefly.de** startet in neue Höhen. Mit großer Freude kündige ich die Fertigstellung und den Start einer komplett neu überarbeiteten und aktualisierten Webseite an. Aller Verdienst gebührt Bronson McKinley, der alles das Innerste von Circlefly entwickelte. Er programmiert alles neu und leistete dabei grandiose Arbeit. Im Vergleich zu Circlefly der Ersten und Circlefly der Zweiten bietet Circlelfly die Dritte noch detailliertere Neuigkeiten, die [Galerie](/gallery/) ist in Kollektionen unterteilt, unter [Special](/special/) gibt es 3 Mafia-Boxen zum Durchfliegen, der Shop ist frisch aufgefüllt und bereit für PayPal, und Sie können sich bei [RSS-Feed](/rss.xml) anmelden um zukünftig im direkten Kontakt mit Circlefly zu bleiben.

    Wir werden weiterhin an Circlefly arbeiten, und die Webseite auf dem aktuellsten Stand der Technik und in Sachen Kunst halten. Über einen Kontakt via [Email](/contact/) freuen wir uns selbstverständlich immer und wir hoffen, dass viele sich für die zukünftigen [Newsletter](/newsletter/) anmelden werden. Nun wünschen wir erst einmal viel Spaß beim Erkunden von Circlefly!
  en: |
    Today is a very special day! **Circlefly.de** is taking off to new heights. With great pleasure I announce an entirely reworked, reengineered, and updated website. All merits belong to Bronson McKinley who developed Circlefly’s intestines. He newly programmed it and has done a fantastic job. In comparison to Circlefly the First, and Circlefly the Second, Circlefly the Third is now offering a much more detailed news section, its [gallery](/en/gallery/) is divided into collections, under [special](/en/special/) are three Mafia-Boxes to fly through, the [shop](/en/) is freshly stocked and ready to go with PayPal, and you can subscribe to an [RSS-Feed](/en/rss.xml) in order to stay into close and direct contact with Circlefly.

    We will continue working on Circlefly in keeping it up to date with what is going on in the arts, and also improve its technical standards. We always love getting [emails](/en/contact/), and hope that many will sign up for the [newsletter](/en/newsletter/). For now we wish you lots of fun while exploring Circlefly!
