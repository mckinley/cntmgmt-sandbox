body:
  de: |
    **MainArt Margetshöchheim 16. und 17. Juni 2018**\
    **Nr. 27** _Erlabrunner Straße 13 bei Monika und Martin Hermes_

    Kathrin Feser, Zeichnung, Fotografie, Collage\
    Dorette Jansen, Bildhauerin\
    Ron Renfro, Bildhauer

    Auftakt der Veranstaltung ist am Freitag, den 15. Juni um 16 Uhr am Rathaus.

    Das komplette Programm mit Übersicht aller Höfe findet sich auf\
    [mainartkulturverein](https://www.mainartkulturverein.de/mainart-2018/)

    Öffnungszeiten der Höfe\
    Samstag 13 – 21 Uhr | Sonntag 13 – 19 Uhr
  en: |
    Kathrin Feser, drawing, photography, collage\
    Dorette Jansen, sculptor\
    Ron Renfro, sculptor

    The event opens on Friday, June 15 at 4 pm at the town hall.

    The full programme with an overview of all courtyards can be found at\
    [mainartkulturverein](https://www.mainartkulturverein.de/mainart-2018/)

    Opening hours of the courtyards\
    Saturday 1 – 9 pm | Sunday 1 – 7 pm
