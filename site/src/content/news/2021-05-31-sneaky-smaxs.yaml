body:
  de: |
    **SNEAKY SMAXS**\
    hallo ihr lieben,\
    dieses wochenende, am 5.6 bis 6.6 von 14 – 19 uhr, findet die erste von drei ausstellungen in der kleinen industrie, mainstraße 7 – 10 in margetshöchheim, statt.

    Kathrin Feser – ich zeige einige meiner Collagen aus der aktuellen und fortlaufenden Ping-Pong Serie

    Helmut Nennmann,\
    Monika Rannert.

    wir freun uns auf euch!\
    \#kleineindustrie #margetshöchheim #kunst #comeby #invited #nichtverpassen
  en: |
    **SNEAKY SMAXS**\
    hello everyone,\
    this weekend, June 5–6 from 2 – 7 pm, the first of three exhibitions takes place at kleine industrie, Mainstraße 7–10 in Margetshöchheim.

    Kathrin Feser – I am showing some of my collages from the current ongoing Ping-Pong series

    Helmut Nennmann,\
    Monika Rannert.

    we look forward to seeing you!\
    \#kleineindustrie #margetshöchheim #kunst #comeby #invited #nichtverpassen
