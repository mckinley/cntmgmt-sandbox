  de: |
    „Tage der Offenen Ateliers“\
    in Veitshöchheim

    Sa, 21. und So, 22. Mai 2022\
    14 bis 19 Uhr

    Meine Ping-Pong Collagen und ein paar andere Arbeiten,\
    sowie Röcke und Taschen aus der Zusammenarbeit mit Katharina Schwerd,\
    Schmuck und Accessoires von Katharina Schwerd\
    im Atelier von Katharina Schwerd.

    Würzburger Str. 30, 97209 Veitshöchheim\
    <https://www.modedesign-schmuckdesign-katharina-schwerd.de/>
  en: |
    Days of Open Studios\
    in Veitshöchheim

    Sat, May 21 and Sun, May 22, 2022\
    2 to 7 pm

    My Ping-Pong collages and a few other works,\
    as well as skirts and bags from a collaboration with Katharina Schwerd,\
    jewellery and accessories by Katharina Schwerd\
    in Katharina Schwerd’s studio.

    Würzburger Str. 30, 97209 Veitshöchheim\
    <https://www.modedesign-schmuckdesign-katharina-schwerd.de/>
