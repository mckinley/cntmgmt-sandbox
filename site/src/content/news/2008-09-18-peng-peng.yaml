title:
  de: Peng! – Peng!
date: "2008-09-18"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/PengPeng.jpg
    title: Peng! – Peng!
body:
  de: |
    _Peng! – Peng!_\
    Ist der Titel meiner ersten Einzelausstellung in diesem Jahr.

    In der Galerie im Oberen Tor in Karlstadt zeige ich sowohl neue Arbeiten als auch solche, die bisher noch nie gezeigt wurden. Cut-outs, Acrylbilder, Wachsarbeiten, Nagellackobjekte, Fotos, Klebebandskulpturen und Assemblagen.

    Diese Ausstellung wird vom Duktus her eine ganz andere sein!

    Zur **Vernissage am Freitag den 26. September um 19 Uhr** möchte ich alle sehr herzlich einladen. Wie bereits bei meiner allerersten Einzelausstellung im Januar 2005 wird auch an diesem Abend wieder [Prof. Dr. Thomas Friedrich](http://de.wikipedia.org/wiki/Thomas_Friedrich), Professor für Designtheorie und Philosophie und Leiter des Instituts für Designwissenschaft an der Hochschule Mannheim, die einführenden Worte zu den Arbeiten sprechen. Prof. Dr. Thomas Friedrich arbeitete von 1995 bis 2002 als Kunstvermittler für die Messe ART-Frankfurt

    Die Ausstellung kann jeweils an den Freitagen, Samstagen und Sonntagen zu den angegebenen Öffnungszeiten besucht werden, oder auch an einem beliebigen Tag nach telefonischer Vereinbarung mit dem Galerist Herrn Beßler (Telefon 09353.2710). Am Sonntag, den **26. Oktober** um 17 Uhr endet _Peng! – Peng!_

    Hervorheben möchte ich noch, dass es anlässlich dieser Ausstellung 2 unterschiedliche Siebdrucke in jeweils limitierter Auflage von 50 Exemplaren geben wird. Eines der Motive ist das oben abgebildete Bild, _Peng! – Peng!_, 7-Farben-Druck, 60×40 cm.

    **Der Eintritt ist frei!**

    Galerie im Oberen Tor, Hauptstraße 77, Karlstadt\
    Öffnungszeiten Fr 17 – 19 Uhr, Sa|So 11 – 17 Uhr
  en: |
    _Peng! – Peng!_ This will be my first solo exhibition of 2008.

    All new, and never before presented work will be shown at the great space of a gallery named Galerie im Oberen Tor in Karlstadt. The array of pieces and media will be quite diverse. Having kept secret some ideas and pieces for quite some time now you might not right away link certain exponats to me, be surprised. You will find cut-outs, acrylics, wax, nail polish, photos, tape and assemblages.

    Compared to my shows from the past four years this one will be of a different kind of duct and atmosphere!

    I am inviting everybody to join me at the **opening reception on Friday September 26 at 7 pm**. With great joy and honor I am announcing Prof. Dr. Thomas Friedrich, who will be giving the introductory speech again, as he did for my very first solo show in January 2005. Thomas Friedrich is professor for Design Theory and Philosophy, as well as the leader of the Institute of Design Sciences at the University of Applied Sciences Mannheim. Between 1995 and 2002 he was working for the international and contemporary art fair ART-Frankfurt as referrer of the arts.

    You can visit the exhibition on fridays, saturdays and sundays during official opening hours, or you call the gallery owner, Mr. Beßler, phone +49.9353.2710 for an individual appointment. The show will end on Sunday **October 26** at 5 pm.

    There will be a new highlight at the gallery: two different silk screens with a limited edition of 50 prints each. One motive is the image above _Peng! – Peng!_ 7-color-print, 60 × 40 cm (23.6 × 15.7″)

    **Admission is free!**

    Galerie im Oberen Tor, Hauptstraße 77, Karlstadt\
    open Fr 5 – 7 pm, Sat|Sun 11 am – 5 pm
