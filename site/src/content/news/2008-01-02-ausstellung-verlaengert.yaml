title:
  de: Ausstellung verlängert!
  en: exhibition extended!
date: "2008-01-02"
lang: de
translation: reviewed
images:
  - src: /media/news/2008/Schwarzweller-TimeTravel.jpg
    title: History of Time Travel
body:
  de: |
    Meine Ausstellung [_Adieu Raufaser_](/news/2007-11-02-galerie-im-schwarzweller-in-wuerzburg/) in der Galerie im Schwarzweller ist bis zum **31. Januar** verlängert. Hinter dem Haus gibt es kostenlose Parkplätze für die Besucher.

    Galerie im Schwarzweller (Untergeschoß), Hofstraße 3, Würzburg\
    Öffnungszeiten Mo|Di|Mi|Do|Fr 9.30 – 18.30 Uhr, Sa 9.30 – 16.30 Uhr
  en: |
    The exhibition, [_Adieu Raufaser_](/en/news/2007-11-02-galerie-im-schwarzweller-in-wuerzburg/), at Gallery Schwarzweller has been extended to **January 31**. There is free parking for visitors behind the building.

    Gallery Schwarzweller, Hofstraße 3, Würzburg\
    Mon|Tue|Wed|Thu|Fri 9.30 am – 6.30 pm, Sat 9.30 am – 4.30 pm
