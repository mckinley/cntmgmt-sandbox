title:
  de: Porcelynne in San Francisco
date: "2007-11-03"
lang: de
translation: reviewed
images:
  - src: /media/news/2007/porcelynne.jpg
body:
  de: |
    Um wenige Stunden zeitversetzt beginnt eine weitere **Einzelausstellung** und zwar in dem [Porcelynne Designer Collective](http://www.porcelynne.com) – eine Kooperative aus 14 innovativen Mode- und Schmuckdesignern im kalifornischen San Francisco. Die Ausstellung hat den Titel _outer space leap frog \[Bocksprung im Weltall]_, die dazu gehörende Vernissage findet ebenfals am **10. November** von **18 bis 22 Uhr** Ortszeit statt. Leider kann ich nicht selbst anwesend sein. Ich möchte dennoch alle Interessierten sehr herzlich zu einem Besuch von Porcelynne einladen. Meine Cut-Outs und Mafia-Boxen sind dort bis einschließlich **30. November** zu besichtigen. Der Laden mit Galerie befindet sich im kulturell hoch interessanten und sehr lebendigen Mission District (südlich der Market Street).

    Porcelynne Designer Collective, 487 14th Street, San Francisco, CA\
    Öffnungszeiten Mo|Di|Mi 13 – 19 Uhr, Do|Fr|Sa 11 – 19 Uhr, So 12 – 18 Uhr
  en: |
    Another **one person show** will open at [Porcelynne Designer Collective](http://www.porcelynne.com) in San Francisco, CA. The show is titled _outer space leap frog_, and has its opening reception on **November 10 between 6 pm and 10 pm**. Unfortunately I wont make it to this special event. But I’d love to invite everyone interested to visitit Porcelynne either that night or any day until **November 30**. I will be showing cut-outs and Mafia-Boxes.

    [Porcelynne Designer Collective](http://www.porcelynne.com), 487 14th Street, San Francisco, CA\
    open Mon|Tue|Wed 1 – 7 pm, Thu – Sat 11 am – 7 pm, Sun 12 – 6 pm
