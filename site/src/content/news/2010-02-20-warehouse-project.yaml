body:
  de: |
    **Emerging Artists Collective @ Shooting Gallery**

    ### **” W A R E H O U S E P R O J E C T “**

    Kommt zur [Shooting Gallery](http://www.shootinggallerysf.com/) und unterstützt so die [Emerging Artists Collective](http://www.eacollectivesf.com/) ! Ausgewählte Künstler haben hierfür beeindruckende Werke gespendet:

    Hugh Leeman, Jesse Hazelip, Richard Colman, Mike Shine, Steve MacDonald, D Young V, Aaron Lawrence, Matt Miller, Blackstock, Tandy Kunkle, Thomas Landerman, Rex Waters, Doug Fortin, Jessica Dean Harrison, John Felix Arnold III, Jason Story, Kathrin Feser, Jeremy Novy & mehr…

    Sämtliche Arbeiten sind zu erwerben. Der gesamte Erlös kommt direkt der _Emerging Artists Collective_ zu Gute.

    Shooting Gallery\
    839 Larkin Street, zwischen O’Farrell Street und Geary Street, [siehe Karte](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=839+Larkin+Street,+San+Francisco,+CA\&sll=37.0625,-95.677068\&sspn=47.033113,77.695313\&ie=UTF8\&hq=\&hnear=839+Larkin+St,+San+Francisco,+California+94109\&z=16)\
    San Francisco\
    Freitag, 26. Februar, 19 bis 23 Uhr
  en: |
    **Emerging Artists Collective @ Shooting Gallery**

    ### **“ W A R E H O U S E P R O J E C T “**

    Come out to [Shooting Gallery](http://www.shootinggallerysf.com/) and support the [Emerging Artists Collective](http://www.eacollectivesf.com/) ! There’ll be amazing art donated by talented artists like:

    Hugh Leeman, Jesse Hazelip, Richard Colman, Mike Shine, Steve MacDonald, D Young V, Aaron Lawrence, Matt Miller, Blackstock, Tandy Kunkle, Thomas Landerman, Rex Waters, Doug Fortin, Jessica Dean Harrison, John Felix Arnold III, Jason Story, Kathrin Feser, Jeremy Novy & more…

    All art is for sale and proceeds will go directly to supporting the _Emerging Artists Collective_.

    Shooting Gallery\
    839 Larkin Street, between O’Farrell Street and Geary Street, [see map](http://maps.google.com/maps?f=q\&source=s_q\&hl=en\&geocode=\&q=839+Larkin+Street,+San+Francisco,+CA\&sll=37.0625,-95.677068\&sspn=47.033113,77.695313\&ie=UTF8\&hq=\&hnear=839+Larkin+St,+San+Francisco,+California+94109\&z=16)\
    San Francisco\
    Friday, February 26th, 7pm – 11pm
