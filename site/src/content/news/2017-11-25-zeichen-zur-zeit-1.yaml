  de: |
    AUSSTELLUNG: WERKSTATTGALERIE\
    Sa 02.12.17 – So 17.12.17

    BBK Mitgliederausstellung:\
    **Zeichnen zur Zeit I**\
    Die Zeichnung ist ein Spiegel für unser unmittelbares Denken. Wie unterschiedlich der menschliche Gedanke ist, können wir in einer Zeichnung lesen. Ihr Erscheinungsbild wirft ein facettenreiches Licht auf uns und unsere Zeit. Zu sehen sind zeichnerische Positionen von Katrin Feser, Kristin Finsterbusch, Christiane Gaebert, Bettina Gammert, Jürgen Hochmuth, Kathrin Hubl, Hans Krakau, Barbara Pape, Burkhard Schürmann, Linda Schwarz, Helga Schwalt-Scherer, Ines Schwerd und Anita Tschirwitz. Vernissage: Fr 01.12.17, 19.00 Uhr, Werkstattgalerie
  en: |
    EXHIBITION: WERKSTATTGALERIE\
    Sat Dec 2 – Sun Dec 17, 2017

    BBK member exhibition:\
    **Zeichnen zur Zeit I**\
    Drawing is a mirror of our immediate thinking. We can read in a drawing how diverse human thought is. Its appearance casts a many-faceted light on us and our time. On view are drawing positions by Kathrin Feser, Kristin Finsterbusch, Christiane Gaebert, Bettina Gammert, Jürgen Hochmuth, Kathrin Hubl, Hans Krakau, Barbara Pape, Burkhard Schürmann, Linda Schwarz, Helga Schwalt-Scherer, Ines Schwerd and Anita Tschirwitz. Opening reception: Fri December 1, 2017, 7 pm, Werkstattgalerie
