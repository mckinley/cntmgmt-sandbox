body:
  de: |
    **Kunstschiff ARTE NOAH spielt PING PONG**

    Das Kunstschiff ARTE NOAH öffnet nach zwei ausgefallenen Hauptausstellungen seine Gangway im Alten Hafen für alte Freunde: Das Format Sommerausstellung zeigt PING PONG mit Werken von Matthias Braun, Kathrin Feser, Kristin Finsterbusch und Kerstin Römhild. Damit würdigt der Kunstverein die jahrzehntelange gute Nachbarschaft mit dem Berufsverband Bildender Künstlerinnen und Künstler (BBK) im Alten Hafen Würzburg. Wegen der aktuellen Lage findet keine Vernissage statt. Bis zu fünf Gäste mit Mundschutz gleichzeitig können sich die Ausstellung ansehen. An den Sonntagen sind die Künstlerinnen und Künstler abwechselnd anwesend. Der Eintritt ist frei.

    **PING PONG**\
    **Matthias Braun, Kathrin Feser, Kristin Finsterbusch und Kerstin Römhild**

    BBK Unterfranken Sommerausstellung des Kunstvereins Würzburg im Rahmen der Kooperation mit Kulturträgern im Alten Hafen

    **14.06. bis 05.07.2020**

    Die Ausstellung PING PONG vermischt in gemeinsamem Wechselspiel realistische und unrealistische Elemente mit Bekanntem aber auch Unbekanntem, erzeugt eine Betrachtung, die einem pingpongähnlichen Zustand sehr nahe kommt. Dabei ist nicht nur die Korrespondenz zwischen den bildlichen Akteuren und Objekten sondern und vor allem die Möglichkeit, Dinge unserer erfahrenen Welt gedanklich in Bewegung zu halten.

    Kunstschiff [ARTE NOAH](https://www.kunstverein-wuerzburg.de/cms/website.php?id=/de/index/arte-noah.htm)\
    Alter Hafen Würzburg (hinter dem Kulturspeicher)\
    Do / Fr / Sa und feiertags 15 – 18 Uhr,\
    So 12 – 18 Uhr.\
    Eintritt frei
  en: |
    **Art ship ARTE NOAH plays PING PONG**

    The art ship ARTE NOAH, after two cancelled main exhibitions, opens its gangway at the Old Harbour for old friends: the summer exhibition format presents PING PONG with works by Matthias Braun, Kathrin Feser, Kristin Finsterbusch and Kerstin Römhild. The Kunstverein honours this way the decades-long neighbourly relationship with the Professional Association of Visual Artists (BBK) at the Old Harbour in Würzburg. Due to the current situation, there will be no opening reception. Up to five guests with masks may view the exhibition at a time. On Sundays the artists will be present in turn. Admission free.

    **PING PONG**\
    **Matthias Braun, Kathrin Feser, Kristin Finsterbusch and Kerstin Römhild**

    BBK Unterfranken summer exhibition of Kunstverein Würzburg as part of the cooperation with cultural venues at the Old Harbour

    **June 14 – July 5, 2020**

    The exhibition PING PONG blends, in a shared back-and-forth, realistic and unrealistic elements with the familiar and the unfamiliar, creating a mode of viewing that comes close to a ping-pong-like state. At stake is not only a correspondence between the pictorial actors and objects, but above all the possibility of keeping things from our experienced world in mental motion.

    Art ship [ARTE NOAH](https://www.kunstverein-wuerzburg.de/cms/website.php?id=/de/index/arte-noah.htm)\
    Old Harbour Würzburg (behind the Kulturspeicher)\
    Thur / Fri / Sat and public holidays 3 – 6 pm,\
    Sun 12 – 6 pm.\
    Admission free
