body:
  de: |
    _Finissage der Etrusker Ausstellung_\
    Ein großartiges Event am findet am Faschingssonntag, **18. Februar von 17 Uhr bis Mitternacht** in der Antikensammlung des Martin von Wagner Museums im Südflügel der Fürstbischöflichen Residenz in Würzburg statt. Zugang durch den Innenhof neben der Hofkirche. Die Ausstellungsräume befinden sich im 2. und 3. Stockwerk. Zur Finissage dieser bedeutenden Ausstellung im Museum können die Gäste in den Räumlichkeiten lustwandeln und sich an den verschiedensten Darbietungen künstlerischer, unterhaltender und kulinarischer Art erfreuen. Die teilnehmenden Bildenden Künstler sind [Sonja Edle von Hößle](http://www.edle-von-hoessle.de/), [Herbert Mehler](http://www.herbert-mehler.de/mehler/aktuelles/), [Linda Schwarz](http://www.paperpress.com/) und Kathrin Feser.
  en: |
    _Closing Reception of the Etruscan Exhibition_\
    Sunday (Carnival), **February 18, 5 pm till midnight**

    Antiquity Collection at Martin-von-Wagner-Museum located in the former prince bishop’s residence (South-Wing) in Würzburg. The entrance is on the right side of the courtyard, next to the chapel. The exhibitions, concerts, performances, culinary delights and rooms for strolling or lounging are all located on the 3rd and 4th floor. Participating visual artists are Sonja Edle von Hößle, Herbert Mehler, Linda Schwarz and Kathrin Feser.
