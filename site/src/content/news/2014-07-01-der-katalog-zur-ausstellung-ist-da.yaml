body:
  de: |
    **»SIGMA«\
    Wenn der Zufall zum Plan wird.\
    von Christiane und Kathrin Feser**

    Details: Zahlreiche Abbildungen, mit einem Text von Anna Katharina Feldhaus, Vorwort von Mario Vittoria. Gestaltung: Pixelgarten (Catrin Altenbrandt, Kai Bergmann, Adrian Nießler). 2×32 Seiten, 2 x Rückstichheftung, Wendekatalog, 17×24 cm . Deutsch und Englisch . ISBN 978-3-942311-15-1— 12,00 EUR

    (...) “Während Kathrin Feser also mit vorgefundenen Formen arbeitet, sie nachzieht und zu wundersamen Kosmen verdichtet, baut Christiane Feser sich die Bedingungen ihres künstlerischen Aktionsfeldes selbst. Kathrin Feser entführt in den Rausch astronomischer Fantasien, während Christiane Feser bewusst Natur und Artefakt miteinander verschränkt, kühl mit Zweidimensionalität kalkuliert und in der Folge mit dreidimensionaler Wirklichkeit irritiert. Der Zufall wird im Werk sowohl von Christiane Feser als auch von Kathrin Feser zum Komplizen der Komposition. Und der jeweils verwendete Apparat wird Mittel zum Zweck: Er ermöglicht, frei nach André Bazin, eine „wahre Halluzination“. So ist das jeweilige Ganze eben doch mehr als die Summe seiner Teile.” (...).\
    Auszug aus dem Katalogtext von Anna Katharina Feldhaus

    [bruno dorn verlag](http://debook.de)\
    [shop](http://debook.de/shop.php?pgid=4\&q=sigma\&category\[]=all)
  en: |
    \*»SIGMA«\
    When coincidence provides intention.\
    about Christiane and Kathrin Feser\*

    Details: numerous images, with a text by Anna Katharina Feldhaus, preface by Mario Vittoria. Design: Pixelgarten (Catrin Altenbrandt, Kai Bergmann, Adrian Nießler). 2 × 32 pages, 2 x back-stitch-sewing, turn around catalog, 6.7″ × 9.5″ . **All text comes in German and in English**. ISBN 978-3-942311-15-1— 12,00 EUR

    (…) “Kathrin is working with found forms, tracking them and adding density to a wondrous cosmos, She carries us away into the state of euphoria through astronomical fantasies. Christiane is building the conditions of her artistic area of activity as well—deliberately interlacing nature and artifact, coolly calculating two-dimensionality and consequently, confounding the three-dimensional reality. Coincidence turns accomplice with the compositions of Christiane and Kathrin Feser. The respectively used apparatus turns means to an end: it enables André Bazin’s “pure hallucination.” There is order in chaos. Coincidence follows a plan. This is why the whole is more then the sum of its parts, especially when pursued by the artist.” (…).\
    Excerpt from catalog text by Anna Katharina Feldhaus.

    [bruno dorn verlag](http://debook.de)\
