title:
  de: Count Down
date: "2005-01-07"
lang: de
translation: reviewed
images:
  - src: /media/news/2005/more_f.jpg
body:
  de: |
    Ich habe gerade nur sehr wenig Zeit. Die Vernissage beginnt in 2 Stunden.

    _more.mehr_\
    Einzelausstellung

    **7. bis 30. Januar 2005**\
    **Vernissage, heute um 18 Uhr**\
    Einführung Prof. Dr. Thomas Friedrich, Professor an der Hochschule für Gestaltung Mannheim

    BBK Galerie im Kulturspeicher, Veitshöchheimer Straße 5 in Würzburg\
    Öffnungszeiten Di|Mi 11 – 18 Uhr, Do|Fr|Sa 13 – 20 Uhr, So 11 – 18 Uhr

    Begleitend zur Ausstellung ist ein umfangreicher Katalog erschienen, der numeriert und signiert ist.\
    **Einführungstext Prof. Dr. Thomas Friedrich**:\
    [Deutsche Gesellschaft für Semiotik e.V.](http://www.semiose.de/index.php?id=0,34)\
    [Designzentrum Berlin](http://www.forum-entwerfen.de/themen/460.html)\
    [Hochschule für Gestaltung Mannheim](http://www.gestaltung.hs-mannheim.de/designwiki/idw/)

    An dieser Stelle werden in ein paar wenigen Tagen sehr viele Neuigkeiten zu lesen und Bilder der Ausstellung zu betrachten sein. Ich hoffe Euch gefällt die Webseite. Viel Spaß beim Umherfliegen!
  en: |
    Little time left. The big opening will start in 2 hours.

    In a few days there will be lots of news to be read.\
    Hope you like the website.\
    Have fun flying around!
