body:
  de: |
    Kunstzeitlauf und offene Ateliers in Veitshöchheim.\
    _Neue Kunst im alten Kupsch_\
    **25. und 26. März 2006**

    Auftakt ist eine Gruppenausstellung am Samstag, 25.3., ab 18 Uhr im alten Kupsch, Thüngersheimer Straße 21, Veitshöchheim, mit Band und Büffet.

    Sonntag zusätzlich von 14 bis 19 Uhr offene Ateliers.

    _Der Kupsch im Altort von Veitshöchheim, ein seit längerem leerstehnder Supermarkt (v. lat.: super über, mercatus Handel) – ideal also um temporär in eine Galerie umgewandelt zu werden_.
  en: |
    **KunstZeitLauf and open studios in Veitshöchheim**\
    _New art in the old Kupsch_\
    **3/25 and 3/26/2006**\
    It is the weekend when all clocks will be switched to light savings time.\
    Hence, Sunday will be short, therefore you better run!

    Group show with its prelude Saturday, 3/25, starting at 6 pm in the old and abandoned Kupsch building, Thüngersheimer Straße 21, Veitshöchheim. There will be live music and good food.

    In addition, open studios on Sunday between 2 and 7 pm.

    _Kupsch in downtown Veitshöchheim is an empty and vacant supermarket (from latin: super above, mercatus trade) – ideal for being turned into a temporary gallery_.
