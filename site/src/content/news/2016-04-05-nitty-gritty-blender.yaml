body:
  de: |
    **Ausstellung nur 8. – 17. April 2016**\
    **Einzelausstellung – Kathrin Feser – nitty-gritty blender**\
    in der BBK-Galerie Würzburg

    “Vom Leben in der zur Zeit\
    teuersten Metropole Amerikas –\
    sonnenhell und luftgekühlt.“\
    Foto, Collage, Zeichnung, Anderes.

    **Vernissage Freitag, 8. April, 19 Uhr**\
    Einführung Bernd Kessener

    **Finissage Sonntag, 17. April, 16 Uhr**\
    Wird sich von Vernissage stark unterscheiden…

    Sieben sehr ereignisreiche, ausstellungsoffene Tage gehen damit zuende\
    – und damit die letzte Chance die gesamte Installation noch zu besuchen.\
    **Don’t miss it!**

    **Programm:**

    - Odradek aka Ruth Dommaschk M.A. wird ein paar erläuternde Worte zu den Bildern sagen

    * ¡Musica de Mexico extra por la piñata!

    - Margarita mixing’n drinking

    * Piñata bashing

    Die Öffnungszeiten dieser Ausstellung weichen von denen auf der BBK-WebSeite aufgelisteten ab…..siehe unten!

    Ich freue mich über Euren Besuch!\
    [Facebook](https://www.facebook.com/events/224182544607983/)

    [BBK-Galerie](http://www.bbk-unterfranken.de/de/bbk.1.html)\
    [Oskar-Laredo-Platz 1, Würzburg](https://goo.gl/maps/fa5TsaXgEE52)

    Öffnungszeiten:\
    Samstag, 9. April 15 – 19 Uhr.\
    Sonntag 10. April 12 – 18 Uhr\
    Donnerstag, 14. April, 15 – 19 Uhr\
    Freitag 15. April, 15 – 19 Uhr,\
    Samstag 16. April 15 – 20 Uhr,\
    Sonntag, 17. April, ab 12 Uhr….Ausstellungsabbau noch am selben Tag, Helfer sehr willkommen!
  en: |
    **Exhibition only from April 8 til April 17 2016**\
    **a solo show – Kathrin Feser – nitty-gritty blender**\
    at the BBK-gallery in Würzburg

    “About life in the most expensive metropolitan area of America –\
    sunny and chilled.“\
    Media: photo, collage, drawing, other.

    **Opening reception on Friday April 8 at 7 pm**\
    Introduction Bernd Kessener

    **Closing reception Sunday April 17 at 4 pm**\
    This event will greatly differ from the opening night….update in a couple of days!

    Opening hours vary from those listed on the BBK‘s WebSite….see below!

    Looking forward to your visit!….I will be there all the time.\
