title:
  de: Wintersalon 2014 Nürnberg
  en: Winter-Salon 2014 Nuremberg
date: "2014-11-09"
lang: de
translation: reviewed
images:
  - src: /media/news/2014/GalerieHausNordWintersalon2014.jpg
    title: GaleriehausNord Nürnberg
body:
  de: |
    Die Schau versammelt neue und vertraute Künstler/innen – nicht nur aus der Metropolregion Nürnberg – mit aktuellen künstlerischen Positionen von Malerei, Zeichnung, Fotografie, Skulptur und Objekt. Mit von der Partie sind in diesem Jahr bis zu 30 Künstler/innen, mit jeweils bis zu vier Werken. Von den abgegebenen Arbeiten wählt die Hängekommission Exponate für die Ausstellung aus.

    _Gertrud Aumayr, Georg Baier, Tanja Engelke, Kathrin Feser, Barbara Geier-Häckh, Anna Handick, Rudolf Haering, Merja Herzog-Hellstén, Stefan Hippel, Gisela Hoffmann, Bettina Jaennicke, Rita Kriege, Lisa Metz, Petra Naumann, Gabriele Olesch, Matthias Otto, Friedrich Popp, Christine Regenberg, Joseph Raimond, Wolf Sakowski, Pirko Julia Schröder, Margarete Schrüfer, Linda Schwarz, Andrea Sohler, Helga Heidi Sommerkorn, Margit Sippl-Erlbacher, Walter Thaler, Klemens Wuttke, Axel Voss._

    **Das Eröffnungsfest ist am Sonntag 23. November, 14 bis 18 Uhr.\
    Die Ausstellung geht bis einschließlich 11. Januar 2015.**

    Öffnungszeiten: Di + Mi 11 – 16 Uhr, Do + Fr 11-13 Uhr, So 11 – 16 Uhr\
    und nach telefonischer Vereinbarung unter Telefon 0911.55 33 87.\
    [Galeriehaus Nord](http://www.galeriehaus-nuernberg-nord.de)\
    Wurzelbauerstraße 29, 90409 Nürnberg
  en: |
    The gallery will present works by 30 artists beyond the metropolitan region of Nuremberg. Showing their contemporary positions in the media of painting, drawing, photography, and sculpture. There will be up to four pieces shown by each artist.

    \*The opening festivity will be on Sunday November 23 from 2 pm to 6 pm.\
    The exhibition will be going on until January 11, 2015.\*

    _Gertrud Aumayr, Georg Baier, Tanja Engelke, Kathrin Feser, Barbara Geier-Häckh, Anna Handick, Rudolf Haering, Merja Herzog-Hellstén, Stefan Hippel, Gisela Hoffmann, Bettina Jaennicke, Rita Kriege, Lisa Metz, Petra Naumann, Gabriele Olesch, Matthias Otto, Friedrich Popp, Christine Regenberg, Joseph Raimond, Wolf Sakowski, Pirko Julia Schröder, Margarete Schrüfer, Linda Schwarz, Andrea Sohler, Helga Heidi Sommerkorn, Margit Sippl-Erlbacher, Walter Thaler, Klemens Wuttke, Axel Voss._

    Admission is free!

    open Tue + Wed 11 am – 4 pm, Thu + Fri 11 am -1 pm, Sun 11 am – 4 pm\
    and by request, phone 011.49.911.55 33 87.\
    www\.galeriehaus-nuernberg-nord.de\
    Wurzelbauerstraße 29, 90409 Nürnberg
