body:
  de: |
    **Anmeldung für den Circlefly Newsletter**

    Mit dem Newsletter erhalten Sie von mir via Email aktuelle Informationen mit Neuigkeiten über Ausstellungen, Projekte und andere interessante Ereignisse. Informationen, die auf der Webseite nicht oder zumindest in geringerem Ausmaß gegeben werden können. Der Newsletter wird aller Voraussicht nach in unregelmäßigen Abständen erscheinen, geplant sind aber **circa 4 Ausgaben pro Jahr**.

    Um den Circlefly Newsletter zu abonieren müssen Sie lediglich Ihren Namen und Ihre Email-Adresse eingeben. Im Anschluß erhalten Sie ein Bestätigungs-Email. Klicken Sie dann nur noch auf den Link in diesem Email, damit ist Ihre Anmeldung abgeschloßen.

    Vielen Dank für das Interesse,\
    Kathrin Feser
  en: |
    **Subscribing to the circlefly Newsletter**

    When you sign up for the newsletter you will receive infrequent emails from me about news of my exhibitions, projects, and other interesting events. The content includes information that you won’t find, or will find only to a certain extent, on my website. I plan to send out a newsletter **approximately 4 times a year** but that is of course a rough estimate.

    To sign up for the circlefly newsletter, fill in your name and email address. You will then receive a confirmation email. Simply click on the link in the confirmation email to complete your subscription.

    Thanks,\
    Kathrin Feser
